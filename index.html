/* ========== 基础与移动端适配 ========== */
:root{
  --blue:#2F7DF6;
  --bg:#F5F7FA;
  --text:#1F2A44;
  --muted:#8A94A6;
  --line:#EEF1F7;
  --soft:#E8EDF5;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;background:var(--bg);}
/* overflow-x:hidden 在部分浏览器会把 overflow-y 计算成 auto，可能使 sticky 失效；
   支持 clip 的浏览器改用 clip（不创建滚动容器），保证状态条 sticky 生效 */
@supports (overflow-x:clip){ html,body{overflow-x:clip;} }
html{-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  color:var(--text);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;touch-action:manipulation;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit;-webkit-tap-highlight-color:transparent;}
input{font-family:inherit;font-size:16px;-webkit-tap-highlight-color:transparent;}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
#app{
  max-width:100%;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
}
#app-header{
  max-width:480px;width:calc(100% - 24px);margin:0 auto 12px;
  padding:17px 16px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(110deg,#E8F2FF 0%,#F4F9FF 46%,#FFFFFF 100%);
  border:1px solid #E3EDFB;border-radius:22px;
  box-shadow:0 2px 10px rgba(47,125,246,.05);
}
.avatar{
  width:66px;height:66px;flex:0 0 66px;border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 9px rgba(60,110,190,.12);
}
.header-name{flex:1 1 auto;min-width:0;}
.header-name-inner{display:flex;align-items:center;min-width:0;gap:10px;}
.header-name-text{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:21px;font-weight:800;letter-spacing:.5px;}
.header-date{margin-top:7px;font-size:14px;color:var(--muted);}
.icon-btn{
  width:44px;height:44px;flex:0 0 44px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:12px;color:var(--muted);font-size:22px;line-height:1;
}
.icon-btn:active{background:#EEF3FB;}
.icon-btn.edit-btn{
  width:auto;height:auto;flex:0 0 auto;padding:5px 11px;gap:4px;
  border:1px solid #BED7FF;border-radius:999px;
  background:#fff;color:var(--blue);font-size:13px;font-weight:600;line-height:1;
}
.icon-btn.edit-btn:active{background:#F0F6FF;}
.icon-btn.edit-btn svg{width:13px;height:13px;flex:0 0 13px;}
@media (max-width:360px){
  #app-header{padding:14px 12px;gap:10px;}
  .avatar{width:56px;height:56px;flex:0 0 56px;}
  .avatar svg{width:31px;height:31px;}
  .header-name-text{font-size:18px;}
  .header-date{font-size:13px;}
}
.wrap{max-width:480px;margin:0 auto;padding:0 12px;}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(30,60,110,.06);padding:16px;margin-bottom:12px;}
.section-title{font-size:16px;font-weight:700;margin-bottom:12px;}
.empty-line{font-size:14px;color:var(--muted);padding:6px 0;}
.empty-block{font-size:14px;color:var(--muted);text-align:center;padding:22px 8px;line-height:1.6;}

/* ========== 状态条（仅计时中渲染，sticky） ========== */
#status-bar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  max-width:480px;width:calc(100% - 24px);margin:8px auto 10px;padding:0 14px;
  min-height:50px;display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.92);border-radius:14px;
  box-shadow:0 4px 16px rgba(30,60,110,.10);
}
.status-text{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600;color:var(--blue);}
.status-dot{flex:0 0 12px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 4px rgba(47,125,246,.10);}

/* ========== 今日概览：单一焦点 40px 今日累计 + 8px 细进度条 ========== */
.ov-label{font-size:13px;color:var(--muted);}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;display:inline-block;}
.ov-total{padding:2px 0 14px;}
.ov-headline{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
#stat-target{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
.ov-numbers{display:flex;align-items:baseline;font-size:40px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums;}
#stat-total{color:var(--text);}
.ov-progress-track{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;}
.ov-progress-fill{height:100%;width:0;border-radius:8px;background:var(--blue);transition:width .25s ease;}
.ov-progress-text{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 0 0;}
#stat-percent-text{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;background:#EAF2FF;color:var(--blue);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
#stat-remaining{font-size:13px;color:var(--muted);}

/* ========== 今日时间分布：24 格 × 1 小时，格内按比例填充 ========== */
.tl-wrap{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.tl-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;}
.tl-title{font-size:13px;font-weight:700;}
.tl-hint{font-size:11px;color:var(--muted);}
.tl-ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;margin:0 1px 5px;}
.tl-track{display:flex;gap:2px;height:34px;}
.tl-cell{position:relative;display:block;flex:1 1 0;min-width:0;padding:0;border:1px solid var(--line);border-radius:3px;background:var(--soft);overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.tl-cell:hover,.tl-cell.is-open{outline:2px solid var(--blue);outline-offset:1px;z-index:2;}
.tl-blk,.tl-gap{position:absolute;top:0;bottom:0;border-radius:2px;pointer-events:none;}
.tl-gap{background:repeating-linear-gradient(45deg,#F4F6FA,#F4F6FA 4px,#E4E9F1 4px,#E4E9F1 8px);}
.tl-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11px;color:var(--muted);}
.tl-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;border:1px solid var(--line);}
.tl-legend i.tl-gap-mark{background:repeating-linear-gradient(45deg,#F4F6FA,#F4F6FA 3px,#E4E9F1 3px,#E4E9F1 6px);}
.tl-blank{margin-top:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.tl-detail{margin-top:10px;padding:10px 12px;border-radius:10px;background:#F7F9FC;}
.tl-detail-title{font-size:12px;font-weight:700;margin-bottom:6px;font-variant-numeric:tabular-nums;}
.tl-detail-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px;}
.tl-detail-row:last-of-type{border-bottom:0;}
.tl-detail-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-detail-time,.tl-detail-min{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums;}
.tl-detail-gap{color:var(--muted);}
.tl-gap-dot{background:repeating-linear-gradient(45deg,#F4F6FA,#F4F6FA 3px,#E4E9F1 3px,#E4E9F1 6px);border:1px solid var(--line);}
.tl-empty{font-size:12px;color:var(--muted);padding:4px 0;}
.tl-detail-close{display:block;margin:8px 0 0;padding:4px 0;font-size:12px;color:var(--blue);}
/* 第十六轮：明细框底部「收起 / ＋ 补记一段时间」并排；所有格子都显示 */
.tl-detail-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}
.tl-detail-foot .tl-detail-close{margin:0;}
.tl-add-btn{flex:0 0 auto;border:0;background:var(--blue);color:#fff;font-size:12px;font-weight:600;padding:7px 11px;border-radius:9px;cursor:pointer;white-space:nowrap;}
.tl-add-btn:active{background:#1E6BE0;}
.modal-select{text-align:left;padding-right:10px;}

/* ========== 项目卡片 ========== */
/* 外层 .card 是唯一白底容器；内部项目行只留 1px 细分隔线与色条，不再套白卡 */
.project-card{
  position:relative;background:#fff;
  padding:0 0 0 10px;min-height:48px;display:flex;align-items:center;
}
.project-card:not(:last-child){border-bottom:1px solid var(--line);}
/* 新建项目：一次短暂的浅蓝底高亮，约 1 秒后淡出 */
.project-card.flash-new{animation:flash-new 1s ease-out;}
@keyframes flash-new{
  0%,55%{background-color:#DCEBFF;}
  100%{background-color:#FFFFFF;}
}
.proj-stripe{position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--accent,#5B8FF9);}
.proj-body{flex:1 1 auto;min-width:0;}
.proj-top{display:flex;align-items:center;gap:8px;min-width:0;min-height:48px;}
.proj-name{flex:0 1 auto;min-width:0;font-size:14px;font-weight:700;}
.proj-spacer{flex:1 1 auto;min-width:4px;}
.proj-today{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;white-space:nowrap;font-size:12px;color:var(--muted);line-height:1.25;}
.interrupt-note{font-size:11px;color:#AEB7C6;}
.menu-btn{font-size:22px;color:#9AA6B8;flex:0 0 44px;}
/* 目标胶囊、按钮独占行已移除；.proj-actions 新样式见文件末尾重构块 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  height:48px;min-height:48px;padding:0 12px;border-radius:12px;
  font-size:15px;font-weight:600;text-align:center;white-space:nowrap;min-width:0;
  transition:transform .08s ease,background .15s ease;
}
.btn:active{transform:scale(.985);}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(47,125,246,.22);}
.btn-outline{background:#fff;color:var(--blue);border:1.5px solid #BFD6FB;}
.btn-danger{background:#E8534A;color:#fff;}
.btn-disabled{opacity:.6;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1 1 0;min-width:0;}
.proj-menu{
  position:absolute;right:8px;top:50px;z-index:30;
  width:176px;max-width:calc(100% - 16px);
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 28px rgba(30,60,110,.16);padding:6px;
}
.menu-item{display:flex;align-items:center;width:100%;min-height:44px;padding:0 12px;border-radius:8px;font-size:14px;color:var(--text);text-align:left;}
.menu-item:active{background:#F2F7FF;}
.menu-item.danger{color:#E0453B;}

/* ========== 记录列表 ========== */
.record-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.record-row:last-child{border-bottom:0;}
.rec-main{flex:1 1 auto;min-width:0;}
.rec-line1{display:flex;align-items:center;gap:8px;min-width:0;}
.rec-name{flex:1 1 auto;min-width:0;font-size:14px;font-weight:600;}
.rec-time{flex:0 0 auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;}
.rec-line2{font-size:14px;color:var(--muted);margin-top:2px;}
.tag{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:6px;font-size:14px;color:#E8833A;background:#FFF3E6;}
.tag-running{color:var(--blue);background:#EAF2FF;}
.rec-del{flex:0 0 44px;color:#B4BDCB;font-size:24px;}
.rec-del:active{color:#E0453B;background:#FFF1F0;}

/* ========== 底部生成按钮：44px 描边次按钮（低频动作降级） ========== */
.generate-btn{
  width:100%;height:44px;border-radius:12px;
  background:#fff;color:var(--blue);border:1.5px solid #BFD6FB;
  font-size:15px;font-weight:700;margin-top:4px;box-shadow:none;
}
.generate-btn:active{transform:scale(.99);background:#F7FAFF;}
.footer-note{text-align:center;font-size:14px;color:#A6AFC0;margin-top:14px;}
.app-version{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:#AEB8C8;letter-spacing:.6px;vertical-align:1px;}

/* ========== 跨设备同步条（v0.3A） ========== */
#sync-bar{margin:16px 0 0;display:flex;align-items:stretch;gap:8px;}
#sync-bar .sync-bar{flex:1 1 0;min-width:0;width:auto;}
/* v0.3H：立即同步 —— 与设置入口并排的独立按钮，仅启用同步时出现 */
.sync-now{
  flex:0 0 auto;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:5px;
  min-width:44px;min-height:44px;padding:0 13px;
  border:1px solid #D9E6FB;border-radius:14px;background:#F2F7FF;color:var(--blue);
  font-size:13px;font-weight:600;line-height:1;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.sync-now:active{background:#E7F0FF;transform:scale(.99);}
.sync-now:disabled{opacity:.5;cursor:default;transform:none;}
.sync-now-ico{font-size:17px;line-height:1;}
.sync-bar{
  display:flex;align-items:center;gap:9px;width:100%;box-sizing:border-box;
  padding:11px 14px;border:1px solid #E4EAF3;border-radius:14px;background:#fff;
  font-size:13.5px;line-height:1.4;color:#5A6B85;text-align:left;
  font-family:inherit;cursor:pointer;
}
.sync-bar:active{background:#F6F9FF;}
.sync-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:#C9D3E3;}
.sync-dot-on{background:#34C759;}
.sync-dot-busy{background:#3B82F6;animation:syncPulse 1.1s ease-in-out infinite;}
.sync-dot-err{background:#EF4444;}
.sync-text{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sync-arrow{flex:0 0 auto;color:#AEB8C8;font-size:16px;line-height:1;}
@keyframes syncPulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.sync-hint{font-size:12px;color:#8A97AC;line-height:1.6;margin-top:6px;}
.sync-meta{font-size:12px;color:#8A97AC;margin-top:9px;line-height:1.6;}
/* ========== 配对二维码（v0.3B） ========== */
.sync-gen{margin-top:8px;}
.sync-gen .btn{width:100%;height:44px;min-height:44px;background:#F2F7FF;color:var(--blue);border:1px solid #D9E6FB;}
.sync-gen .btn:active{background:#E7F0FF;}
.pair-entry{margin-top:12px;}
.pair-entry .btn{width:100%;height:46px;min-height:46px;background:#F2F7FF;color:var(--blue);
  border:1px solid #D9E6FB;font-size:15px;}
.pair-entry .btn:active{background:#E7F0FF;}
.pair-box{display:flex;justify-content:center;margin:14px 0 2px;}
.pair-qr{padding:10px;background:#fff;border:1px solid #E7ECF5;border-radius:14px;line-height:0;}
.pair-qr canvas{display:block;max-width:100%;height:auto;}
.pair-code{margin-top:10px;padding:9px 11px;border:1px dashed #D7DFEC;border-radius:10px;background:#F8FAFE;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;color:#5A6B85;
  word-break:break-all;text-align:center;letter-spacing:.4px;line-height:1.5;}
.pair-link-row{display:flex;gap:8px;align-items:stretch;}
.pair-link{flex:1 1 auto;min-width:0;box-sizing:border-box;max-height:74px;overflow-y:auto;
  padding:9px 11px;border:1px solid #E4EAF3;border-radius:10px;background:#fff;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
  line-height:1.55;color:#5A6B85;word-break:break-all;-webkit-user-select:text;user-select:text;}
.pair-link-row .btn{flex:0 0 auto;align-self:center;padding-left:16px;padding-right:16px;}
@media (max-width:360px){
  .sync-bar{padding:10px 12px;font-size:13px;border-radius:12px;}
  .sync-now{padding:0 9px;font-size:12px;border-radius:12px;}
  .sync-now-ico{font-size:15px;}
}

/* ========== Toast ========== */
#toast{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;
  transform:translate(-50%,-10px);z-index:60;
  max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;
  background:rgba(31,42,68,.92);color:#fff;font-size:14px;line-height:1.45;text-align:center;
  box-shadow:0 8px 24px rgba(20,35,60,.22);
  opacity:0;pointer-events:none;word-break:break-word;
  transition:opacity .24s ease,transform .24s ease;
}
#toast.show{opacity:1;transform:translate(-50%,0);}
#toast:empty{display:none;}

/* ========== 弹层 ========== */
#modal-root:empty{display:none;}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,35,60,.42);z-index:100;}
.modal-panel{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:101;
  width:calc(100% - 32px);max-width:400px;max-height:calc(100vh - 48px);overflow-y:auto;
  background:#fff;border-radius:18px;padding:20px;
  box-shadow:0 18px 50px rgba(20,40,80,.24);
  -webkit-overflow-scrolling:touch;
}
.modal-title{font-size:18px;font-weight:700;margin-bottom:6px;}
.modal-desc{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:8px;}
.confirm-desc{font-size:14px;color:var(--text);margin-top:10px;margin-bottom:6px;}
.modal-label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px;}
.modal-input{
  width:100%;height:48px;padding:0 12px;border:1px solid #DCE5F2;border-radius:12px;
  background:#F9FBFF;color:var(--text);font-size:16px;outline:none;
}
.modal-input:focus{border-color:var(--blue);background:#fff;}
.modal-error{min-height:20px;margin-top:8px;font-size:14px;color:#E0453B;line-height:1.4;}
.modal-actions{display:flex;gap:10px;margin-top:14px;}
.modal-actions .btn{flex:1 1 0;min-width:0;}
.target-inputs{display:flex;gap:10px;margin-top:12px;}
.target-field{flex:1 1 0;min-width:0;}
.target-field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;}
.target-field .modal-input{text-align:center;}
.preview-title{margin-bottom:12px;}
.preview-scroll{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#F5F7FA;border-radius:12px;padding:8px;}
.card-preview{width:100%;}
#card-canvas,.card-image{width:100%;height:auto;display:block;border-radius:8px;}
.card-hint{font-size:14px;color:var(--muted);text-align:center;margin-top:10px;}
/* ========== 状态条提示行（事来则应已记录） ========== */
#status-bar{flex-wrap:wrap;}
.status-notice{flex:0 0 100%;font-size:12px;color:var(--muted);font-weight:400;line-height:1.3;padding-bottom:2px;}

/* ========== 总览「其中事来则应」小灰字 ========== */
.ov-chore{font-size:13px;color:var(--muted);margin-top:8px;}

/* ========== 记录列表：备注 / 来源 / 折叠 ========== */
.rec-from{flex:0 0 auto;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#5B76A8;background:#EEF4FF;border-radius:6px;padding:1px 6px;}
.rec-note{display:inline-block;max-width:100%;font-size:12px;color:#8A94A6;background:#F2F5FA;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;overflow-wrap:anywhere;}
.rec-note-hint{color:var(--blue);margin-left:2px;white-space:nowrap;}
.record-row.rec-expandable{cursor:pointer;}
/* ========== 编辑记录时间（方案 A 增量）：记录行双按钮 + 编辑弹窗 ========== */
.rec-btns{display:flex;align-items:center;gap:2px;flex:0 0 auto;}
.rec-btns .icon-btn{width:32px;height:32px;flex:0 0 32px;border-radius:9px;font-size:20px;}
.rec-edit{color:#6E7C93;}
.rec-edit:active{color:var(--blue);background:#EEF3FB;}
/* v0.3D：iOS Safari 的 input[type=time] 有原生固有最小宽度，flex 两列会被顶破；
   grid 的 minmax(0,1fr) 是硬约束，列宽不可能超过容器。 */
.edit-time-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
.edit-time-field{flex:1 1 0;min-width:0;}
.edit-time-field label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px;}
.edit-time-field .modal-input{
  height:48px;text-align:center;padding:0 8px;
  width:100%;max-width:100%;min-width:0;box-sizing:border-box;
  -webkit-appearance:none;appearance:none;font-variant-numeric:tabular-nums;
}
.edit-note-label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px;}
.edit-preview{font-size:14px;color:var(--blue);margin-top:10px;line-height:1.4;min-height:20px;}
.edit-preview.invalid{color:#E0453B;}

/* ========== 中断原因底部面板 ========== */
#sheet-root{position:fixed;inset:0;z-index:120;}
.sheet-backdrop{position:absolute;inset:0;background:rgba(20,35,60,.42);}
.sheet-panel{
  position:absolute;left:0;right:0;bottom:0;z-index:1;
  max-width:480px;margin:0 auto;
  background:#fff;border-radius:18px 18px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -12px 40px rgba(20,40,80,.22);
  animation:sheet-up .22s ease-out;
  will-change:transform;
}
@keyframes sheet-up{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:#D8DFEA;margin:4px auto 12px;touch-action:none;}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:12px;}
.sheet-reasons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px;}
.sheet-reason{
  display:flex;align-items:center;justify-content:center;text-align:center;
  min-height:44px;padding:6px 2px;border-radius:10px;
  background:#F2F6FD;border:1px solid #E1EAF7;color:#3A4A66;
  font-size:12px;line-height:1.25;word-break:break-all;
}
.sheet-reason.active{background:#E3EDFF;border-color:var(--blue);color:var(--blue);}
.sheet-input{width:100%;height:46px;padding:0 12px;border:1px solid #DCE5F2;border-radius:12px;background:#F9FBFF;color:var(--text);font-size:16px;outline:none;}
.sheet-input:focus{border-color:var(--blue);background:#fff;}
.sheet-actions{display:flex;gap:10px;margin-top:14px;}
.sheet-actions .btn{flex:1 1 0;min-width:0;padding:0 8px;font-size:14px;}
@media (max-width:360px){.sheet-reason{font-size:11px;padding:6px 1px;}.sheet-actions .btn{font-size:13px;}}
/* ========== 模块顺序调整：记录列表展开/收起 + 导出记录按钮 ========== */
.records-toggle{
  display:block;width:100%;margin-top:10px;padding:10px 0 2px;
  border-top:1px solid var(--line);background:none;
  font-size:14px;color:var(--blue);font-weight:600;text-align:center;
}
.records-toggle:active{opacity:.65;}
.export-btn{
  width:100%;height:48px;border:1px solid #C9DBFB;border-radius:14px;
  background:#fff;color:var(--blue);font-size:15px;font-weight:700;
  box-shadow:0 2px 10px rgba(30,60,110,.05);margin-top:10px;
}
.export-btn:active{transform:scale(.99);background:#F2F7FF;}
/* ========== 版式重构：单行项目行 / 前置开始胶囊 / 活动卡 / 低频按钮 ========== */
/* 开始胶囊：54×28px，紧跟项目名 8px，放进 .proj-top 行内 */
.proj-actions{flex:0 0 auto;display:inline-flex;align-items:center;}
.proj-actions .btn{
  width:54px;min-width:54px;height:28px;min-height:28px;
  padding:0;border-radius:8px;font-size:12px;font-weight:600;box-shadow:none;
}
.proj-actions .btn-primary{background:var(--blue);color:#fff;box-shadow:none;}
/* 菜单相对单行卡片定位 */
.proj-menu{top:44px;}
/* 状态条：方案 A —— 计时中升级为高亮活动卡 */
#status-bar.status-active{
  flex-direction:column;align-items:stretch;gap:8px;
  padding:10px 14px;min-height:0;
  background:#EAF2FF;border:1px solid #CFE2FF;
  box-shadow:0 4px 14px rgba(47,125,246,.10);
  -webkit-backdrop-filter:none;backdrop-filter:none;
}
.status-line1{display:flex;align-items:center;gap:8px;min-width:0;}
.status-name{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700;color:var(--text);}
.status-tag{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--blue);white-space:nowrap;}
.status-elapsed{margin-left:auto;flex:0 0 auto;font-size:13px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;}
.status-line2{display:flex;justify-content:flex-end;gap:10px;}
.status-btn{height:36px;min-height:36px;min-width:72px;padding:0 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:none;}
.status-btn.btn-primary{background:var(--blue);color:#fff;box-shadow:none;}
.status-btn.btn-outline{background:#fff;color:var(--blue);border:1px solid var(--blue);}
/* 区块标题行右侧轻量文字入口 */
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.section-head .section-title{margin-bottom:0;}
.head-action{flex:0 0 auto;padding:4px 0 4px 8px;font-size:13px;font-weight:600;color:var(--blue);background:none;border:0;}
.head-action:active{opacity:.6;}
/* 空状态：提示 + 可点动作 */
.empty-action{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;padding:8px 16px;border-radius:10px;background:var(--blue);color:#fff;font-size:14px;font-weight:600;}
.empty-hint{display:block;font-size:12px;color:var(--muted);margin-top:4px;}
/* 概览「其中事来则应」小字（覆盖早期 13px 定义） */
.ov-chore{font-size:12px;color:var(--muted);margin-top:2px;}
/* 所有时长数字等宽 */
.ov-numbers,#stat-total,#stat-target,.proj-today,.proj-today-main,.rec-time,#status-elapsed{font-variant-numeric:tabular-nums;}

/* ===== 每日上限 dailyLimit（第七轮增量）===== */
.limit-note{font-size:11px;color:var(--muted);line-height:1.25;}
.limit-note.over{color:#E0453B;font-weight:700;}
.modal-hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4;}
.limit-field{margin-top:12px;}
.limit-field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;}
.limit-field .modal-input{text-align:center;}
#limit-notice{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;
  transform:translate(-50%,-12px);z-index:120;
  max-width:calc(100% - 24px);padding:10px 16px;border-radius:12px;
  background:#FFF3E0;color:#B45309;border:1px solid #FCD9A6;
  font-size:13px;font-weight:700;line-height:1.45;text-align:center;
  box-shadow:0 6px 20px rgba(160,100,20,.18);
  opacity:0;pointer-events:none;word-break:break-word;
  transition:opacity .3s ease,transform .3s ease;
}
#limit-notice.show{opacity:1;transform:translate(-50%,0);}
#ov-limit-summary{margin-top:12px;}
.ov-limit-head{display:block;width:100%;text-align:left;padding:8px 0;color:#E0453B;font-size:13px;font-weight:700;}
.ov-limit-list{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;}
.ov-limit-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--text);padding:4px 0;}
.ov-limit-row span:last-child{color:#E0453B;font-weight:700;flex:0 0 auto;}

/* ===== 分组：多多益善 / 适可而止（第八轮增量）===== */
.group-block{margin-bottom:14px;}
.group-head{display:flex;align-items:center;gap:8px;padding:0 0 8px;border-bottom:1px solid var(--line);margin-bottom:2px;}
.group-name{flex:0 0 auto;font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;}
.group-summary{flex:1 1 auto;min-width:0;text-align:right;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums;}
.group-add{flex:0 0 30px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;background:#EAF2FF;color:var(--blue);font-size:20px;font-weight:600;line-height:1;}
.group-add:active{background:#D6E6FF;}
.group-empty{font-size:13px;color:#B4BDCB;padding:10px 2px;}
/* 项目折叠（v0.3E）：每组只显示前 N 项，其余经这行按钮就地展开；与卡片右侧的 ⋯ 菜单区分 */
.group-more{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;min-height:44px;margin-top:8px;box-sizing:border-box;
  background:#F4F8FF;border:1px dashed #C9DAF7;border-radius:12px;
  color:var(--blue);font-size:14px;font-weight:600;cursor:pointer;
  font-family:inherit;-webkit-tap-highlight-color:transparent;
}
.group-more:active{background:#E6F0FF;}
.group-more.open{background:#EEF4FF;border-style:solid;}
.group-more .gm-count{background:#E1ECFF;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;}
.group-more .gm-arrow{font-size:18px;line-height:1;}
.chore-cards{margin-top:6px;border-top:1px solid var(--line);padding-top:2px;}
@media (max-width:360px){.group-summary{font-size:11px;}.group-add{flex-basis:28px;width:28px;height:28px;font-size:18px;}.group-more{font-size:13px;min-height:42px;}}
/* ===== 项目搜索（v0.3F）=====
 * 搜索框是 #project-list 之外的静态 DOM，局部重绘项目列表不会重建它，输入焦点得以保留。 */
.proj-search{
  display:flex;align-items:center;gap:8px;
  height:40px;margin:0 0 12px;padding:0 10px;box-sizing:border-box;
  background:#F4F8FF;border:1px solid #DCE7F8;border-radius:11px;
}
.proj-search:focus-within{border-color:var(--blue);background:#fff;}
.proj-search-icon{flex:0 0 auto;color:#9AA9BE;}
.proj-search-input{
  flex:1 1 0;min-width:0;height:100%;border:0;outline:none;background:transparent;
  color:var(--text);font-size:16px;font-family:inherit;
  -webkit-appearance:none;appearance:none;
}
.proj-search-input::placeholder{color:#A7B4C6;font-size:14px;}
.proj-search-clear{
  flex:0 0 26px;width:26px;height:26px;border:0;border-radius:50%;padding:0;
  background:#E1ECFF;color:var(--blue);font-size:16px;line-height:1;
  display:none;align-items:center;justify-content:center;cursor:pointer;
  font-family:inherit;-webkit-tap-highlight-color:transparent;
}
.proj-search.has-value .proj-search-clear{display:inline-flex;}
.proj-search-result{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.5;}
.proj-search-empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7;}
@media (max-width:360px){.proj-search{height:38px;}.proj-search-input::placeholder{font-size:13px;}}

/* ===== 项目热度排序（v0.3G）=====
 * 排序切换按钮位于「我的项目」标题行；次数徽标放在卡片右侧 .proj-today 列内，
 * 不参与 .proj-top 的 flex 伸缩，避免窄屏下唯一可收缩的 .proj-name 被挤没。 */
.sort-mode-btn{
  margin-left:auto;margin-right:6px;padding:5px 10px;border-radius:999px;
  border:1px solid #C9DAF7;background:#F4F8FF;color:#7C93B4;
  font-size:12px;font-weight:700;font-family:inherit;white-space:nowrap;line-height:1;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.sort-mode-btn.hot{background:#E1ECFF;border-color:#A9C9F7;color:var(--blue);}
.sort-mode-btn:active{opacity:.65;}
.proj-uses{
  display:block;font-size:10px;font-weight:600;color:#93A6C0;
  line-height:1.3;letter-spacing:.2px;font-variant-numeric:tabular-nums;
}
@media (max-width:360px){.sort-mode-btn{font-size:11px;padding:5px 8px;margin-right:4px;}}


/* 圆形图标：两组统一为环形进度；未设目标/上限时显示虚线加号 */
.goal-orb{
  flex:0 0 42px;width:42px;height:42px;border-radius:50%;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--orb,#5B8FF9);color:#fff;border:0;padding:0;overflow:hidden;
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.goal-orb.orb-empty{background:transparent;border:1.5px dashed #C7D2E3;color:#AEB7C6;font-size:20px;font-weight:400;}
.goal-orb.orb-over{background:#E0453B;}
.goal-orb .orb-num{font-size:15px;font-weight:700;line-height:1.05;}
.goal-orb .orb-sub{font-size:10px;font-weight:600;line-height:1.05;opacity:.92;}
.goal-orb .orb-label{font-size:11px;font-weight:700;line-height:1.1;}
@media (max-width:360px){.goal-orb{flex-basis:36px;width:36px;height:36px;}.goal-orb .orb-num{font-size:13px;}.goal-orb .orb-label{font-size:10px;}}
/* ===== 方案 C：环形进度（第九轮 less，第十轮扩展至 more）===== */
/* 环色沿用项目色（与色条同源）；less 超额时整环变红并填满 */
.goal-orb.orb-ring{background:transparent;position:relative;color:var(--text);}
.goal-orb.orb-ring::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--orb,#5B8FF9) var(--ring-deg,0deg),#E9EEF7 0);
}
.goal-orb.orb-ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;}
.goal-orb.orb-ring.orb-over::before{background:conic-gradient(#E0453B var(--ring-deg,360deg),#FDE3E0 0);}
.goal-orb.orb-ring .ring-core{
  position:relative;z-index:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1.05;
}
.goal-orb.orb-ring .ring-num{font-size:14px;font-weight:700;color:var(--orb,#5B8FF9);}
.goal-orb.orb-ring .ring-sub{font-size:9px;font-weight:600;color:#9AA6B8;}
.goal-orb.orb-ring.orb-over .ring-num{color:#E0453B;}
@media (max-width:360px){
  .goal-orb.orb-ring .ring-num{font-size:12px;}
  .goal-orb.orb-ring .ring-sub{font-size:8px;}
}
/* 右侧信息区固定两行高度：无记录时首行留空，卡片仍上下对齐、不跳动 */
.proj-today-main,.today-sub{display:block;min-height:15px;text-align:right;}

/* 统一设置弹窗：与旧弹窗同尺寸（实测 407px 高 / 18px 圆角 / 20px 内边距 / 48px 按钮） */
.modal-panel.target-modal{min-height:407px;display:flex;flex-direction:column;}
.target-modal .modal-actions{margin-top:auto;}
.target-unit-row{display:flex;gap:10px;margin-top:14px;align-items:stretch;}
.target-num{flex:1 1 auto;min-width:0;height:48px;padding:0 12px;border:1px solid #DCE5F2;border-radius:12px;background:#F9FBFF;color:var(--text);font-size:16px;outline:none;text-align:center;font-variant-numeric:tabular-nums;}
.target-num:focus{border-color:var(--blue);background:#fff;}
.target-units{flex:0 0 auto;display:flex;gap:6px;}
.unit-btn{width:56px;height:48px;border-radius:12px;background:#F2F6FD;border:1px solid #E1EAF7;color:#3A4A66;font-size:14px;font-weight:600;}
.unit-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.target-hint-line{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;}
.quick-row{display:flex;gap:8px;margin-top:16px;}
.quick-chip{flex:1 1 0;min-width:0;height:36px;border-radius:18px;background:#F2F6FD;border:1px solid #E1EAF7;color:#3A4A66;font-size:13px;font-weight:600;}
.quick-chip:active{background:#E3EDFF;border-color:var(--blue);color:var(--blue);}
.target-modal .btn[disabled]{opacity:.45;cursor:not-allowed;}
@media (max-width:360px){.unit-btn{width:50px;}.quick-chip{font-size:12px;}}

/* 全局＋：极简分组二选一 */
.modal-panel.choice-modal{min-height:212px;display:flex;flex-direction:column;}
.group-choice-row{display:flex;gap:12px;margin-top:18px;}
.group-choice-btn{flex:1 1 0;min-width:0;height:96px;border-radius:16px;background:#F2F6FD;border:1.5px solid #E1EAF7;color:var(--text);font-size:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.group-choice-btn .gc-sub{font-size:12px;font-weight:400;color:var(--muted);}
.group-choice-btn:active{background:#E3EDFF;border-color:var(--blue);}
/* ========== 项目移动分组（v0.3C）：当前组置灰不可点 ========== */
.group-choice-btn.disabled{opacity:.45;pointer-events:none;}
/* 移动弹窗的副标题可能比新建弹窗长：允许两行，靠 stretch 让三个按钮始终等高 */
.modal-panel.choice-modal .group-choice-btn{height:auto;min-height:96px;padding:10px 6px;}
.modal-panel.choice-modal .group-choice-btn .gc-sub{line-height:1.4;}
/* 三选一弹窗窄屏适配：三个并排按钮在 320px 下仍可点、不换行、不横向滚动 */
@media (max-width:360px){
  .group-choice-row{gap:8px;}
  .group-choice-btn{height:88px;border-radius:12px;font-size:14px;}
  .group-choice-btn .gc-sub{font-size:10px;}
}
/* 概览「适可而止」行：紧跟「其中事来则应」，与现有小灰字一致 */
#ov-limit-summary{margin-top:6px;}
.ov-limit-head{display:block;width:100%;text-align:left;padding:6px 0;color:var(--muted);font-size:12px;font-weight:600;}
.ov-limit-head .ov-less-over{color:#E0453B;font-weight:700;}

/* ========== 历史记录（按北京时间选日期，只读查看） ========== */
.hist-pick{display:flex;align-items:center;gap:8px;}
.hist-date{
  flex:1 1 auto;min-width:0;width:100%;height:42px;padding:0 10px;
  border:1px solid #DCE5F2;border-radius:11px;background:#F9FBFF;
  color:var(--text);font-size:15px;outline:none;
  -webkit-appearance:none;appearance:none;font-variant-numeric:tabular-nums;
}
.hist-date:focus{border-color:var(--blue);background:#fff;}
.hist-nav{
  width:42px;height:42px;flex:0 0 42px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid #DCE5F2;border-radius:11px;background:#F9FBFF;color:var(--blue);
  font-size:24px;line-height:1;
}
.hist-nav:active{background:#EEF3FB;}
.hist-nav:disabled{opacity:.35;}
.hist-label{font-size:13px;font-weight:700;margin-top:10px;font-variant-numeric:tabular-nums;}
.hist-summary{font-size:12px;color:var(--muted);margin-top:2px;}
.hist-summary:empty{display:none;}
.hist-empty{font-size:14px;color:var(--muted);text-align:center;padding:22px 8px;line-height:1.6;}
.hist-empty-hint{display:block;font-size:12px;color:#AEB7C6;margin-top:4px;}
/* 补记弹窗的日期输入 */
.add-date-input{font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;}
@media (max-width:360px){
  .hist-nav{width:38px;height:38px;flex:0 0 38px;}
  .hist-date{height:38px;font-size:14px;padding:0 8px;}
}
/* ========== 补记弹窗内「直接新建项目」（第二十一轮增量） ========== */
.add-inline-toggle{display:block;width:100%;margin-top:9px;padding:4px 0;background:none;border:0;text-align:left;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer;}
.add-inline-toggle:active{opacity:.7;}

<script data-page-node-id="ot7o1KJgy8KCToEdkQsZtu" data-pnid-children="ncJ5n4glj0Dr4r5Sitx4V6">
/* =====================================================================
 * 我的时间记录 · 单文件版
 * 分段：常量与工具函数 / 状态与存储 / 跨天规范化 / 渲染 /
 *       事件与业务流程 / 弹层与 toast / 今日记录卡 canvas / 初始化
 * 数据口径：一切以「段」为单位，一段 = {id,start,end,endType}；
 *          时长统一走 minutesOfSegment，所有显示同源。
 * ===================================================================== */

/* -------------------- 一、常量与工具函数（纯函数为主） -------------------- */

/** 项目标识色：固定 8 色，按 nextColorIndex 取模分配，删除不回收、不重排 */
var PALETTE = ["#5B8FF9", "#61DDAA", "#65789B", "#F6BD16", "#7262FD", "#78D3F8", "#F08BB4", "#FF9D4D"];
/** 系统项目「事来则应」：固定 id、固定中性灰、不参与排序、永远固定在列表最底部 */
var CHORE_NAME = "事来则应";
/* 兼容：旧版本系统项目名为「杂事」，读取历史 localStorage 时仍按旧名识别，避免旧记录丢失。
   只用于内部判定，页面上不再显示旧名。 */
var CHORE_NAME_LEGACY = "杂事";
function isChoreName(n) {
  var t = String(n === null || n === undefined ? "" : n).trim();
  return t === CHORE_NAME || t === CHORE_NAME_LEGACY;
}
var CHORE_ID = "sys_chore";
var CHORE_COLOR = "#9CA3AF";
var STORAGE_KEY = "my-time-records:v1";
var FONT_STACK = '-apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif';
var WEEK_NAMES = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
var PENCIL_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';
var WEEK_SHORT = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
var SPROUT_SVG = '<svg width="36" height="36" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 33V19" stroke="#3FAE5A" stroke-width="2.2" stroke-linecap="round"></path><path d="M20 23C13.4 23 9.5 19.6 9.5 13.2C15.8 12.6 20 16.2 20 23Z" fill="#66C86F"></path><path d="M20 18.6C20 12 24 8.4 30.6 8.8C30.9 15.4 27 19 20 18.6Z" fill="#3FAE5A"></path></svg>';
/** 头部日期：北京时间今天 →「YYYY年M月D日 · 周X」；仅展示，不参与任何统计 */
function headerDateText() {
  var p = bjTodayKey().split("-");
  var d = new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])));
  return Number(p[0]) + "年" + Number(p[1]) + "月" + Number(p[2]) + "日 · " + WEEK_SHORT[d.getUTCDay()];
}

/** HTML 转义：所有用户输入进入 innerHTML 前必须经过这里，防 XSS 与布局崩坏 */
function esc(value) {
  return String(value === null || value === undefined ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function pad2(n) { return String(n).padStart(2, "0"); }

/** 本地时间 YYYY-MM-DD */
function dayKeyOf(ts) {
  var d = new Date(ts);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

/* -------------------- 北京时间（UTC+8）日期口径 --------------------
   只用于「历史记录」的日期选择与「补记」等新记录的日期归属，不随设备时区漂移。
   现有 dayKeyOf / midnightOf / formatTime / sanitizeState 全部保持原样：
   旧记录原有的日期 key、段数量、时间戳一律不动（零迁移）；
   今日视图 / 统计 / 时间轴 / CSV / 记录卡的口径不变。 */
var BJ_OFFSET_MS = 8 * 3600 * 1000;
function bjDayKeyOf(ts) {
  var d = new Date(Number(ts) + BJ_OFFSET_MS);
  return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
}
function bjTodayKey() { return bjDayKeyOf(Date.now()); }
/** dayKey → "YYYY-MM-DD 星期X"；用 UTC 构造，避免本地时区把日期挪一天 */
function bjDayLabel(dayKey) {
  var p = String(dayKey).split("-");
  var d = new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])));
  return dayKey + " " + WEEK_NAMES[d.getUTCDay()];
}
/** dayKey ± n 天（UTC 运算，不受时区 / 夏令时影响） */
function shiftDayKey(dayKey, n) {
  var p = String(dayKey).split("-");
  var d = new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]) + Number(n)));
  return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
}

/** dayKey → 当天本地零点的时间戳 */
function midnightOf(dayKey) {
  var p = String(dayKey).split("-");
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getTime();
}

/** ts 所属日期之后下一个本地零点（用 Date 构造，自动处理夏令时/月/年边界） */
function nextMidnightOf(ts) {
  var d = new Date(ts);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
}

function isValidDayKey(k) {
  if (typeof k !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(k)) return false;
  var ms = midnightOf(k);
  return Number.isFinite(ms) && dayKeyOf(ms) === k;
}

/** 每段时长口径：不足 1 分钟按 1 分钟，超过 1 分钟向上取整到整分钟 */
function minutesOfSegment(seg, now) {
  var endOrNow = (seg.end === null || seg.end === undefined) ? now : seg.end;
  var diff = Math.max(0, endOrNow - seg.start);
  return Math.max(1, Math.ceil(diff / 60000));
}

/** 分钟数 → HH:MM */
function formatMinutes(mins) {
  var m = Math.max(0, Math.floor(Number(mins) || 0));
  return pad2(Math.floor(m / 60)) + ":" + pad2(m % 60);
}

/** 时间戳 → HH:MM（本地时间） */
function formatTime(ts) {
  var d = new Date(ts);
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

/** 目标分钟数 → 中文可读文案 */
function formatTarget(mins) {
  var h = Math.floor(mins / 60), m = mins % 60;
  if (h > 0 && m > 0) return h + " 小时 " + m + " 分钟";
  if (h > 0) return h + " 小时";
  return m + " 分钟";
}

function colorOf(colorIndex) {
  var n = Math.floor(Number(colorIndex) || 0);
  var i = ((n % PALETTE.length) + PALETTE.length) % PALETTE.length;
  return PALETTE[i];
}

function toNonNegInt(v, fallback) {
  if (typeof v === "number" && Number.isFinite(v) && Number.isInteger(v) && v >= 0) return v;
  return fallback;
}

function parseNonNegInt(raw) {
  var t = String(raw === null || raw === undefined ? "" : raw).trim();
  if (t === "") return 0;
  if (!/^\d+$/.test(t)) return null;
  var n = Number(t);
  return Number.isFinite(n) ? n : null;
}

/**
 * 按本地零点切分 [start, end] 一段时间（纯函数）。
 * 返回 [{dayKey,start,end,endType}]，按时间升序；
 * 零点之前的所有段 endType = "finished"（系统切分），
 * 最后一段 endType = finalEndType（用户实际操作类型）。
 * 同一天内不切分：只返回一段。
 */
function splitSegmentByMidnight(start, end, finalEndType) {
  var parts = [];
  if (!(end > start)) {
    return [{ dayKey: dayKeyOf(start), start: start, end: end, endType: finalEndType }];
  }
  var cursor = start;
  var guard = 0;
  while (guard++ < 5000) {
    var boundary = nextMidnightOf(cursor);
    if (end <= boundary) {
      parts.push({ dayKey: dayKeyOf(cursor), start: cursor, end: end, endType: finalEndType });
      break;
    }
    parts.push({ dayKey: dayKeyOf(cursor), start: cursor, end: boundary, endType: "finished" });
    cursor = boundary;
  }
  return parts;
}

/**
 * 计算某一天的统计（纯函数）。
 * perProject：今天有段的项目（按 state.projects 顺序）；
 * records：今天所有段（含进行中），按 start 从新到旧；
 * totalMinutes / targetMinutes / hasTarget / ratio / percent 均为全局同源口径。
 */
function computeDayStats(state, dayKey, now) {
  var bucket = (state && state.days && state.days[dayKey]) || {};
  var projects = (state && Array.isArray(state.projects)) ? state.projects : [];
  var perProject = [];
  var records = [];
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    var segs = Array.isArray(bucket[p.id]) ? bucket[p.id] : [];
    if (segs.length === 0) continue;
    var sum = 0;
    for (var j = 0; j < segs.length; j++) {
      var seg = segs[j];
      var m = minutesOfSegment(seg, now);
      sum += m;
      records.push({ segment: seg, project: p, minutes: m, colorIndex: p.colorIndex, projectName: p.name, colorHex: projectColor(p) });
    }
    perProject.push({ projectId: p.id, name: p.name, colorIndex: p.colorIndex, minutes: sum,
      colorHex: projectColor(p), isChore: isChoreProject(p) });
  }
  records.sort(function (a, b) { return b.segment.start - a.segment.start; });
  var totalMinutes = 0, choreMinutes = 0;
  for (var a = 0; a < perProject.length; a++) {
    totalMinutes += perProject[a].minutes;
    if (perProject[a].isChore) choreMinutes += perProject[a].minutes;
  }

  /* 完成度口径：只统计「设置了每日目标」的非事来则应项目；
     分子 = 这些项目今天已投入之和，分母 = 它们的目标时长之和。 */
  var targetMinutes = 0, hasTarget = false, goalMinutes = 0;
  for (var k = 0; k < projects.length; k++) {
    var pk = projects[k];
    if (isChoreProject(pk)) continue;
    var tm = pk.targetMinutes;
    if (typeof tm === "number" && Number.isFinite(tm) && tm > 0) {
      targetMinutes += tm;
      hasTarget = true;
      for (var g = 0; g < perProject.length; g++) {
        if (perProject[g].projectId === pk.id) { goalMinutes += perProject[g].minutes; break; }
      }
    }
  }
  var ratio = (hasTarget && targetMinutes > 0) ? (goalMinutes / targetMinutes) : 0;
  /* 保留一位小数：16.7% 这类分数百分比可正确显示，整数仍显示 50%（不出现 50.0） */
  var percent = (hasTarget && targetMinutes > 0) ? Math.round(goalMinutes / targetMinutes * 1000) / 10 : 0;

  /* 第八轮：顶部「今日概览」的完成度只算「多多益善」组里设了目标的项目；
     less 组、事来则应、未设目标项目完全不参与。原有字段一律保留（CSV / 记录卡沿用原口径）。*/
  var moreTargetMinutes = 0, moreGoalMinutes = 0, moreHasTarget = false;
  for (var mk = 0; mk < projects.length; mk++) {
    var mp = projects[mk];
    if (isChoreProject(mp) || groupOf(mp) !== GROUP_MORE) continue;
    var mtm = mp.targetMinutes;
    if (typeof mtm === "number" && Number.isFinite(mtm) && mtm > 0) {
      moreTargetMinutes += mtm;
      moreHasTarget = true;
      for (var mg = 0; mg < perProject.length; mg++) {
        if (perProject[mg].projectId === mp.id) { moreGoalMinutes += perProject[mg].minutes; break; }
      }
    }
  }
  var moreRatio = (moreHasTarget && moreTargetMinutes > 0) ? (moreGoalMinutes / moreTargetMinutes) : 0;
  var morePercent = (moreHasTarget && moreTargetMinutes > 0)
    ? Math.round(moreGoalMinutes / moreTargetMinutes * 1000) / 10 : 0;
  return {
    dayKey: dayKey, now: now, perProject: perProject, records: records,
    totalMinutes: totalMinutes, targetMinutes: targetMinutes,
    choreMinutes: choreMinutes, goalMinutes: goalMinutes,
    hasTarget: hasTarget, ratio: ratio, percent: percent,
    moreTargetMinutes: moreTargetMinutes, moreGoalMinutes: moreGoalMinutes,
    moreHasTarget: moreHasTarget, moreRatio: moreRatio, morePercent: morePercent
  };
}

/* -------------------- 二、状态与存储 -------------------- */

function defaultState(now) {
  return {
    schemaVersion: 1,
    nickname: "时间记录员",
    nextColorIndex: 0,
    nextId: 1,
    currentDayKey: dayKeyOf(now),
    projects: [],
    days: {}
  };
}

/** 模块级唯一状态；localStorage 不可用时自动降级为内存态 */
var state = defaultState(Date.now());

function newId(prefix) {
  var n = (typeof state.nextId === "number" && Number.isFinite(state.nextId) && state.nextId > 0) ? state.nextId : 1;
  state.nextId = n + 1;
  return prefix + "_" + n;
}

function sanitizeSegment(raw, fallbackIndex) {
  if (!raw || typeof raw !== "object") return null;
  var start = raw.start;
  if (typeof start !== "number" || !Number.isFinite(start) || start <= 0) return null;
  var id = (typeof raw.id === "string" && raw.id) ? raw.id : ("s_" + Math.floor(start) + "_" + fallbackIndex);
  /* 兼容旧记录：note / sourceProject 缺失一律按空值处理，不改变时长与合计 */
  var note = (typeof raw.note === "string") ? Array.from(raw.note).slice(0, 50).join("") : "";
  var sourceProject = (typeof raw.sourceProject === "string") ? Array.from(raw.sourceProject).slice(0, 10).join("") : "";
  var endType = raw.endType;
  if (endType === "running") {
    return { id: id, start: start, end: null, endType: "running", note: note, sourceProject: sourceProject };
  }
  if (endType === "interrupted" || endType === "finished") {
    if (typeof raw.end !== "number" || !Number.isFinite(raw.end) || raw.end < start) return null;
    return { id: id, start: start, end: raw.end, endType: endType, note: note, sourceProject: sourceProject };
  }
  return null;
}

/** 轻量校验 + 迁移：字段缺失补默认值、非法值丢弃；schemaVersion 预留升级位 */
function sanitizeState(obj) {
  var now = Date.now();
  var base = defaultState(now);
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) return base;
  base.schemaVersion = 1; /* 目前仅支持 v1，后续可在此分支升级旧结构 */
  if (typeof obj.nickname === "string" && obj.nickname.trim().length > 0) {
    base.nickname = Array.from(obj.nickname.trim()).slice(0, 12).join("");
  }
  base.nextColorIndex = toNonNegInt(obj.nextColorIndex, 0);
  base.nextId = Math.max(1, toNonNegInt(obj.nextId, 1));
  base.currentDayKey = isValidDayKey(obj.currentDayKey) ? obj.currentDayKey : dayKeyOf(now);
  base.projects = [];
  base.days = {};
  var seenPid = {};
  var maxIdNumber = 0;

  function trackId(idStr) {
    var m = /(\d+)$/.exec(String(idStr));
    if (m) maxIdNumber = Math.max(maxIdNumber, Number(m[1]));
  }

  if (Array.isArray(obj.projects)) {
    for (var i = 0; i < obj.projects.length; i++) {
      var raw = obj.projects[i];
      if (!raw || typeof raw !== "object") continue;
      var id = (typeof raw.id === "string" && raw.id) ? raw.id : null;
      var name = (typeof raw.name === "string") ? raw.name.trim() : "";
      if (!id || !name || seenPid[id]) continue;
      seenPid[id] = true;
      var ci = toNonNegInt(raw.colorIndex, 0) % PALETTE.length;
      var tm = null;
      if (typeof raw.targetMinutes === "number" && Number.isFinite(raw.targetMinutes) && raw.targetMinutes > 0) {
        tm = Math.floor(raw.targetMinutes);
      }
      var createdAt = (typeof raw.createdAt === "number" && Number.isFinite(raw.createdAt)) ? raw.createdAt : now;
      /* 保留排序字段：缺失或非法时记为 undefined，交给一次性迁移重编号 */
      var si = (typeof raw.sortIndex === "number" && Number.isFinite(raw.sortIndex)) ? raw.sortIndex : undefined;
      /* 每日上限：旧数据缺失或非法一律按不限制（null）处理 */
      var dl = null;
      if (typeof raw.dailyLimit === "number" && Number.isFinite(raw.dailyLimit) && raw.dailyLimit > 0) {
        dl = Math.floor(raw.dailyLimit);
      }
      /* 分组字段：旧数据缺 group / 非法值一律归「多多益善」，不改任何记录、合计与顺序；
         「如实知见」组只记流水，恒不设目标与上限 */
      var grp = (raw.group === GROUP_LESS) ? GROUP_LESS
        : (raw.group === GROUP_FLOW) ? GROUP_FLOW : GROUP_MORE;
      if (grp === GROUP_FLOW) { tm = null; dl = null; }
      var proj = {
        id: id, name: Array.from(name).slice(0, 10).join(""),
        colorIndex: ci, targetMinutes: tm, createdAt: createdAt, sortIndex: si,
        dailyLimit: dl, group: grp
      };
      /* 系统项目「事来则应」：读取旧数据时也规整为固定名称 / 灰色 / 无目标，并打上系统标记 */
      var isChore = (raw.isSystem === true || raw.isSystemChore === true || raw.system === true ||
        raw.kind === "system" || id === CHORE_ID || isChoreName(name));
      if (isChore) { proj.name = CHORE_NAME; proj.targetMinutes = null; proj.isSystem = true; proj.group = null; }
      base.projects.push(proj);
      trackId(id);
    }
  }
  if (obj.days && typeof obj.days === "object" && !Array.isArray(obj.days)) {
    var dayKeys = Object.keys(obj.days);
    for (var d = 0; d < dayKeys.length; d++) {
      var dk = dayKeys[d];
      if (!isValidDayKey(dk)) continue;
      var bucket = obj.days[dk];
      if (!bucket || typeof bucket !== "object" || Array.isArray(bucket)) continue;
      var pids = Object.keys(bucket);
      for (var pi = 0; pi < pids.length; pi++) {
        var pid = pids[pi];
        if (!seenPid[pid]) continue; /* 丢弃已删除项目的孤儿段 */
        var arr = bucket[pid];
        if (!Array.isArray(arr)) continue;
        var clean = [];
        for (var s = 0; s < arr.length; s++) {
          var seg = sanitizeSegment(arr[s], s);
          if (!seg) continue;
          clean.push(seg);
          trackId(seg.id);
        }
        if (clean.length > 0) {
          if (!base.days[dk]) base.days[dk] = {};
          base.days[dk][pid] = clean;
        }
      }
    }
  }
  base.nextId = Math.max(base.nextId, maxIdNumber + 1);
  return base;
}

/* -------------------- 排序 / 旧数据迁移 / 新建置顶高亮（增量新增） -------------------- */

/** 取排序值；缺失或非法按 0 处理，保证比较不产生 NaN、不报错、不丢项目 */
function sortIndexOf(p) {
  var v = p && p.sortIndex;
  return (typeof v === "number" && Number.isFinite(v)) ? v : 0;
}

/** 新项目排序值：取当前时间戳，并严格大于现有最大值，保证一定置顶 */
function nextSortIndex() {
  var max = 0;
  var ps = Array.isArray(state.projects) ? state.projects : [];
  for (var i = 0; i < ps.length; i++) {
    var v = ps[i] && ps[i].sortIndex;
    if (typeof v === "number" && Number.isFinite(v) && v > max) max = v;
  }
  var ts = Date.now();
  return ts > max ? ts : Math.floor(max) + 1;
}

/**
 * 兼容旧数据：仅当存在缺 sortIndex 的项目时，按当前数组顺序（= 升级前显示顺序）
 * 整体重新编号，第一个最大、依次递减 100；返回是否需要写回 localStorage。
 * 升级后所有项目都有 sortIndex，之后打开直接读取，不再重新推算。
 */
function ensureSortIndexes(st) {
  var ps = (st && Array.isArray(st.projects)) ? st.projects : [];
  var need = false;
  for (var i = 0; i < ps.length; i++) {
    var v = ps[i] && ps[i].sortIndex;
    if (typeof v !== "number" || !Number.isFinite(v)) { need = true; break; }
  }
  if (!need) return false;
  var n = ps.length;
  for (var j = 0; j < n; j++) ps[j].sortIndex = (n - j) * 100;
  return true;
}

/** 系统项目「事来则应」：不参与排序，永远固定在列表最底部 */
function isChoreProject(p) {
  if (!p) return false;
  if (p.isSystem === true || p.system === true || p.kind === "system") return true;
  return isChoreName(p.name);
}

/* -------------------- 分组字段（第八轮增量；第十五轮扩展第三组） -------------------- */
var GROUP_MORE = "more", GROUP_LESS = "less", GROUP_FLOW = "flow";
var GROUP_LABEL = { more: "多多益善", less: "适可而止", flow: "如实知见" };

/** 取项目分组：旧数据缺 group / 非法值一律归「多多益善」；系统「事来则应」不属于任何组，返回 null。
    单字段保证一个项目只属于一个组。 */
function groupOf(p) {
  if (!p || isSystemChore(p) || isChoreProject(p)) return null;
  if (p.group === GROUP_LESS) return GROUP_LESS;
  if (p.group === GROUP_FLOW) return GROUP_FLOW;
  return GROUP_MORE;
}
/** CSV / 记录卡用的中文标签 */
function groupLabelOf(p) {
  if (!p) return "";
  if (isSystemChore(p) || isChoreProject(p)) return CHORE_NAME;
  return GROUP_LABEL[groupOf(p)];
}
/** 圆形图标里的紧凑目标文案：30 分 / 1.5 时 / 2 时 */
function formatOrbTarget(mins) {
  var n = Math.max(0, Math.floor(Number(mins) || 0));
  if (n < 60) return n + " 分";
  var h = n / 60;
  return (Number.isInteger(h) ? String(h) : h.toFixed(1)) + " 时";
}

/** 列表显示顺序：普通项目按 sortIndex 降序；重复值按原数组先后（索引小者靠前）；
 *  事来则应固定追加到末尾。返回副本，不改动 state.projects 原数组。 */
/* ---------- 项目热度排序（v0.3G）----------
 * 次数不存成计数器，而是从 state.days 的记录段现算：
 *   - 同步合并按段 id 去重、两端独有的段都保留，所以次数天然是两端之和，一次都不会少；
 *   - 上线即刻按历史记录排出热度，老数据零迁移；删记录次数自动减。
 * sortMode 只存独立 localStorage，不进 state、不参与同步，刷新保留，各设备可有自己的偏好。 */
var SORT_MODE_KEY = "my-time-records:sort-mode:v1";
var SORT_MODE_HOT = "hot", SORT_MODE_INDEX = "index";
var sortMode = (function () {
  try {
    var v = window.localStorage.getItem(SORT_MODE_KEY);
    return v === SORT_MODE_INDEX ? SORT_MODE_INDEX : SORT_MODE_HOT;
  } catch (e) { return SORT_MODE_HOT; }
})();

/** 遍历所有天的所有记录段，返回 {pid: 段数}；纯读，不改 state、不触发 save。 */
function useCountMap() {
  var counts = {};
  var days = state.days || {};
  var dks = Object.keys(days);
  for (var i = 0; i < dks.length; i++) {
    var bucket = days[dks[i]];
    if (!bucket || typeof bucket !== "object" || Array.isArray(bucket)) continue;
    var pids = Object.keys(bucket);
    for (var j = 0; j < pids.length; j++) {
      var arr = bucket[pids[j]];
      if (Array.isArray(arr)) counts[pids[j]] = (counts[pids[j]] || 0) + arr.length;
    }
  }
  return counts;
}

function toggleSortMode() {
  sortMode = (sortMode === SORT_MODE_HOT) ? SORT_MODE_INDEX : SORT_MODE_HOT;
  try { window.localStorage.setItem(SORT_MODE_KEY, sortMode); } catch (e) {}
  updateSortModeBtn();
  refreshProjectList();   /* 只局部重绘，不触发 save / 同步钩子 */
}

function updateSortModeBtn() {
  var b = document.getElementById("sort-mode-btn");
  if (!b) return;
  var hot = sortMode === SORT_MODE_HOT;
  b.textContent = hot ? "⇅ 按热度" : "⇅ 按顺序";
  b.classList.toggle("hot", hot);
  b.title = hot ? "当前按调用次数排序，点击切回新建顺序" : "当前按新建顺序，点击改为按调用次数排序";
}

function orderedProjectsForDisplay() {
  var ps = Array.isArray(state.projects) ? state.projects : [];
  var normal = [], chore = [];
  for (var i = 0; i < ps.length; i++) {
    var entry = { p: ps[i], idx: i };
    if (isChoreProject(ps[i])) chore.push(entry);
    else normal.push(entry);
  }
  /* 热度模式：主键调用次数降序，次数相同时回退 sortIndex 降序（新建 / 移动仍是「0 次区」第一），
     再相同回退原始下标保证稳定；顺序模式完全沿用原来的 sortIndex 降序。系统项目始终沉底。 */
  var counts = (sortMode === SORT_MODE_HOT) ? useCountMap() : null;
  normal.sort(function (a, b) {
    var d = 0;
    if (counts) d = (counts[b.p.id] || 0) - (counts[a.p.id] || 0);
    if (d === 0) d = sortIndexOf(b.p) - sortIndexOf(a.p);
    return d !== 0 ? d : (a.idx - b.idx);
  });
  var out = [];
  for (var k = 0; k < normal.length; k++) out.push(normal[k].p);
  for (var c = 0; c < chore.length; c++) out.push(chore[c].p);
  return out;
}

/* 新建后置顶可见：记录待高亮项目 id，render 重建 DOM 后仍能重新触发一次 */
var revealPid = null, revealTimer = null, revealScrolled = false;
function markReveal(pid) {
  revealPid = pid;
  revealScrolled = false;
  if (revealTimer !== null) { clearTimeout(revealTimer); revealTimer = null; }
  revealTimer = setTimeout(function () { revealPid = null; revealTimer = null; }, 1300);
}
/** 每次 render 末尾调用：给新卡片一次浅蓝高亮，并（仅首次）滚动到它 */
function applyReveal() {
  if (!revealPid) return;
  var host = document.getElementById("project-list");
  if (!host) return;
  var cards = host.querySelectorAll(".project-card");
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    if (card.getAttribute("data-project-id") !== revealPid) continue;
    card.classList.add("flash-new");
    if (!revealScrolled) {
      revealScrolled = true;
      if (typeof card.scrollIntoView === "function") {
        try { card.scrollIntoView({ behavior: "smooth", block: "center" }); }
        catch (e) { try { card.scrollIntoView(); } catch (e2) {} }
      }
    }
    break;
  }
}

/* -------------------- 系统项目「事来则应」/ 备注 / 中断面板（增量新增） -------------------- */

/** 是否系统项目：显式标记或固定 id 判定，用于「不可删/改名/设目标」的权限判断 */
function isSystemChore(p) {
  if (!p) return false;
  return p.isSystem === true || p.isSystemChore === true || p.system === true || p.kind === "system" || p.id === CHORE_ID;
}

/** 项目显示色：系统「事来则应」固定中性灰，其余按 colorIndex 取调色板 */
function projectColor(p) {
  if (p && (isSystemChore(p) || isChoreProject(p))) return CHORE_COLOR;
  return colorOf(p && p.colorIndex);
}

function getChoreProject() {
  var ps = Array.isArray(state.projects) ? state.projects : [];
  for (var i = 0; i < ps.length; i++) if (isSystemChore(ps[i])) return ps[i];
  for (var j = 0; j < ps.length; j++) if (isChoreProject(ps[j])) return ps[j];
  return null;
}

/** 把 fromPid 的所有记录段并入 toPid，规整事来则应项目时不丢记录 */
function mergeChoreRecords(st, fromPid, toPid) {
  var days = st.days || {};
  var keys = Object.keys(days);
  for (var i = 0; i < keys.length; i++) {
    var b = days[keys[i]];
    if (!b || !Array.isArray(b[fromPid])) continue;
    if (!Array.isArray(b[toPid])) b[toPid] = [];
    for (var j = 0; j < b[fromPid].length; j++) b[toPid].push(b[fromPid][j]);
    delete b[fromPid];
  }
}

/**
 * 保证系统项目「事来则应」唯一存在（首次打开 / 旧数据都自动补齐），并规整属性：
 * 固定中性灰、无每日目标、isSystem 标记。已有同名普通项目原地升级（不改 id，记录不丢）。
 * 返回是否发生变更，供 init 决定是否写回 localStorage。
 */
function ensureChoreProject(st) {
  var ps = Array.isArray(st.projects) ? st.projects : (st.projects = []);
  var chore = null, extras = [];
  for (var i = 0; i < ps.length; i++) {
    var p = ps[i];
    if (!p) continue;
    var byName = isChoreName(p.name);
    if (isSystemChore(p) || byName) { if (!chore) chore = p; else extras.push(p); }
  }
  var changed = false;
  if (!chore) {
    chore = { id: CHORE_ID, name: CHORE_NAME, colorIndex: 0,
      targetMinutes: null, createdAt: Date.now(), sortIndex: 0, isSystem: true, group: null };
    ps.push(chore);
    changed = true;
  }
  function force(k, v) { if (chore[k] !== v) { chore[k] = v; changed = true; } }
  force("isSystem", true);
  force("name", CHORE_NAME);
  force("targetMinutes", null);
  force("group", null);
  if (typeof chore.sortIndex !== "number" || !Number.isFinite(chore.sortIndex)) { chore.sortIndex = 0; changed = true; }
  if (extras.length > 0) {
    for (var e = 0; e < extras.length; e++) {
      if (extras[e].id !== chore.id) mergeChoreRecords(st, extras[e].id, chore.id);
    }
    st.projects = ps.filter(function (x) { return x === chore || extras.indexOf(x) < 0; });
    changed = true;
  }
  return changed;
}

/* ---- 备注折叠：>8 字折叠，点整行展开/收起 ---- */
var expandedNoteIds = {};
function noteChars(text) { return Array.from(String(text === null || text === undefined ? "" : text)); }
function noteShort(text) { return noteChars(text).slice(0, 8).join("") + "…"; }
function toggleNote(segId) {
  if (expandedNoteIds[segId]) delete expandedNoteIds[segId];
  else expandedNoteIds[segId] = true;
  var now = Date.now();
  renderRecordList(computeDayStats(state, dayKeyOf(now), now));
}

/* ---- 顶部状态条「事来则应已记录 XX 分钟」浮现提示 ---- */
var choreNoticeText = "", choreNoticeTimer = null;
function showChoreNotice(text) {
  choreNoticeText = text;
  if (choreNoticeTimer !== null) { clearTimeout(choreNoticeTimer); choreNoticeTimer = null; }
  choreNoticeTimer = setTimeout(function () {
    choreNoticeText = ""; choreNoticeTimer = null;
    renderStatusBar(findRunningSegment(state));
  }, 3000);
}

/* ---- 中断原因底部面板 ---- */
var CHORE_REASONS = ["喝咖啡休息", "接电话", "临时被叫走", "事来则应"];
var sheetState = null;

function closeSheet() {
  sheetState = null;
  var root = document.getElementById("sheet-root");
  if (root && root.parentNode) root.parentNode.removeChild(root);
}

function readSheetNote() {
  var input = document.getElementById("sheet-note");
  if (!input) return "";
  return noteChars(input.value).slice(0, 20).join("").trim();
}

function toggleSheetReason(el) {
  if (!sheetState) return;
  var r = el.getAttribute("data-reason") || "";
  var input = document.getElementById("sheet-note");
  var all = document.querySelectorAll(".sheet-reason");
  for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
  if (sheetState.selected === r) {
    sheetState.selected = "";
    if (input) input.value = "";
  } else {
    sheetState.selected = r;
    if (input) input.value = r;
    el.classList.add("active");
  }
}

function onSheetClick(e) {
  var t = (e.target && typeof e.target.closest === "function") ? e.target : null;
  if (!t) return;
  var el = t.closest("[data-sheet-action]");
  if (!el) return;
  var act = el.getAttribute("data-sheet-action");
  if (act === "reason") { toggleSheetReason(el); return; }
  var pid = sheetState ? sheetState.pid : null;
  var note = (act === "only" || act === "chore") ? readSheetNote() : "";
  closeSheet();
  if (!pid) return;
  if (act === "chore") doInterrupt(pid, "chore", note);
  else if (act === "only") doInterrupt(pid, "only", note);
  else if (act === "backdrop") doInterrupt(pid, "only", "");
}

function bindSheetSwipe(panel) {
  if (!panel) return;
  var startY = null, dy = 0;
  panel.addEventListener("touchstart", function (e) {
    if (e.touches && e.touches.length === 1) { startY = e.touches[0].clientY; dy = 0; }
  }, { passive: true });
  panel.addEventListener("touchmove", function (e) {
    if (startY === null || !e.touches || !e.touches.length) return;
    dy = e.touches[0].clientY - startY;
    if (dy > 0) panel.style.transform = "translateY(" + dy + "px)";
  }, { passive: true });
  panel.addEventListener("touchend", function () {
    if (startY === null) return;
    var shouldClose = dy > 60;
    startY = null; dy = 0;
    panel.style.transform = "";
    if (shouldClose) {
      var pid = sheetState ? sheetState.pid : null;
      closeSheet();
      if (pid) doInterrupt(pid, "only", "");
    }
  }, { passive: true });
}

function openInterruptSheet(pid) {
  closeSheet();
  var p = getProject(pid);
  if (!p) return;
  sheetState = { pid: pid, selected: "" };
  var reasons = "";
  for (var i = 0; i < CHORE_REASONS.length; i++) {
    reasons += '<button class="sheet-reason" data-sheet-action="reason" data-reason="' + esc(CHORE_REASONS[i]) + '">' + esc(CHORE_REASONS[i]) + '</button>';
  }
  var root = document.createElement("div");
  root.id = "sheet-root";
  root.innerHTML =
    '<div class="sheet-backdrop" data-sheet-action="backdrop"></div>' +
    '<div class="sheet-panel">' +
      '<div class="sheet-handle"></div>' +
      '<div class="sheet-title">中断《' + esc(p.name) + '》</div>' +
      '<div class="sheet-reasons">' + reasons + '</div>' +
      '<input id="sheet-note" class="sheet-input" type="text" maxlength="20" placeholder="补充说明" autocomplete="off">' +
      '<div class="sheet-actions">' +
        '<button class="btn btn-primary" data-sheet-action="chore">中断并开始记事来则应</button>' +
        '<button class="btn btn-outline" data-sheet-action="only">只中断</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(root);
  root.addEventListener("click", onSheetClick);
  var input = document.getElementById("sheet-note");
  if (input) input.addEventListener("input", function () {
    if (!sheetState) return;
    sheetState.selected = "";
    var all = root.querySelectorAll(".sheet-reason");
    for (var j = 0; j < all.length; j++) all[j].classList.remove("active");
  });
  bindSheetSwipe(root.querySelector(".sheet-panel"));
}

/** 立刻开始一段「事来则应」：承接来源项目 + 自动备注 */
function startChoreSegment(now, sourceName, extraNote) {
  var chore = getChoreProject();
  if (!chore) return;
  var note = "因《" + sourceName + "》中断" + (extraNote ? " " + extraNote : "");
  var b = ensureBucket(state.days, dayKeyOf(now), chore.id);
  b.push({
    id: newId("s"), start: now, end: null, endType: "running",
    note: noteChars(note).slice(0, 50).join(""),
    sourceProject: noteChars(sourceName).slice(0, 10).join("")
  });
  state.currentDayKey = dayKeyOf(now);
}

/**
 * 执行中断：闭合当前项目进行中段（interrupted）并写入备注；
 * mode=chore 时紧接着开始一段事来则应，sourceProject 记为来源项目名。
 */
function doInterrupt(pid, mode, noteText) {
  var now = Date.now();
  syncRolloverForNow(now);
  var p = getProject(pid);
  var pname = p ? p.name : "";
  var note = noteChars(noteText).slice(0, 50).join("");
  var running = findRunningSegment(state);
  if (running && running.projectId === pid) {
    closeRunningAt(running, now, "interrupted", { note: note });
  }
  if (mode === "chore") {
    var chore = getChoreProject();
    var still = findRunningSegment(state);
    if (chore && (!still || still.projectId !== chore.id)) startChoreSegment(now, pname, note);
  }
  state.currentDayKey = dayKeyOf(now);
  save();
  render();
  /* 中断那一刻同样检查超额（只提示，不阻断） */
  checkLimitNotice(pid, dayKeyOf(now), now, true);
}

/** 「清空今日记录」：只删除系统事来则应今天的记录段 */
function clearChoreToday() {
  var chore = getChoreProject();
  if (!chore) return;
  var now = Date.now();
  syncRolloverForNow(now);
  var dayKey = dayKeyOf(now);
  if (state.days && state.days[dayKey]) {
    delete state.days[dayKey][chore.id];
    if (Object.keys(state.days[dayKey]).length === 0) delete state.days[dayKey];
  }
  state.currentDayKey = dayKey;
  save();
  render();
  showToast("已清空「事来则应」今日记录");
}

/* -------------------- 模块顺序 / 记录列表折叠 / 导出 / 滚动（增量新增） -------------------- */

/** 「今日记录」展开状态：纯 UI 状态，不写入 state / localStorage，展开收起不改任何数据 */
var RECORDS_PAGE_SIZE = 5;
var recordsExpanded = false;
/** 时间分布：当前展开的小时（0–23），null = 收起；纯 UI 状态，不写入 state / localStorage */
var timelineHour = null;

function toggleRecordsExpanded() {

/** 点某个小时格：展开/收起该小时明细；沿用「只重绘单块」范式，不整页 render */

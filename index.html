function loadSyncCfg() {
  var raw = null;
  try { raw = window.localStorage.getItem(SYNC_CFG_KEY); } catch (e) { raw = null; }
  if (!raw) return;
  var o = null;
  try { o = JSON.parse(raw); } catch (e) { return; }
  if (!o || typeof o !== "object") return;
  syncCfg.code = (typeof o.code === "string") ? o.code : "";
  syncCfg.lastRev = (typeof o.lastRev === "number" && isFinite(o.lastRev) && o.lastRev >= 0) ? o.lastRev : 0;
  syncCfg.lastAt = (typeof o.lastAt === "number" && isFinite(o.lastAt)) ? o.lastAt : 0;
  syncCfg.enabled = (o.enabled === true) && syncCfg.code.length >= SYNC_MIN_CODE;
}

function persistSyncCfg() {
  try { window.localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(syncCfg)); } catch (e) {}
}

/* ---------- 网络层：只用 apikey 头，无需 Authorization ---------- */
function syncRpc(fn, body) {
  return fetch(SYNC_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { "apikey": SYNC_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (res) {
    return res.text().then(function (txt) {
      var js = null;
      try { js = txt ? JSON.parse(txt) : null; } catch (e) { js = null; }
      if (!res.ok) {
        var m = (js && (js.message || js.hint)) ? String(js.message || js.hint) : ("HTTP " + res.status);
        throw new Error(m);
      }
      return js;
    });
  });
}

function syncPull() {
  return syncRpc("ttr_pull", { p_code: syncCfg.code }).then(function (rows) {
    if (!Array.isArray(rows) || !rows.length) return null;
    var row = rows[0];
    if (!row || !row.payload || typeof row.payload !== "object") return null;
    return { payload: row.payload, rev: Number(row.rev) || 0 };
  });
}

function syncPush(payload, baseRev) {
  return syncRpc("ttr_push", { p_code: syncCfg.code, p_payload: payload, p_base_rev: baseRev })
    .then(function (rows) {
      var row = (Array.isArray(rows) && rows.length) ? rows[0] : null;
      if (!row) throw new Error("推送未返回结果");
      return { rev: Number(row.rev) || 0, conflict: row.conflict === true };
    });
}

/* ---------- 应用远端状态：直接写盘 + 重绘，绝不调 save()（否则会再触发同步） ---------- */
function applyRemoteState(payload) {
  state = sanitizeState(payload);
  try { ensureChoreProject(state); } catch (e) {}
  try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  render();
  renderSyncBar();
}

/* ---------- 合并：远端为基底，把本地独有的项目/段补进去 ---------- */
function mergeRemote(localS, remoteS) {
  var out = syncClone(remoteS);
  if (!Array.isArray(out.projects)) out.projects = [];
  if (!out.days || typeof out.days !== "object") out.days = {};

  var rp = {}, taken = {}, i, k;
  for (i = 0; i < out.projects.length; i++) { rp[out.projects[i].id] = out.projects[i]; taken[out.projects[i].id] = true; }

  var localProj = Array.isArray(localS.projects) ? localS.projects : [];
  var pidMap = {};

  function freshPid(base) {
    var n = 1, cand = base + "_m";
    while (taken[cand]) { n++; cand = base + "_m" + n; }
    return cand;
  }

  for (i = 0; i < localProj.length; i++) {
    var lp = localProj[i];
    if (!lp || !lp.id) continue;
    var same = rp[lp.id];
    if (!same) {
      var c1 = syncClone(lp);
      out.projects.push(c1); rp[c1.id] = c1; taken[c1.id] = true;
      pidMap[lp.id] = c1.id;
    } else if (String(same.name == null ? "" : same.name) === String(lp.name == null ? "" : lp.name)) {
      pidMap[lp.id] = lp.id;
    } else {
      /* 两台设备各自新建却撞了同一个 id：给本地这个换新 id，并迁移它的记录 */
      var nid = freshPid(lp.id);
      var c2 = syncClone(lp);
      c2.id = nid;
      out.projects.push(c2); rp[nid] = c2; taken[nid] = true;
      pidMap[lp.id] = nid;
    }
  }

  var ldays = (localS.days && typeof localS.days === "object") ? localS.days : {};
  for (var dk in ldays) {
    if (!Object.prototype.hasOwnProperty.call(ldays, dk)) continue;
    var bucket = ldays[dk];
    if (!bucket || typeof bucket !== "object") continue;
    for (var pid in bucket) {
      if (!Object.prototype.hasOwnProperty.call(bucket, pid)) continue;
      var arr = bucket[pid];
      if (!Array.isArray(arr) || !arr.length) continue;
      var np = pidMap[pid] || pid;
      if (!rp[np]) continue;                    /* 项目已不存在：随项目一起丢弃 */
      if (!out.days[dk]) out.days[dk] = {};
      if (!Array.isArray(out.days[dk][np])) out.days[dk][np] = [];
      var target = out.days[dk][np], seen = {}, a, b;
      for (a = 0; a < target.length; a++) seen[target[a].id] = true;
      for (b = 0; b < arr.length; b++) {
        var seg = arr[b];
        if (!seg || !seg.id) continue;
        if (!seen[seg.id]) { target.push(syncClone(seg)); seen[seg.id] = true; continue; }
        /* 同 id：内容一致视为同一条；不一致说明两端各自生成撞号，改名后都保留 */
        var exist = null, t;
        for (t = 0; t < target.length; t++) if (target[t].id === seg.id) { exist = target[t]; break; }
        var diff = !exist
          || Number(exist.start) !== Number(seg.start)
          || Number(exist.end === null ? -1 : exist.end) !== Number(seg.end === null ? -1 : seg.end)
          || String(exist.note == null ? "" : exist.note) !== String(seg.note == null ? "" : seg.note);
        if (diff) {
          var nsid = seg.id + "_m", c = 1;
          while (seen[nsid]) { c++; nsid = seg.id + "_m" + c; }
          var ns = syncClone(seg); ns.id = nsid;
          target.push(ns); seen[nsid] = true;
        }
      }
    }
  }

  out.nextId = Math.max(Number(out.nextId) || 1, Number(localS.nextId) || 1);
  return out;
}

/* ---------- 调度 ---------- */
function markSyncDirty() {
  if (!syncCfg.enabled || syncRt.running) return;
  syncRt.dirty = true;
  scheduleSync();
}

function scheduleSync() {
  if (!syncCfg.enabled) return;
  if (syncRt.timer) { try { window.clearTimeout(syncRt.timer); } catch (e) {} }
  syncRt.timer = window.setTimeout(function () {
    syncRt.timer = null;
    runSync(false);
  }, SYNC_THROTTLE_MS);
}

/* ---------- 主流程：pull → 判断 → merge/push → 冲突重试一次 ---------- */
function runSync(manual) {
  if (!syncCfg.enabled) return Promise.resolve();
  if (syncRt.running) return Promise.resolve();
  syncRt.running = true;
  if (manual) syncRt.err = "";
  renderSyncBar();

  function settle(ok, msg) {
    syncRt.running = false;
    if (ok) {
      syncRt.err = "";
      syncRt.dirty = false;
      syncCfg.lastAt = Date.now();
      persistSyncCfg();
    } else {
      syncRt.err = msg || "同步失败";
    }
    renderSyncBar();
    renderFooterNote();
  }

  return syncPull().then(function (remote) {
    if (!remote) {
      return { push: syncClone(state), base: 0, applyAfter: false };
    }
    var rev = remote.rev;

    if (rev === syncCfg.lastRev && !syncRt.dirty) return { done: true };

    if (rev !== syncCfg.lastRev && !syncRt.dirty) {
      /* 云端更新、本地无改动：直接采用云端（删除操作因此能生效） */
      applyRemoteState(remote.payload);
      syncCfg.lastRev = rev;
      persistSyncCfg();
      return { done: true };
    }

    if (rev !== syncCfg.lastRev && syncRt.dirty) {
      /* 两端都有改动：合并后推送 */
      return { push: mergeRemote(state, remote.payload), base: rev, applyAfter: true };
    }

    return { push: syncClone(state), base: rev, applyAfter: false };
  }).then(function (plan) {
    if (!plan || plan.done) return null;
    return syncPush(plan.push, plan.base).then(function (r) {
      if (!r.conflict) {
        syncCfg.lastRev = r.rev;
        persistSyncCfg();
        if (plan.applyAfter) applyRemoteState(plan.push);
        return null;
      }
      /* 版本被别的设备抢先推进：重新拉取、合并、重推一次 */
      return syncPull().then(function (again) {
        var rev2 = again ? again.rev : 0;
        var merged = again ? mergeRemote(state, again.payload) : syncClone(state);
        return syncPush(merged, rev2).then(function (r2) {
          if (r2.conflict) throw new Error("两台设备同时在改，请稍后再试");
          syncCfg.lastRev = r2.rev;
          persistSyncCfg();
          applyRemoteState(merged);
          return null;
        });
      });
    });
  }).then(function () {
    settle(true);
  }).catch(function (e) {
    settle(false, (e && e.message) ? e.message : "网络异常");
  });
}

/* ---------- UI ---------- */
function syncAgoText() {
  if (!syncCfg.lastAt) return "尚未同步";
  var d = Date.now() - syncCfg.lastAt;
  if (d < 45000) return "刚刚";
  if (d < 3600000) return Math.round(d / 60000) + " 分钟前";
  if (d < 86400000) return Math.round(d / 3600000) + " 小时前";
  return Math.round(d / 86400000) + " 天前";
}

/* ---------- 配对（v0.3B）：扫码代替手输同步码 ---------- */
var SYNC_PAIRED_NOW = false;

function genPairCode() {
  var alpha = "abcdefghijkmnpqrstuvwxyz23456789"; /* 去掉 l/o/0/1 等易混字符 */
  var arr = new Uint8Array(10), i, s = "";
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(arr);
  else for (i = 0; i < 10; i++) arr[i] = Math.floor(Math.random() * 256);
  for (i = 0; i < 10; i++) s += alpha.charAt(arr[i] % alpha.length);
  return "ok-" + s.slice(0, 6) + "-" + s.slice(6);
}

function pairLinkFor(code) {
  var origin = "https://oktime.cc", p = "/";
  try {
    if (/^https?:$/i.test(location.protocol)) origin = location.origin;
    p = location.pathname || "/";
  } catch (e) {}
  p = p.replace(/[^/]*$/, "");            /* 去掉文件名，只留目录 */
  if (p === "") p = "/";
  return origin + p + "?pair=" + encodeURIComponent(code);
}

function paintQR(canvas, text) {
  if (!canvas || typeof QRCore === "undefined") return false;
  var r;
  try { r = QRCore.make(String(text)); } catch (e) { return false; }
  var quiet = 4, total = r.size + quiet * 2;
  var scale = Math.max(2, Math.floor(184 / total));
  var px = total * scale;
  var dpr = window.devicePixelRatio || 1;
  var ctx = canvas.getContext("2d");
  if (!ctx) return false;
  canvas.width = Math.round(px * dpr);
  canvas.height = Math.round(px * dpr);
  canvas.style.width = px + "px";
  canvas.style.height = px + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, px, px);
  ctx.fillStyle = "#000000";
  for (var i = 0; i < r.size; i++) {
    for (var j = 0; j < r.size; j++) {
      if (r.modules[i][j]) ctx.fillRect((j + quiet) * scale, (i + quiet) * scale, scale, scale);
    }
  }
  return true;
}

function openPairModal() {
  if (!syncCfg.enabled) { openSyncModal(); return; }
  var link = pairLinkFor(syncCfg.code);
  var panel =
    '<div class="modal-title">配对一台新设备</div>' +
    '<div class="modal-desc">用另一台设备的相机或微信扫这个码，它会自动打开同一份记录并开始同步，不需要手输任何东西。</div>' +
    '<div class="pair-box"><div class="pair-qr"><canvas id="pair-qr"></canvas></div></div>' +
    '<div class="pair-code">' + syncEsc(syncCfg.code) + '</div>' +
    '<label class="modal-label" for="pair-link">或者复制这条链接，发到你自己的另一台设备</label>' +
    '<div class="pair-link-row">' +
      '<div class="pair-link" id="pair-link">' + syncEsc(link) + '</div>' +
      '<button type="button" class="btn btn-primary" data-action="pair-copy">复制</button>' +
    '</div>' +
    '<div class="sync-hint">这条链接等同于密码，只发给你自己的设备。别人拿到它就能读到你的记录。</div>' +
    '<div class="modal-actions"><button type="button" class="btn btn-ghost" data-action="modal-backdrop">完成</button></div>';
  openModalShell(panel, { kind: "pair" });
  if (!paintQR(document.getElementById("pair-qr"), link)) showModalError("二维码生成失败，请改用下面的链接");
}

function copyPairLink() {
  var box = document.getElementById("pair-link");
  if (!box) return;
  var text = String(box.textContent || "").trim();
  function fallback() {
    try {
      var rng = document.createRange();
      rng.selectNodeContents(box);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(rng);
      showToast(document.execCommand("copy") ? "已复制链接" : "请长按选中后复制");
    } catch (e) { showToast("请长按选中后复制"); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { showToast("已复制链接"); }, fallback);
  } else fallback();
}

function fillRandomCode() {
  var input = document.getElementById("sync-code");
  if (!input) return;
  input.value = genPairCode();
  showModalError("");
  showToast("已生成，点「启用并同步」生效");
}

/* 读取 ?pair= / #pair= ，配对成功后立刻把参数从地址栏抹掉（不留历史、不传给外部） */
function readPairParam() {
  var q = "", h = "";
  try { q = String(location.search || ""); } catch (e) {}
  try { h = String(location.hash || ""); } catch (e) {}
  var m = /[?&]pair=([^&#]+)/.exec(q) || /[#&]pair=([^&#]+)/.exec(h);
  if (!m) return "";
  var v = "";
  try { v = decodeURIComponent(m[1]); } catch (e) { v = m[1]; }
  return String(v || "").trim();
}

function stripPairParam() {
  try {
    var q = String(location.search || "").replace(/([?&])pair=[^&#]*/g, "$1");
    q = q.replace(/[?&]+$/, "");
    if (q === "?") q = "";
    var h = String(location.hash || "").replace(/([#&])pair=[^&#]*/g, "$1").replace(/[#&]+$/, "");
    var url = location.pathname + q + h;
    if (window.history && history.replaceState) history.replaceState(null, "", url);
  } catch (e) {}
}

function applyPairFromUrl() {
  var code = readPairParam();
  if (!code) return false;
  loadSyncCfg();   /* 必须先读本机已有配置，否则判断不出「这台已经配对了」 */
  stripPairParam();
  if (!/^[A-Za-z0-9._~-]+$/.test(code) || code.length < SYNC_MIN_CODE) {
    showToast("配对链接无效，请重新扫码");
    return true;
  }
  if (syncCfg.enabled && syncCfg.code === code) {
    showToast("这台设备已经配对了");
    return true;
  }
  syncCfg.code = code;
  syncCfg.enabled = true;
  syncCfg.lastRev = 0;
  persistSyncCfg();
  /* 本机已有记录：视为待上行，走合并，云端不会覆盖掉 */
  syncRt.dirty = hasAnySegment(state);
  SYNC_PAIRED_NOW = true;
  renderFooterNote();
  renderSyncBar();
  showToast("已配对，正在同步…");
  runSync(true).then(function () {
    if (syncRt.err) showToast("配对成功，但同步失败：" + syncRt.err);
    else showToast("已配对，同步完成");
  });
  return true;
}

function renderSyncBar() {

  var el = document.getElementById("sync-bar");
  if (!el) return;
  if (!syncCfg.enabled) {
    el.innerHTML = '<button type="button" class="sync-bar" data-action="sync-open">' +
      '<span class="sync-dot"></span>' +
      '<span class="sync-text">跨设备同步 · 未启用</span>' +
      '<span class="sync-arrow">›</span></button>';
    return;
  }
  var dot = "sync-dot", text;
  if (syncRt.running) { dot += " sync-dot-busy"; text = "同步中…"; }
  else if (syncRt.err) { dot += " sync-dot-err"; text = "同步失败 · " + syncRt.err; }
  else { dot += " sync-dot-on"; text = "已同步 · " + syncAgoText(); }
  el.innerHTML = '<button type="button" class="sync-bar" data-action="sync-open">' +
    '<span class="' + dot + '"></span>' +
    '<span class="sync-text">' + syncEsc(text) + '</span>' +
    '<span class="sync-arrow">›</span></button>' +
    '<button type="button" class="sync-now" data-action="sync-now"' +
      (syncRt.running ? ' disabled' : '') +
      ' title="立即同步：从云端拉取最新记录" aria-label="立即同步">' +
      '<span class="sync-now-ico" aria-hidden="true">⟳</span>' +
      '<span class="sync-now-txt">立即同步</span></button>';
}

/* v0.3H：一键从云端拉取最新，不刷新页面。
   runSync() 内部本来就无条件先 syncPull()，且 rev 变化 + 本地无改动时会 applyRemoteState()
   重绘，所以这里不必改 runSync / initSync。刻意不做自动轮询：流量与整页重绘都由用户主动触发。 */
function doSyncNow() {
  if (!syncCfg.enabled) return;
  if (syncRt.running) { showToast("正在同步…"); return; }
  showToast("正在同步…");
  runSync(true).then(function () {
    if (syncRt.err) { showToast("同步失败：" + syncRt.err); return; }
    showToast("已同步到最新");
  });
}

function renderFooterNote() {
  var el = document.getElementById("footer-note-text");
  if (!el) return;
  el.textContent = syncCfg.enabled ? "数据保存在本机浏览器 · 已开启跨设备同步" : "数据保存在本机浏览器";
}

function openSyncModal() {
  var enabled = syncCfg.enabled;
  var panel =
    '<div class="modal-title">跨设备同步</div>' +
    '<div class="modal-desc">用同一个同步码，在电脑和手机上看到同一份记录。数据存在你自己的数据库里，关掉同步不影响本地记录。</div>' +
    '<label class="modal-label" for="sync-code">同步码（至少 ' + SYNC_MIN_CODE + ' 位）</label>' +
    '<input class="modal-input" id="sync-code" type="text" autocomplete="off" spellcheck="false" placeholder="例如 ok-7f3k2m9q-x8v4" value="' + syncEsc(syncCfg.code) + '">' +
    '<div class="sync-hint">两台设备输入完全相同的同步码即可。同步码只保存在各自设备上，服务器只存它的哈希，不存明文。</div>' +
    (enabled ? '' : '<div class="sync-gen"><button type="button" class="btn btn-ghost" data-action="sync-gen">随机生成一个</button></div>') +
    (enabled ? '<div class="sync-meta">上次同步：' + (syncCfg.lastAt ? new Date(syncCfg.lastAt).toLocaleString() : "尚未") + (syncRt.err ? "（上次失败：" + syncEsc(syncRt.err) + "）" : "") + '</div>' : '') +
    '<div class="modal-error" id="modal-error"></div>' +
    (enabled ? '<div class="pair-entry"><button type="button" class="btn btn-ghost" data-action="pair-open">配对一台新设备 ›</button></div>' : '') +
    '<div class="modal-actions">' +
      (enabled ? '<button type="button" class="btn btn-ghost" data-action="sync-off">关闭同步</button>' : '') +
      '<button type="button" class="btn btn-ghost" data-action="modal-backdrop">取消</button>' +
      '<button type="button" class="btn btn-primary" data-action="sync-save">' + (enabled ? "保存并同步" : "启用并同步") + '</button>' +
    '</div>';
  openModalShell(panel, { kind: "sync" });
}

function saveSyncFromModal() {
  var input = document.getElementById("sync-code");
  var code = input ? String(input.value || "").trim() : "";
  if (code.length < SYNC_MIN_CODE) { showModalError("同步码至少 " + SYNC_MIN_CODE + " 位"); return; }
  var wasEnabled = syncCfg.enabled;
  var changed = (code !== syncCfg.code);
  syncCfg.code = code;
  syncCfg.enabled = true;
  if (changed) syncCfg.lastRev = 0;
  persistSyncCfg();
  /* 首次启用：本地已有记录 -> 视为待上行，走合并而不是被云端覆盖 */
  syncRt.dirty = hasAnySegment(state);
  closeModal();
  renderFooterNote();
  renderSyncBar();
  showToast("正在同步…");
  runSync(true).then(function () {
    if (syncRt.err) { showToast("同步失败：" + syncRt.err); return; }
    if (!wasEnabled) {
      /* 首次启用：直接把配对码递到眼前，手机扫一下就完事 */
      showToast("已启用同步，用手机扫这个码");
      openPairModal();
      return;
    }
    showToast(changed ? "已启用同步" : "同步完成");
  });
}

function disableSync() {
  syncCfg.enabled = false;
  persistSyncCfg();
  closeModal();
  renderSyncBar();
  renderFooterNote();
  showToast("已关闭同步，本地记录不受影响");
}

function hasAnySegment(st) {
  var days = (st && st.days) ? st.days : {};
  for (var dk in days) {
    if (!Object.prototype.hasOwnProperty.call(days, dk)) continue;
    var b = days[dk];
    if (!b || typeof b !== "object") continue;
    for (var pid in b) {
      if (!Object.prototype.hasOwnProperty.call(b, pid)) continue;
      if (Array.isArray(b[pid]) && b[pid].length) return true;
    }
  }
  return false;
}

function initSync() {
  loadSyncCfg();
  renderSyncBar();
  renderFooterNote();
  if (syncCfg.enabled && !SYNC_PAIRED_NOW) {
    window.setTimeout(function () { runSync(false); }, 700);
  }
  /* 回到前台 / 恢复网络时补一次 */
  window.addEventListener("online", function () {
    if (syncCfg.enabled && (syncRt.dirty || syncRt.err)) runSync(false);
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && syncCfg.enabled && (syncRt.dirty || syncRt.err)) runSync(false);
  });
  /* 兜底：失败重试 + 刷新「N 分钟前」 */
  window.setInterval(function () {
    if (syncCfg.enabled && !syncRt.running && (syncRt.dirty || syncRt.err)) runSync(false);
    else renderSyncBar();
  }, 15000);
}

/* -------------------- 八、初始化 -------------------- */

function init() {
  /* 刷新 / 重新打开一律回到最顶部（「我的项目」），不恢复上次的滚动位置 */
  try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
  try { window.scrollTo(0, 0); } catch (e) {}
  state = load();
  /* 兼容旧数据：仅在存在缺 sortIndex 的项目时按当前顺序重编号 */
  var needSave = ensureSortIndexes(state);
  /* 系统项目「事来则应」：首次打开 / 读取旧数据时自动补齐并规整 */
  if (ensureChoreProject(state)) needSave = true;
  if (needSave) save();
  var now = Date.now();
  var k = dayKeyOf(now);
  if (state.currentDayKey !== k) {
    normalizeDayRollover(k);
    save();
  }
  historyDayKey = bjTodayKey();
  /* 搜索框是静态 DOM，浏览器刷新可能恢复表单值，这里显式清空以保证「刷新即清空」 */
  var psi0 = document.getElementById("proj-search-input");
  if (psi0) psi0.value = "";
  updateSortModeBtn();   /* v0.3G：按 localStorage 里的偏好还原排序按钮文案与状态 */
  render();
  /* 事件委托：只在 document 上绑定一次，render 重建 DOM 不重复绑定 */
  document.addEventListener("click", onDocumentClick);
  document.addEventListener("keydown", onDocumentKeydown);
  document.addEventListener("change", onDocumentChange);
  document.addEventListener("input", onDocumentInput);
  /* 约 30 秒轮询，仅检测是否跨天，不刷新任何数字 */
  window.setInterval(checkDayAndRefresh, 30000);
  /* 1s 只更新状态条上的「已计时」数字，绝不整页 render（避免打断菜单/弹层/输入焦点） */
  window.setInterval(tickRunningElapsed, 1000);
  applyPairFromUrl();
  initSync();
}

init();

/* QA 本地自测接口：不影响界面 */
window.TTR = {
  getState: function () { return state; },
  setStateForTest: function (s) { state = s; save(); render(); },
  render: render,
  computeDayStats: computeDayStats,
  dayKeyOf: dayKeyOf,
  minutesOfSegment: minutesOfSegment,
  formatMinutes: formatMinutes,
  splitSegmentByMidnight: splitSegmentByMidnight,
  PALETTE: PALETTE,
  STORAGE_KEY: STORAGE_KEY,
  openCardPreview: openCardPreview,
  bjTodayKey: bjTodayKey,
  bjDayKeyOf: bjDayKeyOf,
  shiftDayKey: shiftDayKey,
  renderHistory: renderHistory,
  shiftHistoryDay: shiftHistoryDay,
  normalizeHistoryDate: normalizeHistoryDate,
  defaultAddRangeForDay: defaultAddRangeForDay,
  openAddHourRecordModal: openAddHourRecordModal,
  saveHourRecord: saveHourRecord,
  toggleAddInlineNew: toggleAddInlineNew,
  setAddInlineGroup: setAddInlineGroup,
  isAddInlineNew: isAddInlineNew,
  createProjectInline: createProjectInline,
  currentAddInlineGroup: currentAddInlineGroup,
  getHistoryDayKey: function () { return historyDayKey; },
  setHistoryDayKey: function (k) { historyDayKey = normalizeHistoryDate(k) || bjTodayKey(); renderHistory(); },
  syncCfg: function () { return syncCfg; },
  syncRt: function () { return syncRt; },
  runSync: runSync,
  mergeRemote: mergeRemote,
  markSyncDirty: markSyncDirty,
  openSyncModal: openSyncModal,
  saveSyncFromModal: saveSyncFromModal,
  disableSync: disableSync,
  applyRemoteState: applyRemoteState,
  hasAnySegment: hasAnySegment,
  SYNC_URL: SYNC_URL,
  SYNC_KEY: SYNC_KEY,
  SYNC_CFG_KEY: SYNC_CFG_KEY,
  genPairCode: genPairCode,
  pairLinkFor: pairLinkFor,
  openPairModal: openPairModal,
  applyPairFromUrl: applyPairFromUrl,
  readPairParam: readPairParam,
  paintQR: paintQR,
  QRCore: (typeof QRCore !== 'undefined' ? QRCore : null),
  openMoveGroupModal: openMoveGroupModal,
  moveProjectToGroup: moveProjectToGroup,
  toggleProjMenu: toggleProjMenu,
  useCountMap: useCountMap,
  getSortMode: function () { return sortMode; },
  setSortModeForTest: function (m) {
    sortMode = (m === SORT_MODE_INDEX) ? SORT_MODE_INDEX : SORT_MODE_HOT;
    updateSortModeBtn(); refreshProjectList();
  },
  SORT_MODE_KEY: SORT_MODE_KEY,
  toggleSortMode: toggleSortMode
};
</script>

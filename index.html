/* ========== 基础与移动端适配 ========== */
:root{
  --blue:#2F7DF6;
  --bg:#F5F7FA;
  --text:#1F2A44;
  --muted:#8A94A6;
  --line:#EEF1F7;
  --soft:#E8EDF5;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;background:var(--bg);}
/* overflow-x:hidden 在部分浏览器会把 overflow-y 计算成 auto，可能使 sticky 失效；
   支持 clip 的浏览器改用 clip（不创建滚动容器），保证状态条 sticky 生效 */
@supports (overflow-x:clip){ html,body{overflow-x:clip;} }
html{-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  color:var(--text);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;touch-action:manipulation;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit;-webkit-tap-highlight-color:transparent;}
input{font-family:inherit;font-size:16px;-webkit-tap-highlight-color:transparent;}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
#app{
  max-width:100%;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
}
#app-header{max-width:480px;margin:0 auto;padding:0 12px 6px;display:flex;align-items:center;gap:8px;}
.avatar{
  width:46px;height:46px;flex:0 0 46px;border-radius:50%;
  background:linear-gradient(135deg,#4B93FF,#2F7DF6);color:#fff;
  font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(47,125,246,.25);
}
.header-name{flex:1 1 auto;min-width:0;}
.header-name-inner{display:flex;align-items:center;min-width:0;}
.header-name-text{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;font-weight:700;}
.icon-btn{
  width:44px;height:44px;flex:0 0 44px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:12px;color:var(--muted);font-size:22px;line-height:1;
}
.icon-btn:active{background:#EEF3FB;}
.icon-btn.edit-btn{color:#6E7C93;}
.icon-btn.plus{
  background:var(--blue);color:#fff;border-radius:14px;font-size:26px;font-weight:400;
  box-shadow:0 4px 10px rgba(47,125,246,.25);
}
.wrap{max-width:480px;margin:0 auto;padding:0 12px;}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(30,60,110,.06);padding:16px;margin-bottom:12px;}
.section-title{font-size:16px;font-weight:700;margin-bottom:12px;}
.empty-line{font-size:14px;color:var(--muted);padding:6px 0;}
.empty-block{font-size:14px;color:var(--muted);text-align:center;padding:22px 8px;line-height:1.6;}

/* ========== 状态条（仅计时中渲染，sticky） ========== */
#status-bar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  max-width:480px;width:calc(100% - 24px);margin:8px auto 10px;padding:0 14px;
  min-height:50px;display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.92);border-radius:14px;
  box-shadow:0 4px 16px rgba(30,60,110,.10);
}
.status-text{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600;color:var(--blue);}
.status-dot{flex:0 0 12px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 4px rgba(47,125,246,.10);}

/* ========== 今日概览：单一焦点 40px 今日累计 + 8px 细进度条 ========== */
.ov-label{font-size:13px;color:var(--muted);}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;display:inline-block;}
.ov-total{padding:2px 0 14px;}
.ov-headline{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
#stat-target{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
.ov-numbers{display:flex;align-items:baseline;font-size:40px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums;}
#stat-total{color:var(--text);}
.ov-progress-track{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;}
.ov-progress-fill{height:100%;width:0;border-radius:8px;background:var(--blue);transition:width .25s ease;}
.ov-progress-text{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 0 0;}
#stat-percent-text{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;background:#EAF2FF;color:var(--blue);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
#stat-remaining{font-size:13px;color:var(--muted);}

/* ========== 项目卡片 ========== */
/* 外层 .card 是唯一白底容器；内部项目行只留 1px 细分隔线与色条，不再套白卡 */
.project-card{
  position:relative;background:#fff;
  padding:0 0 0 10px;min-height:48px;display:flex;align-items:center;
}
.project-card:not(:last-child){border-bottom:1px solid var(--line);}
/* 新建项目：一次短暂的浅蓝底高亮，约 1 秒后淡出 */
.project-card.flash-new{animation:flash-new 1s ease-out;}
@keyframes flash-new{
  0%,55%{background-color:#DCEBFF;}
  100%{background-color:#FFFFFF;}
}
.proj-stripe{position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--accent,#5B8FF9);}
.proj-body{flex:1 1 auto;min-width:0;}
.proj-top{display:flex;align-items:center;gap:8px;min-width:0;min-height:48px;}
.proj-name{flex:0 1 auto;min-width:0;font-size:14px;font-weight:700;}
.proj-spacer{flex:1 1 auto;min-width:4px;}
.proj-today{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;white-space:nowrap;font-size:12px;color:var(--muted);line-height:1.25;}
.interrupt-note{font-size:11px;color:#AEB7C6;}
.menu-btn{font-size:22px;color:#9AA6B8;flex:0 0 44px;}
/* 目标胶囊、按钮独占行已移除；.proj-actions 新样式见文件末尾重构块 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  height:48px;min-height:48px;padding:0 12px;border-radius:12px;
  font-size:15px;font-weight:600;text-align:center;white-space:nowrap;min-width:0;
  transition:transform .08s ease,background .15s ease;
}
.btn:active{transform:scale(.985);}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(47,125,246,.22);}
.btn-outline{background:#fff;color:var(--blue);border:1.5px solid #BFD6FB;}
.btn-danger{background:#E8534A;color:#fff;}
.btn-disabled{opacity:.6;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1 1 0;min-width:0;}
.proj-menu{
  position:absolute;right:8px;top:50px;z-index:30;
  width:176px;max-width:calc(100% - 16px);
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 28px rgba(30,60,110,.16);padding:6px;
}
.menu-item{display:flex;align-items:center;width:100%;min-height:44px;padding:0 12px;border-radius:8px;font-size:14px;color:var(--text);text-align:left;}
.menu-item:active{background:#F2F7FF;}
.menu-item.danger{color:#E0453B;}

/* ========== 记录列表 ========== */
.record-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.record-row:last-child{border-bottom:0;}
.rec-main{flex:1 1 auto;min-width:0;}
.rec-line1{display:flex;align-items:center;gap:8px;min-width:0;}
.rec-name{flex:1 1 auto;min-width:0;font-size:14px;font-weight:600;}
.rec-time{flex:0 0 auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;}
.rec-line2{font-size:14px;color:var(--muted);margin-top:2px;}
.tag{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:6px;font-size:14px;color:#E8833A;background:#FFF3E6;}
.tag-running{color:var(--blue);background:#EAF2FF;}
.rec-del{flex:0 0 44px;color:#B4BDCB;font-size:24px;}
.rec-del:active{color:#E0453B;background:#FFF1F0;}

/* ========== 底部生成按钮：44px 描边次按钮（低频动作降级） ========== */
.generate-btn{
  width:100%;height:44px;border-radius:12px;
  background:#fff;color:var(--blue);border:1.5px solid #BFD6FB;
  font-size:15px;font-weight:700;margin-top:4px;box-shadow:none;
}
.generate-btn:active{transform:scale(.99);background:#F7FAFF;}
.footer-note{text-align:center;font-size:14px;color:#A6AFC0;margin-top:14px;}

/* ========== Toast ========== */
#toast{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;
  transform:translate(-50%,-10px);z-index:60;
  max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;
  background:rgba(31,42,68,.92);color:#fff;font-size:14px;line-height:1.45;text-align:center;
  box-shadow:0 8px 24px rgba(20,35,60,.22);
  opacity:0;pointer-events:none;word-break:break-word;
  transition:opacity .24s ease,transform .24s ease;
}
#toast.show{opacity:1;transform:translate(-50%,0);}
#toast:empty{display:none;}

/* ========== 弹层 ========== */
#modal-root:empty{display:none;}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,35,60,.42);z-index:100;}
.modal-panel{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:101;
  width:calc(100% - 32px);max-width:400px;max-height:calc(100vh - 48px);overflow-y:auto;
  background:#fff;border-radius:18px;padding:20px;
  box-shadow:0 18px 50px rgba(20,40,80,.24);
  -webkit-overflow-scrolling:touch;
}
.modal-title{font-size:18px;font-weight:700;margin-bottom:6px;}
.modal-desc{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:8px;}
.confirm-desc{font-size:14px;color:var(--text);margin-top:10px;margin-bottom:6px;}
.modal-label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px;}
.modal-input{
  width:100%;height:48px;padding:0 12px;border:1px solid #DCE5F2;border-radius:12px;
  background:#F9FBFF;color:var(--text);font-size:16px;outline:none;
}
.modal-input:focus{border-color:var(--blue);background:#fff;}
.modal-error{min-height:20px;margin-top:8px;font-size:14px;color:#E0453B;line-height:1.4;}
.modal-actions{display:flex;gap:10px;margin-top:14px;}
.modal-actions .btn{flex:1 1 0;min-width:0;}
.target-inputs{display:flex;gap:10px;margin-top:12px;}
.target-field{flex:1 1 0;min-width:0;}
.target-field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;}
.target-field .modal-input{text-align:center;}
.preview-title{margin-bottom:12px;}
.preview-scroll{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#F5F7FA;border-radius:12px;padding:8px;}
.card-preview{width:100%;}
#card-canvas,.card-image{width:100%;height:auto;display:block;border-radius:8px;}
.card-hint{font-size:14px;color:var(--muted);text-align:center;margin-top:10px;}
/* ========== 状态条提示行（杂事已记录） ========== */
#status-bar{flex-wrap:wrap;}
.status-notice{flex:0 0 100%;font-size:12px;color:var(--muted);font-weight:400;line-height:1.3;padding-bottom:2px;}

/* ========== 总览「其中杂事」小灰字 ========== */
.ov-chore{font-size:13px;color:var(--muted);margin-top:8px;}

/* ========== 记录列表：备注 / 来源 / 折叠 ========== */
.rec-from{flex:0 0 auto;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#5B76A8;background:#EEF4FF;border-radius:6px;padding:1px 6px;}
.rec-note{display:inline-block;max-width:100%;font-size:12px;color:#8A94A6;background:#F2F5FA;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;overflow-wrap:anywhere;}
.rec-note-hint{color:var(--blue);margin-left:2px;white-space:nowrap;}
.record-row.rec-expandable{cursor:pointer;}

/* ========== 中断原因底部面板 ========== */
#sheet-root{position:fixed;inset:0;z-index:120;}
.sheet-backdrop{position:absolute;inset:0;background:rgba(20,35,60,.42);}
.sheet-panel{
  position:absolute;left:0;right:0;bottom:0;z-index:1;
  max-width:480px;margin:0 auto;
  background:#fff;border-radius:18px 18px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -12px 40px rgba(20,40,80,.22);
  animation:sheet-up .22s ease-out;
  will-change:transform;
}
@keyframes sheet-up{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:#D8DFEA;margin:4px auto 12px;touch-action:none;}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:12px;}
.sheet-reasons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px;}
.sheet-reason{
  display:flex;align-items:center;justify-content:center;text-align:center;
  min-height:44px;padding:6px 2px;border-radius:10px;
  background:#F2F6FD;border:1px solid #E1EAF7;color:#3A4A66;
  font-size:12px;line-height:1.25;word-break:break-all;
}
.sheet-reason.active{background:#E3EDFF;border-color:var(--blue);color:var(--blue);}
.sheet-input{width:100%;height:46px;padding:0 12px;border:1px solid #DCE5F2;border-radius:12px;background:#F9FBFF;color:var(--text);font-size:16px;outline:none;}
.sheet-input:focus{border-color:var(--blue);background:#fff;}
.sheet-actions{display:flex;gap:10px;margin-top:14px;}
.sheet-actions .btn{flex:1 1 0;min-width:0;padding:0 8px;font-size:14px;}
@media (max-width:360px){.sheet-reason{font-size:11px;padding:6px 1px;}.sheet-actions .btn{font-size:13px;}}
/* ========== 模块顺序调整：记录列表展开/收起 + 导出记录按钮 ========== */
.records-toggle{
  display:block;width:100%;margin-top:10px;padding:10px 0 2px;
  border-top:1px solid var(--line);background:none;
  font-size:14px;color:var(--blue);font-weight:600;text-align:center;
}
.records-toggle:active{opacity:.65;}
.export-btn{
  width:100%;height:48px;border:1px solid #C9DBFB;border-radius:14px;
  background:#fff;color:var(--blue);font-size:15px;font-weight:700;
  box-shadow:0 2px 10px rgba(30,60,110,.05);margin-top:10px;
}
.export-btn:active{transform:scale(.99);background:#F2F7FF;}
/* ========== 版式重构：单行项目行 / 前置开始胶囊 / 活动卡 / 低频按钮 ========== */
/* 开始胶囊：54×28px，紧跟项目名 8px，放进 .proj-top 行内 */
.proj-actions{flex:0 0 auto;display:inline-flex;align-items:center;}
.proj-actions .btn{
  width:54px;min-width:54px;height:28px;min-height:28px;
  padding:0;border-radius:8px;font-size:12px;font-weight:600;box-shadow:none;
}
.proj-actions .btn-primary{background:var(--blue);color:#fff;box-shadow:none;}
/* 菜单相对单行卡片定位 */
.proj-menu{top:44px;}
/* 状态条：方案 A —— 计时中升级为高亮活动卡 */
#status-bar.status-active{
  flex-direction:column;align-items:stretch;gap:8px;
  padding:10px 14px;min-height:0;
  background:#EAF2FF;border:1px solid #CFE2FF;
  box-shadow:0 4px 14px rgba(47,125,246,.10);
  -webkit-backdrop-filter:none;backdrop-filter:none;
}
.status-line1{display:flex;align-items:center;gap:8px;min-width:0;}
.status-name{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700;color:var(--text);}
.status-tag{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--blue);white-space:nowrap;}
.status-elapsed{margin-left:auto;flex:0 0 auto;font-size:13px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;}
.status-line2{display:flex;justify-content:flex-end;gap:10px;}
.status-btn{height:36px;min-height:36px;min-width:72px;padding:0 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:none;}
.status-btn.btn-primary{background:var(--blue);color:#fff;box-shadow:none;}
.status-btn.btn-outline{background:#fff;color:var(--blue);border:1px solid var(--blue);}
/* 区块标题行右侧轻量文字入口 */
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.section-head .section-title{margin-bottom:0;}
.head-action{flex:0 0 auto;padding:4px 0 4px 8px;font-size:13px;font-weight:600;color:var(--blue);background:none;border:0;}
.head-action:active{opacity:.6;}
/* 空状态：提示 + 可点动作 */
.empty-action{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;padding:8px 16px;border-radius:10px;background:var(--blue);color:#fff;font-size:14px;font-weight:600;}
.empty-hint{display:block;font-size:12px;color:var(--muted);margin-top:4px;}
/* 概览「其中杂事」小字（覆盖早期 13px 定义） */
.ov-chore{font-size:12px;color:var(--muted);margin-top:2px;}
/* 所有时长数字等宽 */
.ov-numbers,#stat-total,#stat-target,.proj-today,.proj-today-main,.rec-time,#status-elapsed{font-variant-numeric:tabular-nums;}
</style>

<script data-page-node-id="ot7o1KJgy8KCToEdkQsZtu" data-pnid-children="ncJ5n4glj0Dr4r5Sitx4V6">
/* =====================================================================
 * 我的时间记录 · 单文件版
 * 分段：常量与工具函数 / 状态与存储 / 跨天规范化 / 渲染 /
 *       事件与业务流程 / 弹层与 toast / 今日记录卡 canvas / 初始化
 * 数据口径：一切以「段」为单位，一段 = {id,start,end,endType}；
 *          时长统一走 minutesOfSegment，所有显示同源。
 * ===================================================================== */

/* -------------------- 一、常量与工具函数（纯函数为主） -------------------- */

/** 项目标识色：固定 8 色，按 nextColorIndex 取模分配，删除不回收、不重排 */
var PALETTE = ["#5B8FF9", "#61DDAA", "#65789B", "#F6BD16", "#7262FD", "#78D3F8", "#F08BB4", "#FF9D4D"];
/** 系统项目「杂事」：固定 id、固定中性灰、不参与排序、永远固定在列表最底部 */
var CHORE_NAME = "杂事";
var CHORE_ID = "sys_chore";
var CHORE_COLOR = "#9CA3AF";
var STORAGE_KEY = "my-time-records:v1";
var FONT_STACK = '-apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif';
var WEEK_NAMES = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
var PENCIL_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';

/** HTML 转义：所有用户输入进入 innerHTML 前必须经过这里，防 XSS 与布局崩坏 */
function esc(value) {
  return String(value === null || value === undefined ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function pad2(n) { return String(n).padStart(2, "0"); }

/** 本地时间 YYYY-MM-DD */
function dayKeyOf(ts) {
  var d = new Date(ts);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

/** dayKey → 当天本地零点的时间戳 */
function midnightOf(dayKey) {
  var p = String(dayKey).split("-");
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getTime();
}

/** ts 所属日期之后下一个本地零点（用 Date 构造，自动处理夏令时/月/年边界） */
function nextMidnightOf(ts) {
  var d = new Date(ts);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
}

function isValidDayKey(k) {
  if (typeof k !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(k)) return false;
  var ms = midnightOf(k);
  return Number.isFinite(ms) && dayKeyOf(ms) === k;
}

/** 每段时长口径：不足 1 分钟按 1 分钟，超过 1 分钟向上取整到整分钟 */
function minutesOfSegment(seg, now) {
  var endOrNow = (seg.end === null || seg.end === undefined) ? now : seg.end;
  var diff = Math.max(0, endOrNow - seg.start);
  return Math.max(1, Math.ceil(diff / 60000));
}

/** 分钟数 → HH:MM */
function formatMinutes(mins) {
  var m = Math.max(0, Math.floor(Number(mins) || 0));
  return pad2(Math.floor(m / 60)) + ":" + pad2(m % 60);
}

/** 时间戳 → HH:MM（本地时间） */
function formatTime(ts) {
  var d = new Date(ts);
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

/** 目标分钟数 → 中文可读文案 */
function formatTarget(mins) {
  var h = Math.floor(mins / 60), m = mins % 60;
  if (h > 0 && m > 0) return h + " 小时 " + m + " 分钟";
  if (h > 0) return h + " 小时";
  return m + " 分钟";
}

function colorOf(colorIndex) {
  var n = Math.floor(Number(colorIndex) || 0);
  var i = ((n % PALETTE.length) + PALETTE.length) % PALETTE.length;
  return PALETTE[i];
}

function toNonNegInt(v, fallback) {
  if (typeof v === "number" && Number.isFinite(v) && Number.isInteger(v) && v >= 0) return v;
  return fallback;
}

function parseNonNegInt(raw) {
  var t = String(raw === null || raw === undefined ? "" : raw).trim();
  if (t === "") return 0;
  if (!/^\d+$/.test(t)) return null;
  var n = Number(t);
  return Number.isFinite(n) ? n : null;
}

/**
 * 按本地零点切分 [start, end] 一段时间（纯函数）。
 * 返回 [{dayKey,start,end,endType}]，按时间升序；
 * 零点之前的所有段 endType = "finished"（系统切分），
 * 最后一段 endType = finalEndType（用户实际操作类型）。
 * 同一天内不切分：只返回一段。
 */
function splitSegmentByMidnight(start, end, finalEndType) {
  var parts = [];
  if (!(end > start)) {
    return [{ dayKey: dayKeyOf(start), start: start, end: end, endType: finalEndType }];
  }
  var cursor = start;
  var guard = 0;
  while (guard++ < 5000) {
    var boundary = nextMidnightOf(cursor);
    if (end <= boundary) {
      parts.push({ dayKey: dayKeyOf(cursor), start: cursor, end: end, endType: finalEndType });
      break;
    }
    parts.push({ dayKey: dayKeyOf(cursor), start: cursor, end: boundary, endType: "finished" });
    cursor = boundary;
  }
  return parts;
}

/**
 * 计算某一天的统计（纯函数）。
 * perProject：今天有段的项目（按 state.projects 顺序）；
 * records：今天所有段（含进行中），按 start 从新到旧；
 * totalMinutes / targetMinutes / hasTarget / ratio / percent 均为全局同源口径。
 */
function computeDayStats(state, dayKey, now) {
  var bucket = (state && state.days && state.days[dayKey]) || {};
  var projects = (state && Array.isArray(state.projects)) ? state.projects : [];
  var perProject = [];
  var records = [];
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    var segs = Array.isArray(bucket[p.id]) ? bucket[p.id] : [];
    if (segs.length === 0) continue;
    var sum = 0;
    for (var j = 0; j < segs.length; j++) {
      var seg = segs[j];
      var m = minutesOfSegment(seg, now);
      sum += m;
      records.push({ segment: seg, project: p, minutes: m, colorIndex: p.colorIndex, projectName: p.name, colorHex: projectColor(p) });
    }
    perProject.push({ projectId: p.id, name: p.name, colorIndex: p.colorIndex, minutes: sum,
      colorHex: projectColor(p), isChore: isChoreProject(p) });
  }
  records.sort(function (a, b) { return b.segment.start - a.segment.start; });
  var totalMinutes = 0, choreMinutes = 0;
  for (var a = 0; a < perProject.length; a++) {
    totalMinutes += perProject[a].minutes;
    if (perProject[a].isChore) choreMinutes += perProject[a].minutes;
  }

  /* 完成度口径：只统计「设置了每日目标」的非杂事项目；
     分子 = 这些项目今天已投入之和，分母 = 它们的目标时长之和。 */
  var targetMinutes = 0, hasTarget = false, goalMinutes = 0;
  for (var k = 0; k < projects.length; k++) {
    var pk = projects[k];
    if (isChoreProject(pk)) continue;
    var tm = pk.targetMinutes;
    if (typeof tm === "number" && Number.isFinite(tm) && tm > 0) {
      targetMinutes += tm;
      hasTarget = true;
      for (var g = 0; g < perProject.length; g++) {
        if (perProject[g].projectId === pk.id) { goalMinutes += perProject[g].minutes; break; }
      }
    }
  }
  var ratio = (hasTarget && targetMinutes > 0) ? (goalMinutes / targetMinutes) : 0;
  /* 保留一位小数：16.7% 这类分数百分比可正确显示，整数仍显示 50%（不出现 50.0） */
  var percent = (hasTarget && targetMinutes > 0) ? Math.round(goalMinutes / targetMinutes * 1000) / 10 : 0;
  return {
    dayKey: dayKey, now: now, perProject: perProject, records: records,
    totalMinutes: totalMinutes, targetMinutes: targetMinutes,
    choreMinutes: choreMinutes, goalMinutes: goalMinutes,
    hasTarget: hasTarget, ratio: ratio, percent: percent
  };
}

/* -------------------- 二、状态与存储 -------------------- */

function defaultState(now) {
  return {
    schemaVersion: 1,
    nickname: "时间记录员",
    nextColorIndex: 0,
    nextId: 1,
    currentDayKey: dayKeyOf(now),
    projects: [],
    days: {}
  };
}

/** 模块级唯一状态；localStorage 不可用时自动降级为内存态 */
var state = defaultState(Date.now());

function newId(prefix) {
  var n = (typeof state.nextId === "number" && Number.isFinite(state.nextId) && state.nextId > 0) ? state.nextId : 1;
  state.nextId = n + 1;
  return prefix + "_" + n;
}

function sanitizeSegment(raw, fallbackIndex) {
  if (!raw || typeof raw !== "object") return null;
  var start = raw.start;
  if (typeof start !== "number" || !Number.isFinite(start) || start <= 0) return null;
  var id = (typeof raw.id === "string" && raw.id) ? raw.id : ("s_" + Math.floor(start) + "_" + fallbackIndex);
  /* 兼容旧记录：note / sourceProject 缺失一律按空值处理，不改变时长与合计 */
  var note = (typeof raw.note === "string") ? Array.from(raw.note).slice(0, 50).join("") : "";
  var sourceProject = (typeof raw.sourceProject === "string") ? Array.from(raw.sourceProject).slice(0, 10).join("") : "";
  var endType = raw.endType;
  if (endType === "running") {
    return { id: id, start: start, end: null, endType: "running", note: note, sourceProject: sourceProject };
  }
  if (endType === "interrupted" || endType === "finished") {
    if (typeof raw.end !== "number" || !Number.isFinite(raw.end) || raw.end < start) return null;
    return { id: id, start: start, end: raw.end, endType: endType, note: note, sourceProject: sourceProject };
  }
  return null;
}

/** 轻量校验 + 迁移：字段缺失补默认值、非法值丢弃；schemaVersion 预留升级位 */
function sanitizeState(obj) {
  var now = Date.now();
  var base = defaultState(now);
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) return base;
  base.schemaVersion = 1; /* 目前仅支持 v1，后续可在此分支升级旧结构 */
  if (typeof obj.nickname === "string" && obj.nickname.trim().length > 0) {
    base.nickname = Array.from(obj.nickname.trim()).slice(0, 12).join("");
  }
  base.nextColorIndex = toNonNegInt(obj.nextColorIndex, 0);
  base.nextId = Math.max(1, toNonNegInt(obj.nextId, 1));
  base.currentDayKey = isValidDayKey(obj.currentDayKey) ? obj.currentDayKey : dayKeyOf(now);
  base.projects = [];
  base.days = {};
  var seenPid = {};
  var maxIdNumber = 0;

  function trackId(idStr) {
    var m = /(\d+)$/.exec(String(idStr));
    if (m) maxIdNumber = Math.max(maxIdNumber, Number(m[1]));
  }

  if (Array.isArray(obj.projects)) {
    for (var i = 0; i < obj.projects.length; i++) {
      var raw = obj.projects[i];
      if (!raw || typeof raw !== "object") continue;
      var id = (typeof raw.id === "string" && raw.id) ? raw.id : null;
      var name = (typeof raw.name === "string") ? raw.name.trim() : "";
      if (!id || !name || seenPid[id]) continue;
      seenPid[id] = true;
      var ci = toNonNegInt(raw.colorIndex, 0) % PALETTE.length;
      var tm = null;
      if (typeof raw.targetMinutes === "number" && Number.isFinite(raw.targetMinutes) && raw.targetMinutes > 0) {
        tm = Math.floor(raw.targetMinutes);
      }
      var createdAt = (typeof raw.createdAt === "number" && Number.isFinite(raw.createdAt)) ? raw.createdAt : now;
      /* 保留排序字段：缺失或非法时记为 undefined，交给一次性迁移重编号 */
      var si = (typeof raw.sortIndex === "number" && Number.isFinite(raw.sortIndex)) ? raw.sortIndex : undefined;
      var proj = {
        id: id, name: Array.from(name).slice(0, 10).join(""),
        colorIndex: ci, targetMinutes: tm, createdAt: createdAt, sortIndex: si
      };
      /* 系统项目「杂事」：读取旧数据时也规整为固定名称 / 灰色 / 无目标，并打上系统标记 */
      var isChore = (raw.isSystem === true || raw.isSystemChore === true || raw.system === true ||
        raw.kind === "system" || id === CHORE_ID || String(name).trim() === CHORE_NAME);
      if (isChore) { proj.name = CHORE_NAME; proj.targetMinutes = null; proj.isSystem = true; }
      base.projects.push(proj);
      trackId(id);
    }
  }
  if (obj.days && typeof obj.days === "object" && !Array.isArray(obj.days)) {
    var dayKeys = Object.keys(obj.days);
    for (var d = 0; d < dayKeys.length; d++) {
      var dk = dayKeys[d];
      if (!isValidDayKey(dk)) continue;
      var bucket = obj.days[dk];
      if (!bucket || typeof bucket !== "object" || Array.isArray(bucket)) continue;
      var pids = Object.keys(bucket);
      for (var pi = 0; pi < pids.length; pi++) {
        var pid = pids[pi];
        if (!seenPid[pid]) continue; /* 丢弃已删除项目的孤儿段 */
        var arr = bucket[pid];
        if (!Array.isArray(arr)) continue;
        var clean = [];
        for (var s = 0; s < arr.length; s++) {
          var seg = sanitizeSegment(arr[s], s);
          if (!seg) continue;
          clean.push(seg);
          trackId(seg.id);
        }
        if (clean.length > 0) {
          if (!base.days[dk]) base.days[dk] = {};
          base.days[dk][pid] = clean;
        }
      }
    }
  }
  base.nextId = Math.max(base.nextId, maxIdNumber + 1);
  return base;
}

/* -------------------- 排序 / 旧数据迁移 / 新建置顶高亮（增量新增） -------------------- */

/** 取排序值；缺失或非法按 0 处理，保证比较不产生 NaN、不报错、不丢项目 */
function sortIndexOf(p) {
  var v = p && p.sortIndex;
  return (typeof v === "number" && Number.isFinite(v)) ? v : 0;
}

/** 新项目排序值：取当前时间戳，并严格大于现有最大值，保证一定置顶 */
function nextSortIndex() {
  var max = 0;
  var ps = Array.isArray(state.projects) ? state.projects : [];
  for (var i = 0; i < ps.length; i++) {
    var v = ps[i] && ps[i].sortIndex;
    if (typeof v === "number" && Number.isFinite(v) && v > max) max = v;
  }
  var ts = Date.now();
  return ts > max ? ts : Math.floor(max) + 1;
}

/**
 * 兼容旧数据：仅当存在缺 sortIndex 的项目时，按当前数组顺序（= 升级前显示顺序）
 * 整体重新编号，第一个最大、依次递减 100；返回是否需要写回 localStorage。
 * 升级后所有项目都有 sortIndex，之后打开直接读取，不再重新推算。
 */
function ensureSortIndexes(st) {
  var ps = (st && Array.isArray(st.projects)) ? st.projects : [];
  var need = false;
  for (var i = 0; i < ps.length; i++) {
    var v = ps[i] && ps[i].sortIndex;
    if (typeof v !== "number" || !Number.isFinite(v)) { need = true; break; }
  }
  if (!need) return false;
  var n = ps.length;
  for (var j = 0; j < n; j++) ps[j].sortIndex = (n - j) * 100;
  return true;
}

/** 系统项目「杂事」：不参与排序，永远固定在列表最底部 */
function isChoreProject(p) {
  if (!p) return false;
  if (p.isSystem === true || p.system === true || p.kind === "system") return true;
  return String(p.name === null || p.name === undefined ? "" : p.name).trim() === CHORE_NAME;
}

/** 列表显示顺序：普通项目按 sortIndex 降序；重复值按原数组先后（索引小者靠前）；
 *  杂事固定追加到末尾。返回副本，不改动 state.projects 原数组。 */
function orderedProjectsForDisplay() {
  var ps = Array.isArray(state.projects) ? state.projects : [];
  var normal = [], chore = [];
  for (var i = 0; i < ps.length; i++) {
    var entry = { p: ps[i], idx: i };
    if (isChoreProject(ps[i])) chore.push(entry);
    else normal.push(entry);
  }
  normal.sort(function (a, b) {
    var d = sortIndexOf(b.p) - sortIndexOf(a.p);
    return d !== 0 ? d : (a.idx - b.idx);
  });
  var out = [];
  for (var k = 0; k < normal.length; k++) out.push(normal[k].p);
  for (var c = 0; c < chore.length; c++) out.push(chore[c].p);
  return out;
}

/* 新建后置顶可见：记录待高亮项目 id，render 重建 DOM 后仍能重新触发一次 */
var revealPid = null, revealTimer = null, revealScrolled = false;
function markReveal(pid) {
  revealPid = pid;
  revealScrolled = false;
  if (revealTimer !== null) { clearTimeout(revealTimer); revealTimer = null; }
  revealTimer = setTimeout(function () { revealPid = null; revealTimer = null; }, 1300);
}
/** 每次 render 末尾调用：给新卡片一次浅蓝高亮，并（仅首次）滚动到它 */
function applyReveal() {
  if (!revealPid) return;
  var host = document.getElementById("project-list");
  if (!host) return;
  var cards = host.querySelectorAll(".project-card");
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    if (card.getAttribute("data-project-id") !== revealPid) continue;
    card.classList.add("flash-new");
    if (!revealScrolled) {
      revealScrolled = true;
      if (typeof card.scrollIntoView === "function") {
        try { card.scrollIntoView({ behavior: "smooth", block: "center" }); }
        catch (e) { try { card.scrollIntoView(); } catch (e2) {} }
      }
    }
    break;
  }
}

/* -------------------- 系统项目「杂事」/ 备注 / 中断面板（增量新增） -------------------- */

/** 是否系统项目：显式标记或固定 id 判定，用于「不可删/改名/设目标」的权限判断 */
function isSystemChore(p) {
  if (!p) return false;
  return p.isSystem === true || p.isSystemChore === true || p.system === true || p.kind === "system" || p.id === CHORE_ID;
}

/** 项目显示色：系统「杂事」固定中性灰，其余按 colorIndex 取调色板 */
function projectColor(p) {
  if (p && (isSystemChore(p) || isChoreProject(p))) return CHORE_COLOR;
  return colorOf(p && p.colorIndex);
}

function getChoreProject() {
  var ps = Array.isArray(state.projects) ? state.projects : [];
  for (var i = 0; i < ps.length; i++) if (isSystemChore(ps[i])) return ps[i];
  for (var j = 0; j < ps.length; j++) if (isChoreProject(ps[j])) return ps[j];
  return null;
}

/** 把 fromPid 的所有记录段并入 toPid，规整杂事项目时不丢记录 */
function mergeChoreRecords(st, fromPid, toPid) {
  var days = st.days || {};
  var keys = Object.keys(days);
  for (var i = 0; i < keys.length; i++) {
    var b = days[keys[i]];
    if (!b || !Array.isArray(b[fromPid])) continue;
    if (!Array.isArray(b[toPid])) b[toPid] = [];
    for (var j = 0; j < b[fromPid].length; j++) b[toPid].push(b[fromPid][j]);
    delete b[fromPid];
  }
}

/**
 * 保证系统项目「杂事」唯一存在（首次打开 / 旧数据都自动补齐），并规整属性：
 * 固定中性灰、无每日目标、isSystem 标记。已有同名普通项目原地升级（不改 id，记录不丢）。
 * 返回是否发生变更，供 init 决定是否写回 localStorage。
 */
function ensureChoreProject(st) {
  var ps = Array.isArray(st.projects) ? st.projects : (st.projects = []);
  var chore = null, extras = [];
  for (var i = 0; i < ps.length; i++) {
    var p = ps[i];
    if (!p) continue;
    var byName = String(p.name === null || p.name === undefined ? "" : p.name).trim() === CHORE_NAME;
    if (isSystemChore(p) || byName) { if (!chore) chore = p; else extras.push(p); }
  }
  var changed = false;
  if (!chore) {
    chore = { id: CHORE_ID, name: CHORE_NAME, colorIndex: 0,
      targetMinutes: null, createdAt: Date.now(), sortIndex: 0, isSystem: true };
    ps.push(chore);
    changed = true;
  }
  function force(k, v) { if (chore[k] !== v) { chore[k] = v; changed = true; } }
  force("isSystem", true);
  force("name", CHORE_NAME);
  force("targetMinutes", null);
  if (typeof chore.sortIndex !== "number" || !Number.isFinite(chore.sortIndex)) { chore.sortIndex = 0; changed = true; }
  if (extras.length > 0) {
    for (var e = 0; e < extras.length; e++) {
      if (extras[e].id !== chore.id) mergeChoreRecords(st, extras[e].id, chore.id);
    }
    st.projects = ps.filter(function (x) { return x === chore || extras.indexOf(x) < 0; });
    changed = true;
  }
  return changed;
}

/* ---- 备注折叠：>8 字折叠，点整行展开/收起 ---- */

function noteChars(text) { return Array.from(String(text === null || text === undefined ? "" : text)); }

/* ---- 中断原因底部面板 ---- */
var CHORE_REASONS = ["喝咖啡休息", "接电话", "临时被叫走", "处理杂事"];
var sheetState = null;

function closeSheet() {
  sheetState = null;
  var root = document.getElementById("sheet-root");
  if (root && root.parentNode) root.parentNode.removeChild(root);
}

function readSheetNote() {
  var input = document.getElementById("sheet-note");
  if (!input) return "";
  return noteChars(input.value).slice(0, 20).join("").trim();
}

function toggleSheetReason(el) {
  if (!sheetState) return;
  var r = el.getAttribute("data-reason") || "";
  var input = document.getElementById("sheet-note");
  var all = document.querySelectorAll(".sheet-reason");
  for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
  if (sheetState.selected === r) {
    sheetState.selected = "";
    if (input) input.value = "";
  } else {
    sheetState.selected = r;
    if (input) input.value = r;
    el.classList.add("active");
  }
}

function onSheetClick(e) {
  var t = (e.target && typeof e.target.closest === "function") ? e.target : null;
  if (!t) return;
  var el = t.closest("[data-sheet-action]");
  if (!el) return;
  var act = el.getAttribute("data-sheet-action");
  if (act === "reason") { toggleSheetReason(el); return; }
  var pid = sheetState ? sheetState.pid : null;
  var note = (act === "only" || act === "chore") ? readSheetNote() : "";
  closeSheet();
  if (!pid) return;
  if (act === "chore") doInterrupt(pid, "chore", note);
  else if (act === "only") doInterrupt(pid, "only", note);
  else if (act === "backdrop") doInterrupt(pid, "only", "");
}

function bindSheetSwipe(panel) {
  if (!panel) return;
  var startY = null, dy = 0;
  panel.addEventListener("touchstart", function (e) {
    if (e.touches && e.touches.length === 1) { startY = e.touches[0].clientY; dy = 0; }
  }, { passive: true });
  panel.addEventListener("touchmove", function (e) {
    if (startY === null || !e.touches || !e.touches.length) return;
    dy = e.touches[0].clientY - startY;
    if (dy > 0) panel.style.transform = "translateY(" + dy + "px)";
  }, { passive: true });
  panel.addEventListener("touchend", function () {
    if (startY === null) return;
    var shouldClose = dy > 60;
    startY = null; dy = 0;
    panel.style.transform = "";
    if (shouldClose) {
      var pid = sheetState ? sheetState.pid : null;
      closeSheet();
      if (pid) doInterrupt(pid, "only", "");
    }
  }, { passive: true });
}

function openInterruptSheet(pid) {

      '<div class="sheet-handle"></div>' +

      '<div class="sheet-reasons">' + reasons + '</div>' +
      '<input id="sheet-note" class="sheet-input" type="text" maxlength="20" placeholder="补充说明" autocomplete="off">' +
      '<div class="sheet-actions">' +
        '<button class="btn btn-primary" data-sheet-action="chore">中断并开始记杂事</button>' +
        '<button class="btn btn-outline" data-sheet-action="only">只中断</button>' +

/** 立刻开始一段「杂事」：承接来源项目 + 自动备注 */
function startChoreSegment(now, sourceName, extraNote) {
  var chore = getChoreProject();
  if (!chore) return;
  var note = "因《" + sourceName + "》中断" + (extraNote ? " " + extraNote : "");
  var b = ensureBucket(state.days, dayKeyOf(now), chore.id);
  b.push({
    id: newId("s"), start: now, end: null, endType: "running",
    note: noteChars(note).slice(0, 50).join(""),
    sourceProject: noteChars(sourceName).slice(0, 10).join("")
  });
  state.currentDayKey = dayKeyOf(now);
}

/**
 * 执行中断：闭合当前项目进行中段（interrupted）并写入备注；
 * mode=chore 时紧接着开始一段杂事，sourceProject 记为来源项目名。
 */
function doInterrupt(pid, mode, noteText) {
  var now = Date.now();
  syncRolloverForNow(now);
  var p = getProject(pid);
  var pname = p ? p.name : "";
  var note = noteChars(noteText).slice(0, 50).join("");
  var running = findRunningSegment(state);
  if (running && running.projectId === pid) {
    closeRunningAt(running, now, "interrupted", { note: note });
  }
  if (mode === "chore") {
    var chore = getChoreProject();
    var still = findRunningSegment(state);
    if (chore && (!still || still.projectId !== chore.id)) startChoreSegment(now, pname, note);
  }
  state.currentDayKey = dayKeyOf(now);
  save();
  render();
}

/** 「清空今日记录」：只删除系统杂事今天的记录段 */
function clearChoreToday() {
  var chore = getChoreProject();
  if (!chore) return;
  var now = Date.now();
  syncRolloverForNow(now);
  var dayKey = dayKeyOf(now);
  if (state.days && state.days[dayKey]) {
    delete state.days[dayKey][chore.id];
    if (Object.keys(state.days[dayKey]).length === 0) delete state.days[dayKey];
  }
  state.currentDayKey = dayKey;
  save();
  render();
  showToast("已清空「杂事」今日记录");
}

/* -------------------- 模块顺序 / 记录列表折叠 / 导出 / 滚动（增量新增） -------------------- */

/** 「今日记录」展开状态：纯 UI 状态，不写入 state / localStorage，展开收起不改任何数据 */
var RECORDS_PAGE_SIZE = 5;
var recordsExpanded = false;

function toggleRecordsExpanded() {
  recordsExpanded = !recordsExpanded;
  /* 只重绘记录列表这一块，不整页 render，其他模块位置完全不动 */
  var now = Date.now();
  renderRecordList(computeDayStats(state, dayKeyOf(now), now));
}

/** 导出记录：只读现有 state 生成 CSV 下载，不改动任何数据与统计口径 */
function exportRecords() {
  var now = Date.now();
  var days = (state && state.days) || {};
  var dayKeys = Object.keys(days).sort();
  var rows = [];
  for (var d = 0; d < dayKeys.length; d++) {
    var dk = dayKeys[d];
    var bucket = days[dk] || {};
    var pids = Object.keys(bucket);
    for (var pi = 0; pi < pids.length; pi++) {
      var pid = pids[pi];
      var p = getProject(pid);
      var pname = p ? p.name : pid;
      var arr = Array.isArray(bucket[pid]) ? bucket[pid] : [];
      for (var j = 0; j < arr.length; j++) {
        var seg = arr[j];
        if (!seg) continue;
        var running = (seg.endType === "running" || seg.end === null || seg.end === undefined);
        var status = running ? "计时中" : (seg.endType === "interrupted" ? "中断" : "完成");
        rows.push([
          dk, pname,
          formatTime(seg.start),
          running ? "进行中" : formatTime(seg.end),
          String(minutesOfSegment(seg, now)),
          status,
          (typeof seg.note === "string") ? seg.note : "",
          (typeof seg.sourceProject === "string") ? seg.sourceProject : ""
        ]);
      }
    }
  }
  if (rows.length === 0) { showToast("暂无记录可导出"); return; }
  var lines = [["日期", "项目", "开始", "结束", "时长(分钟)", "状态", "备注", "来源项目"]];
  for (var r = 0; r < rows.length; r++) lines.push(rows[r]);
  var csv = "";
  for (var i = 0; i < lines.length; i++) {
    var cells = [];
    for (var c = 0; c < lines[i].length; c++) {
      var v = lines[i][c];
      cells.push('"' + String(v === null || v === undefined ? "" : v).replace(/"/g, '""') + '"');
    }
    csv += (i > 0 ? "\r\n" : "") + cells.join(",");
  }
  try {
    var blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "我的时间记录-" + dayKeyOf(now) + ".csv";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 0);
    showToast("已导出 " + rows.length + " 条记录");
  } catch (e) {
    showToast("导出失败，请重试");
  }
}

function load() {
  var raw = null;
  try { raw = window.localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
  if (!raw) return defaultState(Date.now());
  var obj = null;
  try { obj = JSON.parse(raw); } catch (e) { return defaultState(Date.now()); }
  return sanitizeState(obj);
}

function save() {
  try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { /* file:// 下 localStorage 不可用：优雅降级为内存态，不白屏 */ }
}

function ensureBucket(days, dayKey, pid) {
  if (!days) { state.days = {}; days = state.days; } /* 防御：注入/损坏数据也能安全写入 */
  if (!days[dayKey]) days[dayKey] = {};
  if (!Array.isArray(days[dayKey][pid])) days[dayKey][pid] = [];
  return days[dayKey][pid];
}

function getProject(pid) {
  var ps = Array.isArray(state.projects) ? state.projects : [];
  for (var i = 0; i < ps.length; i++) if (ps[i].id === pid) return ps[i];
  return null;
}

function removeSegmentRaw(st, dayKey, pid, seg) {
  var bucket = st.days[dayKey];
  if (!bucket || !Array.isArray(bucket[pid])) return;
  var arr = bucket[pid];
  var idx = arr.indexOf(seg);
  if (idx >= 0) arr.splice(idx, 1);
  if (arr.length === 0) delete bucket[pid];
  if (Object.keys(bucket).length === 0) delete st.days[dayKey];
}

function findAllRunningSegments(st) {
  var out = [];
  var days = (st && st.days) || {};
  var dks = Object.keys(days);
  for (var d = 0; d < dks.length; d++) {
    var bucket = days[dks[d]] || {};
    var pids = Object.keys(bucket);
    for (var p = 0; p < pids.length; p++) {
      var arr = Array.isArray(bucket[pids[p]]) ? bucket[pids[p]] : [];
      for (var s = 0; s < arr.length; s++) {
        var seg = arr[s];
        if (seg && seg.endType === "running" && seg.end === null) {
          out.push({ dayKey: dks[d], projectId: pids[p], seg: seg });
        }
      }
    }
  }
  out.sort(function (a, b) { return b.seg.start - a.seg.start; });
  return out;
}

function findRunningSegment(st) {
  var all = findAllRunningSegments(st);
  return all.length > 0 ? all[0] : null;
}

/** 「上次中断」由数据推导：今天所有已闭合段中 end 最大者若 interrupted 则显示 */
function lastInterruptionFor(st, dayKey, pid) {
  var bucket = (st.days && st.days[dayKey]) || {};
  var arr = Array.isArray(bucket[pid]) ? bucket[pid] : [];
  var best = null;
  var bestIndex = -1;
  for (var i = 0; i < arr.length; i++) {
    var seg = arr[i];
    if (seg.end === null || seg.end === undefined || seg.endType === "running") continue;
    /* 主规则取 end 最大的已闭合段；当 end 相同（同一毫秒连续操作或测试注入）
       时依次用 start、数组顺序裁决，选中「最后一次闭合」产生的段，
       保证点「结束」或系统代关后灰字一定自然消失 */
    if (best === null ||
        seg.end > best.end ||
        (seg.end === best.end && seg.start > best.start) ||
        (seg.end === best.end && seg.start === best.start && i > bestIndex)) {
      best = seg;
      bestIndex = i;
    }
  }
  return (best && best.endType === "interrupted") ? best : null;
}

/* -------------------- 三、跨天规范化 -------------------- */

/**
 * 设计取舍（重要）：
 *  - 同一天内刷新/关页再开，进行中段保持原 start、end=null，绝不补写结束时间，
 *    也绝不拆成两段或复制出新段。加载时只做「读取 → 跨天规范化 → 渲染」。
 *  - 只有真正跨过零点（currentDayKey 变化）才按零点切分：零点前的部分闭合进
 *    各自旧日期（finished，系统切分），并在新日期创建 start=新零点、end=null 的
 *    running 段（零点后的部分算今天，因此状态条显示 00:00 开始是正确的）。
 *  - 跨多天时由 splitSegmentByMidnight 的循环逐个边界处理。
 * 只修改 state，返回是否有变化；save/render 由调用方统一执行一次。
 */
function normalizeDayRollover(newDayKey) {
  if (!isValidDayKey(newDayKey)) return false;
  var todayMidnight = midnightOf(newDayKey);
  var runnings = findAllRunningSegments(state);
  var changed = false;
  for (var i = 0; i < runnings.length; i++) {
    var r = runnings[i];
    if (r.seg.start >= todayMidnight) continue; /* 仍在同一天：保持原样，不拆分 */
    var parts = splitSegmentByMidnight(r.seg.start, todayMidnight, "finished");
    removeSegmentRaw(state, r.dayKey, r.projectId, r.seg);
    for (var j = 0; j < parts.length; j++) {
      var part = parts[j];
      var b = ensureBucket(state.days, part.dayKey, r.projectId);
      b.push({ id: newId("s"), start: part.start, end: part.end, endType: part.endType,
        note: r.seg.note || "", sourceProject: r.seg.sourceProject || "" });
    }
    var b2 = ensureBucket(state.days, newDayKey, r.projectId);
    b2.push({ id: newId("s"), start: todayMidnight, end: null, endType: "running",
      note: r.seg.note || "", sourceProject: r.seg.sourceProject || "" });
    changed = true;
  }
  state.currentDayKey = newDayKey;
  return changed;
}

/** 业务操作开头调用：若已跨天，先做数据规范化（不弹窗、不打扰） */
function syncRolloverForNow(now) {
  var k = dayKeyOf(now);
  if (state.currentDayKey !== k) normalizeDayRollover(k);
  else state.currentDayKey = k;
}

/** 30 秒轮询：只检测跨天，绝不刷新任何数字 */
function checkDayAndRefresh() {
  var k = dayKeyOf(Date.now());
  if (state.currentDayKey === k) return;
  normalizeDayRollover(k);
  save();
  render();
}

/**
 * 闭合一个进行中段。
 * 同一天内：原地写 end/endType，不拆分、不换 id；
 * 跨零点：按零点切分，零点前段 finished，最后一段保留操作类型，各段新生成 id。
 */
function closeRunningAt(running, endTs, endType, extra) {
  var extraNote = (extra && typeof extra.note === "string") ? extra.note : null;
  var parts = splitSegmentByMidnight(running.seg.start, endTs, endType);
  if (parts.length === 1 && parts[0].dayKey === running.dayKey) {
    running.seg.end = parts[0].end;
    running.seg.endType = parts[0].endType;
    if (extraNote !== null) running.seg.note = extraNote;
    if (typeof running.seg.note !== "string") running.seg.note = "";
    if (typeof running.seg.sourceProject !== "string") running.seg.sourceProject = "";
    return;
  }
  removeSegmentRaw(state, running.dayKey, running.projectId, running.seg);
  for (var i = 0; i < parts.length; i++) {
    var b = ensureBucket(state.days, parts[i].dayKey, running.projectId);
    b.push({ id: newId("s"), start: parts[i].start, end: parts[i].end, endType: parts[i].endType,
      note: (extraNote !== null ? extraNote : (running.seg.note || "")),
      sourceProject: running.seg.sourceProject || "" });
  }
}

function renderHeader() {
  document.getElementById("app-header").innerHTML =
    '<div class="avatar">时</div>' +

      '<span class="header-name-text">' + esc(state.nickname) + '</span>' +

    '</div></div>' +

/* 把分钟差格式化为「X 小时 Y 分」，仅用于概览剩余文案，不改判断分支 */
function remainingText(mins) {
  var h = Math.floor(mins / 60), m = mins % 60;
  return h > 0 ? (h + " 小时" + (m > 0 ? " " + m + " 分" : "")) : (m + " 分");
}

/* 1s 定时器：只更新状态条上的已计时数字，绝不调用 render()（避免打断菜单/弹层/输入焦点） */
function tickRunningElapsed() {
  var el = document.getElementById("status-elapsed");
  if (!el) return;
  var running = findRunningSegment(state);
  if (!running) return;
  el.textContent = "已计时 " + formatMinutes(minutesOfSegment(running.seg, Date.now()));
}

/** 状态条作为 #app 的直接子元素（包含块足够高，sticky 才能持续生效）；无计时完全不渲染 */
function renderStatusBar(running) {
  var old = document.getElementById("status-bar");
  if (old) old.remove();
  if (!running && !choreNoticeText) return;
  /* 方案 A：计时中升级为高亮活动卡；无计时仅剩提示时保持轻量文字条，不新增第二个状态条 */
  var html = '<div id="status-bar"' + (running ? ' class="status-active"' : '') + '>';
  if (running) {
    var p = getProject(running.projectId);
    if (p) {
      var id = esc(p.id);
      html += '<div class="status-line1">' +
          '<span class="status-dot" style="background:' + projectColor(p) + '"></span>' +
          '<span class="status-name">' + esc(p.name) + '</span>' +
          '<span class="status-tag">· 计时中</span>' +
          '<span class="status-elapsed" id="status-elapsed">已计时 ' + formatMinutes(minutesOfSegment(running.seg, Date.now())) + '</span>' +
        '</div>' +
        '<div class="status-line2">' +
          '<button class="btn btn-outline status-btn" data-action="interrupt" data-id="' + id + '">中断</button>' +
          '<button class="btn btn-primary status-btn" data-action="finish" data-id="' + id + '">结束</button>' +
        '</div>';
    }
  }
  if (choreNoticeText) html += '<span class="status-notice">' + esc(choreNoticeText) + '</span>';
  html += '</div>';
  document.getElementById("app-header").insertAdjacentHTML("afterend", html);
}

function renderOverview(stats) {
  /* 两边都为 0（今日合计 0 分钟、完成度 0%）时整块隐藏，下方按钮自然上移、不留空洞 */
  var ovCard = document.getElementById("overview-card");
  if (ovCard) ovCard.style.display = (stats.totalMinutes === 0 && stats.percent === 0) ? "none" : "";
  document.getElementById("stat-total").textContent = formatMinutes(stats.totalMinutes);
  document.getElementById("stat-target").textContent = stats.hasTarget ? "目标 " + formatMinutes(stats.targetMinutes) : "未设置目标";
  document.getElementById("stat-percent-text").textContent = "完成 " + stats.percent + "%";

  /* 沿用原有三个判断分支（无目标 / 已完成 / 已超出），仅把「N 分钟」改成「X 小时 Y 分」 */
  var remaining;
  if (!stats.hasTarget) {
    remaining = "设置目标后查看完成情况";
  } else {
    var diff = stats.targetMinutes - stats.goalMinutes;
    if (diff > 0) remaining = "还差 " + remainingText(diff);
    else if (diff === 0) remaining = "已完成目标";
    else remaining = "已超出 " + remainingText(-diff);
  }
  document.getElementById("stat-remaining").textContent = remaining;
  /* 其中杂事 XX 分钟：没有杂事记录时不显示 */
  var choreLine = document.getElementById("stat-chore-line");
  if (choreLine) {
    if (stats.choreMinutes > 0) {
      choreLine.textContent = "其中杂事 " + stats.choreMinutes + " 分钟";
      choreLine.style.display = "";
    } else {
      choreLine.textContent = "";
      choreLine.style.display = "none";
    }
  }
  /* 8px 细进度条：宽度 = min(ratio,1)*100%；超额按满格显示，百分比数字照实（如 120%） */
  var fill = document.getElementById("stat-progress-fill");
  if (fill) fill.style.width = (Math.min(Math.max(0, stats.ratio), 1) * 100) + "%";
}

/* 项目行内只放「开始 / 继续」小胶囊；计时中的「中断 / 结束」上浮到状态条活动卡（方案 A） */
function actionsHTML(pid, isRunning, hasSegments) {
  if (isRunning) return "";
  return '<button class="btn btn-primary" data-action="start" data-id="' + esc(pid) + '">' +
    (hasSegments ? "继续" : "开始") + '</button>';
}

function renderProjectList(stats, running, dayKey) {
  var host = document.getElementById("project-list");
  var projects = orderedProjectsForDisplay();
  if (projects.length === 0) {
    host.innerHTML = '<div class="empty-block">还没有项目' +
      '<span class="empty-hint">先建一个项目，就能开始记录时间了</span>' +
      '<button class="empty-action" data-action="add-project">＋ 新建项目</button></div>';
    return;
  }
  var bucket = (state.days && state.days[dayKey]) || {};
  var minutesByPid = {};
  for (var m = 0; m < stats.perProject.length; m++) minutesByPid[stats.perProject[m].projectId] = stats.perProject[m].minutes;

  /* 所有项目（含系统「杂事」）统一单行：色条 → 名称 → 开始胶囊 → 弹性空白 → 今日时长 → ⋯ */
  var html = "";
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    var segs = Array.isArray(bucket[p.id]) ? bucket[p.id] : [];
    var hasSegments = segs.length > 0;
    var isRunning = !!running && running.projectId === p.id;
    var lastInt = lastInterruptionFor(state, dayKey, p.id);
    var pid = esc(p.id);
    html += '<div class="project-card" data-project-id="' + pid + '" style="--accent:' + projectColor(p) + '">' +
      '<div class="proj-stripe"></div>' +
      '<div class="proj-body">' +
        '<div class="proj-top">' +
          '<span class="proj-name ellipsis">' + esc(p.name) + '</span>' +
          '<span class="proj-actions">' + actionsHTML(p.id, isRunning, hasSegments) + '</span>' +
          '<span class="proj-spacer"></span>' +
          '<span class="proj-today">' +
            '<span class="proj-today-main">' + (hasSegments ? "今日合计 " + formatMinutes(minutesByPid[p.id] || 0) : "今日暂无记录") + '</span>' +
            (lastInt ? '<span class="interrupt-note">上次中断 ' + formatTime(lastInt.end) + '</span>' : "") +
          '</span>' +
          '<button class="icon-btn menu-btn" data-action="menu" data-id="' + pid + '" aria-label="项目菜单">⋯</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  host.innerHTML = html;
}

function renderRecordList(stats) {
  var host = document.getElementById("record-list");
  var head = document.getElementById("records-head-action");
  if (head) head.innerHTML = "";
  if (stats.records.length === 0) {
    host.innerHTML = '<div class="empty-block">今天还没有记录' +
      '<span class="empty-hint">去上方「我的项目」点「开始」就能记下第一段时间</span></div>';
    return;
  }
  var total = stats.records.length;
  /* 默认只显示最近 5 条（computeDayStats 已按 start 从新到旧排序）；展开/收起不改任何数据 */
  var visible = (recordsExpanded || total <= RECORDS_PAGE_SIZE) ? total : RECORDS_PAGE_SIZE;
  var html = "";
  for (var i = 0; i < visible; i++) {
    var rec = stats.records[i];
    var seg = rec.segment;
    var isRunning = (seg.endType === "running" || seg.end === null || seg.end === undefined);
    var timeText = formatTime(seg.start) + "–" + (isRunning ? "现在" : formatTime(seg.end));
    var tag = isRunning ? '<span class="tag tag-running">计时中</span>'
      : (seg.endType === "interrupted" ? '<span class="tag">中断</span>' : "");
    /* 备注小灰字标签 + 承接来源标记 + 超 8 字折叠 */
    var note = (typeof seg.note === "string") ? seg.note : "";
    var src = (typeof seg.sourceProject === "string") ? seg.sourceProject : "";
    var longNote = noteChars(note).length > 8;
    var expanded = !!expandedNoteIds[seg.id];
    var noteLabel = (longNote && !expanded) ? noteShort(note) : note;
    var noteHTML = note
      ? '<span class="rec-note">' + esc(noteLabel) +
        (longNote ? '<span class="rec-note-hint">' + (expanded ? " 收起" : " 展开") + '</span>' : "") +
        '</span>'
      : "";
    var fromHTML = src ? '<span class="rec-from">← ' + esc(src) + '</span>' : "";
    var rowAttrs = longNote
      ? ' class="record-row rec-expandable" data-action="toggle-note" data-id="' + esc(seg.id) + '"'
      : ' class="record-row"';
    html += '<div' + rowAttrs + '>' +
      '<span class="dot" style="background:' + (rec.colorHex || colorOf(rec.project.colorIndex)) + '"></span>' +
      '<div class="rec-main">' +
        '<div class="rec-line1">' +
          '<span class="rec-name ellipsis">' + esc(rec.project.name) + '</span>' +
          '<span class="rec-time">' + timeText + '</span>' +
        '</div>' +
        '<div class="rec-line2">' + rec.minutes + ' 分钟' + tag + fromHTML + noteHTML + '</div>' +
      '</div>' +
      '<button class="icon-btn rec-del" data-action="delete-record" data-id="' + esc(seg.id) + '" aria-label="删除本段">×</button>' +
    '</div>';
  }
  if (total > RECORDS_PAGE_SIZE) {
    if (head) head.innerHTML = '<button class="head-action" data-action="toggle-records">' +
      (recordsExpanded ? "收起" : "查看全部") + '</button>';
    html += '<button class="records-toggle" data-action="toggle-records">' +
      (recordsExpanded ? "收起" : "展开全部（共 " + total + " 条）") + '</button>';
  }
  host.innerHTML = html;
}

/** 一次 render 只取一次 now，向下传递，保证所有合计同源 */
function render() {
  var now = Date.now();
  var dayKey = dayKeyOf(now);
  var stats = computeDayStats(state, dayKey, now);
  var running = findRunningSegment(state);
  renderHeader();
  renderStatusBar(running);
  renderOverview(stats);
  renderProjectList(stats, running, dayKey);
  renderRecordList(stats);
  applyReveal();
}

/* -------------------- 五、事件与业务流程 -------------------- */

function startTimer(pid) {
  if (!getProject(pid)) return;
  var now = Date.now();
  syncRolloverForNow(now);
  var dayKey = dayKeyOf(now);
  var toastText = null;
  /* 全局最多一个进行中段：若别的项目正在计时，系统代关（finished），不弹窗、不二次确认 */
  var guard = 0;
  while (guard++ < 20) {
    var running = findRunningSegment(state);
    if (!running || running.projectId === pid) break;
    var closedProject = getProject(running.projectId);
    var mins = minutesOfSegment(running.seg, now);
    if (isChoreProject(closedProject)) {
      /* 杂事被代关：不弹窗，顶部状态条浮现一行「杂事已记录 XX 分钟」 */
      showChoreNotice("杂事已记录 " + mins + " 分钟");
    } else if (!toastText && closedProject) {
      toastText = "《" + closedProject.name + "》已记录 " + mins + " 分钟";
    }
    closeRunningAt(running, now, "finished");
  }
  var still = findRunningSegment(state);
  if (still && still.projectId === pid) { save(); render(); return; } /* 防御：不重复开段 */
  var b = ensureBucket(state.days, dayKey, pid);
  b.push({ id: newId("s"), start: now, end: null, endType: "running", note: "", sourceProject: "" });
  state.currentDayKey = dayKey;
  save();
  render();
  if (toastText) showToast(toastText);
}

function stopTimer(pid, endType) {
  var now = Date.now();
  syncRolloverForNow(now);
  var running = findRunningSegment(state);
  if (running && running.projectId === pid) closeRunningAt(running, now, endType);
  state.currentDayKey = dayKeyOf(now);
  save();
  render();
}

function deleteRecordById(segId) {
  var now = Date.now();
  syncRolloverForNow(now);
  var dayKey = dayKeyOf(now);
  var bucket = (state.days && state.days[dayKey]) || {};
  var pids = Object.keys(bucket);
  for (var i = 0; i < pids.length; i++) {
    var arr = bucket[pids[i]];
    if (!Array.isArray(arr)) continue;
    var idx = -1;
    for (var j = 0; j < arr.length; j++) if (arr[j].id === segId) { idx = j; break; }
    if (idx >= 0) {
      arr.splice(idx, 1);
      if (arr.length === 0) delete bucket[pids[i]];
      break;
    }
  }
  if (Object.keys(bucket).length === 0 && state.days) delete state.days[dayKey];
  state.currentDayKey = dayKey;
  save();
  render();
}

function deleteProjectById(pid) {
  if (isSystemChore(getProject(pid))) return; /* 系统项目「杂事」不可删除 */
  var now = Date.now();
  syncRolloverForNow(now);
  state.projects = (Array.isArray(state.projects) ? state.projects : []).filter(function (p) { return p.id !== pid; });
  var days = state.days || {};
  var dks = Object.keys(days);
  for (var i = 0; i < dks.length; i++) {
    if (days[dks[i]] && days[dks[i]][pid]) delete days[dks[i]][pid];
    if (days[dks[i]] && Object.keys(days[dks[i]]).length === 0) delete days[dks[i]];
  }
  state.currentDayKey = dayKeyOf(now);
  save();
  render();
}

function onDocumentClick(e) {
  var target = (e.target && typeof e.target.closest === "function") ? e.target : null;
  if (!target) return;
  var menuEl = target.closest(".proj-menu");
  var isMenuBtn = !!target.closest('[data-action="menu"]');
  if (!menuEl && !isMenuBtn) closeProjMenu();

  var el = target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  var id = el.getAttribute("data-id");
  switch (action) {
    case "edit-nickname": openNicknameModal(); break;
    case "add-project": openProjectModal(); break;
    case "start": startTimer(id); break;
    case "interrupt": openInterruptSheet(id); break;
    case "finish": stopTimer(id, "finished"); break;
    case "menu": toggleProjMenu(id, el); break;
    case "menu-target": closeProjMenu(); openTargetModal(id); break;
    case "menu-delete": closeProjMenu(); openDeleteProjectModal(id); break;
    case "menu-clear-chore":
      closeProjMenu();
      openConfirmModal({
        title: "清空今日记录",
        message: "确定清空「杂事」今天的所有记录吗？其他项目不受影响，且无法恢复。",
        confirmText: "清空", danger: true,
        onConfirm: function () { clearChoreToday(); }
      });
      break;
    case "target": openTargetModal(id); break;
    case "delete-record": openDeleteRecordModal(id); break;
    case "toggle-note": toggleNote(id); break;
    case "toggle-records": toggleRecordsExpanded(); break;
    case "generate-card": openCardPreview(); break;
    case "export-records": exportRecords(); break;
    case "modal-cancel": closeModal(); break;
    case "modal-confirm": handleModalConfirm(); break;
    case "modal-backdrop": closeModal(); break;
    case "save-image": saveCardImage(); break;
    default: break;
  }
}

function onDocumentKeydown(e) {
  if (e.key === "Escape") {
    closeProjMenu();
    if (sheetState) { var sp = sheetState.pid; closeSheet(); doInterrupt(sp, "only", ""); }
    else if (modalState) closeModal();
  }
  if (e.key === "Enter" && modalState && modalState.kind !== "preview") {
    var t = e.target;
    if (t && t.tagName === "INPUT") { e.preventDefault(); handleModalConfirm(); }
  }
}

/* -------------------- 六、弹层与 toast -------------------- */

var modalState = null;
var toastTimer = null;

function closeModal() {
  modalState = null;
  document.getElementById("modal-root").innerHTML = "";
}

function openModalShell(panelHTML, config) {
  modalState = config;
  document.getElementById("modal-root").innerHTML =
    '<div class="modal-backdrop" data-action="modal-backdrop"></div>' +
    '<div class="modal-panel" role="dialog" aria-modal="true">' + panelHTML + '</div>';
}

function showModalError(msg) {
  var box = document.getElementById("modal-error");
  if (box) box.textContent = msg;
}

function readModalValues() {
  var root = document.getElementById("modal-root");
  var input = root.querySelector("#modal-input");
  var hours = root.querySelector("#modal-input");
  var minutes = root.querySelector("#modal-minutes");
  return {
    input: input ? input.value : "",
    hours: hours ? hours.value : "",
    minutes: minutes ? minutes.value : ""
  };
}

function handleModalConfirm() {
  if (!modalState || typeof modalState.onConfirm !== "function") { closeModal(); return; }
  var ok = modalState.onConfirm(readModalValues());
  if (ok === false) return; /* 校验失败：弹层内红字提示，不关闭 */
  closeModal();
}

function openInputModal(config) {
  var panel =
    '<div class="modal-title">' + esc(config.title) + '</div>' +
    (config.desc ? '<div class="modal-desc">' + esc(config.desc) + '</div>' : "") +
    '<label class="modal-label" for="modal-input">' + esc(config.label) + '</label>' +
    '<input id="modal-input" class="modal-input" type="text" maxlength="60" ' +
      'value="' + esc(config.value) + '" placeholder="' + esc(config.placeholder || "") + '" autocomplete="off">' +
    '<div class="modal-error" id="modal-error"></div>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-outline" data-action="modal-cancel">取消</button>' +
      '<button class="btn btn-primary" data-action="modal-confirm">保存</button>' +
    '</div>';
  openModalShell(panel, { kind: "input", onConfirm: config.onConfirm });
}

function openConfirmModal(config) {
  var panel =
    '<div class="modal-title">' + esc(config.title) + '</div>' +
    '<div class="modal-desc confirm-desc">' + esc(config.message) + '</div>' +
    '<div class="modal-error" id="modal-error"></div>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-outline" data-action="modal-cancel">取消</button>' +
      '<button class="btn ' + (config.danger ? "btn-danger" : "btn-primary") + '" data-action="modal-confirm">' +
        esc(config.confirmText || "确认") + '</button>' +
    '</div>';
  openModalShell(panel, {
    kind: "confirm",
    onConfirm: function () { config.onConfirm(); return true; }
  });
}

function openNicknameModal() {
  openInputModal({
    title: "修改昵称",
    label: "昵称（去空格后非空，最多 12 个字）",
    value: state.nickname,
    placeholder: "请输入昵称",
    onConfirm: function (v) {
      var name = String(v.input || "").trim();
      if (name.length === 0) { showModalError("昵称不能为空"); return false; }
      if (Array.from(name).length > 12) { showModalError("昵称最多 12 个字"); return false; }
      state.nickname = name;
      save(); render();
      return true;
    }
  });
}

function openProjectModal() {
  openInputModal({
    title: "新建项目",
    label: "项目名称（最多 10 个字，不可重名）",
    value: "",
    placeholder: "例如：阅读、运动",
    onConfirm: function (v) {
      var name = String(v.input || "").trim();
      if (name.length === 0) { showModalError("项目名称不能为空"); return false; }
      if (Array.from(name).length > 10) { showModalError("项目名称最多 10 个字"); return false; }
      var dup = (Array.isArray(state.projects) ? state.projects : []).some(function (p) {
        return String(p.name).trim().toLowerCase() === name.toLowerCase();
      });
      if (dup) { showModalError("已存在同名项目"); return false; }
      var idx = state.nextColorIndex % PALETTE.length;
      state.nextColorIndex = idx + 1;
      var pid = newId("p");
      state.projects.push({
        id: pid, name: name, colorIndex: idx,
        targetMinutes: null, createdAt: Date.now(),
        sortIndex: nextSortIndex()
      });
      markReveal(pid);
      save(); render();
      /* 紧接着弹出目标时长设置面板；延后到本次弹层被 closeModal 关闭之后，避免被清掉 */
      window.setTimeout(function () { openTargetModal(pid, { cancelText: "暂不设置" }); }, 0);
      return true;
    }
  });
}

function openTargetModal(pid, opts) {
  opts = opts || {};
  var p = getProject(pid);
  if (!p || isSystemChore(p)) return; /* 系统项目「杂事」不设每日目标 */
  var cur = (typeof p.targetMinutes === "number" && p.targetMinutes > 0) ? p.targetMinutes : 0;
  var h = Math.floor(cur / 60), m = cur % 60;
  var panel =
    '<div class="modal-title">修改目标时长</div>' +
    '<div class="modal-desc">' + esc(p.name) + ' · 合计为 0 分钟视为「未设置目标」，不计入目标总时长</div>' +
    '<div class="target-inputs">' +
      '<div class="target-field"><label for="modal-input">小时（0~23）</label>' +
        '<input id="modal-input" class="modal-input" type="number" inputmode="numeric" min="0" max="23" step="1" value="' + h + '"></div>' +
      '<div class="target-field"><label for="modal-minutes">分钟（0~59）</label>' +
        '<input id="modal-minutes" class="modal-input" type="number" inputmode="numeric" min="0" max="59" step="1" value="' + m + '"></div>' +
    '</div>' +
    '<div class="modal-error" id="modal-error"></div>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-outline" data-action="modal-cancel">' + esc((opts && opts.cancelText) || "取消") + '</button>' +
      '<button class="btn btn-primary" data-action="modal-confirm">保存</button>' +
    '</div>';
  openModalShell(panel, {
    kind: "target",
    onConfirm: function (v) {
      var hv = parseNonNegInt(v.hours), mv = parseNonNegInt(v.minutes);
      if (hv === null || mv === null) { showModalError("请输入有效的整数"); return false; }
      if (hv < 0 || hv > 23) { showModalError("小时需在 0~23 之间"); return false; }
      if (mv < 0 || mv > 59) { showModalError("分钟需在 0~59 之间"); return false; }
      var total = hv * 60 + mv;
      p.targetMinutes = total > 0 ? total : null;
      save(); render();
      return true;
    }
  });
}

function openDeleteProjectModal(pid) {
  var p = getProject(pid);
  if (!p || isSystemChore(p)) return;
  openConfirmModal({
    title: "删除项目",
    message: "确定删除《" + p.name + "》吗？该项目的所有记录也会一并删除，且无法恢复。",
    confirmText: "删除",
    danger: true,
    onConfirm: function () { deleteProjectById(pid); }
  });
}

function openDeleteRecordModal(segId) {
  openConfirmModal({
    title: "撤销这段记录",
    message: "删除后，这段时长会从项目合计、今日总时长、圆环与百分比中同步扣除。",
    confirmText: "删除记录",
    danger: true,
    onConfirm: function () { deleteRecordById(segId); }

}

function toggleProjMenu(pid, anchorEl) {
  var existing = document.querySelector(".proj-menu");
  if (existing) {
    var wasSame = existing.getAttribute("data-project") === pid;
    existing.remove();
    if (wasSame) return;
  }
  var card = anchorEl.closest(".project-card");

  var menu = document.createElement("div");
  menu.className = "proj-menu";

    : '<button class="menu-item" data-action="menu-target" data-id="' + esc(pid) + '">修改目标时长</button>' +
      '<button class="menu-item danger" data-action="menu-delete" data-id="' + esc(pid) + '">删除项目</button>';
  card.appendChild(menu);
}

function closeProjMenu() {
  var m = document.querySelector(".proj-menu");
  if (m) m.remove();
}

function showToast(text) {
  var el = document.getElementById("toast");
  if (!el) return;
  el.textContent = text;
  el.classList.add("show");
  if (toastTimer !== null) { clearTimeout(toastTimer); toastTimer = null; }
  toastTimer = setTimeout(function () {
    el.classList.remove("show");
    toastTimer = null;
  }, 2800);
}

/* -------------------- 七、今日记录卡 canvas -------------------- */

function roundRect(ctx, x, y, w, h, r) {
  var rr = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

/** canvas 文本按最大宽度截断加省略号，避免长项目名溢出卡片 */
function fitText(ctx, text, maxWidth) {
  var t = String(text === null || text === undefined ? "" : text);
  if (ctx.measureText(t).width <= maxWidth) return t;
  var arr = Array.from(t);
  while (arr.length > 1 && ctx.measureText(arr.join("") + "…").width > maxWidth) arr.pop();
  return arr.join("") + "…";
}

/** 用系统字体栈纯绘制（不引入任何跨域图片，保证 toDataURL 不被污染） */
function drawCardCanvas(canvas, stats, now) {
  var W = 750;
  var n = stats.perProject.length;
  var H = Math.max(1000, 700 + n * 96);
  canvas.width = W * 2;
  canvas.height = H * 2;
  canvas.style.width = "100%";
  canvas.style.height = "auto";
  canvas.style.display = "block";
  var ctx = canvas.getContext("2d");
  if (!ctx) return;
  ctx.scale(2, 2); /* 2 倍位图，逻辑坐标仍按 750×H 绘制 */

  var left = 76, right = 674;

  ctx.fillStyle = "#EDF3FC";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = "rgba(35, 75, 140, 0.14)";
  ctx.shadowBlur = 28;
  ctx.shadowOffsetY = 10;
  ctx.fillStyle = "#FFFFFF";
  roundRect(ctx, 36, 36, W - 72, H - 72, 30);
  ctx.fill();
  ctx.restore();

  /* 头像 + 「时」 */
  ctx.fillStyle = "#2F7DF6";
  ctx.beginPath(); ctx.arc(left + 42, 132, 42, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "bold 36px " + FONT_STACK;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("时", left + 42, 134);

  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#1F2A44";
  ctx.font = "bold 36px " + FONT_STACK;
  ctx.fillText(fitText(ctx, state.nickname, right - 200), 184, 126);
  ctx.fillStyle = "#8A94A6";
  ctx.font = "24px " + FONT_STACK;
  var d = new Date(now);
  var dateText = d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日 " + WEEK_NAMES[d.getDay()];
  ctx.fillText(dateText, 184, 170);

  ctx.strokeStyle = "#EEF1F7"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(left, 214); ctx.lineTo(right, 214); ctx.stroke();

  ctx.fillStyle = "#8A94A6"; ctx.font = "24px " + FONT_STACK;
  ctx.fillText("今日总时长", left, 268);
  ctx.fillText("目标完成", 410, 268);
  ctx.fillStyle = "#2F7DF6"; ctx.font = "bold 68px " + FONT_STACK;
  ctx.fillText(formatMinutes(stats.totalMinutes), left, 344);
  ctx.fillText(stats.percent + "%", 410, 344);

  var barY = 382, barW = right - left, barH = 14;
  ctx.fillStyle = "#E8EDF5";
  roundRect(ctx, left, barY, barW, barH, 7); ctx.fill();
  var ratio = stats.hasTarget ? Math.min(Math.max(stats.ratio, 0), 1) : 0;
  if (ratio > 0) {
    var bw = Math.max(2, barW * ratio);
    ctx.fillStyle = "#2F7DF6";
    roundRect(ctx, left, barY, bw, barH, Math.min(7, bw / 2)); ctx.fill();
  }

  /* 其中杂事 XX 分钟：位置在今日总时长下面，无杂事记录时不显示。
     杂事行/小节标题/列表统一下移，给这行灰字留出不与标题相挤的间距（画布高度 H 无需改动）。 */
  if (stats.choreMinutes > 0) {
    ctx.fillStyle = "#8A94A6"; ctx.font = "22px " + FONT_STACK;
    ctx.fillText("其中杂事 " + stats.choreMinutes + " 分钟", left, 430);
  }

  ctx.fillStyle = "#1F2A44"; ctx.font = "bold 30px " + FONT_STACK;
  ctx.fillText("今日各项目小计", left, 478);

  var listStart = 510;
  if (n === 0) {
    ctx.fillStyle = "#A6AFC0"; ctx.font = "26px " + FONT_STACK;
    ctx.fillText("今天还没有记录", left, listStart + 46);
  } else {
    for (var i = 0; i < n; i++) {
      var item = stats.perProject[i];
      var y = listStart + i * 96;
      ctx.fillStyle = "#F7FAFF";
      roundRect(ctx, left, y, right - left, 80, 16); ctx.fill();
      ctx.fillStyle = item.colorHex || colorOf(item.colorIndex);
      roundRect(ctx, left + 16, y + 18, 8, 44, 4); ctx.fill();
      ctx.fillStyle = "#1F2A44"; ctx.font = "30px " + FONT_STACK;
      ctx.textAlign = "left";
      ctx.fillText(fitText(ctx, item.name, 330), left + 40, y + 50);
      ctx.fillStyle = "#2F7DF6"; ctx.font = "bold 30px " + FONT_STACK;
      ctx.textAlign = "right";
      ctx.fillText(formatMinutes(item.minutes), right - 20, y + 50);
      ctx.textAlign = "left";
    }
  }

  ctx.fillStyle = "#B4BDCB"; ctx.font = "22px " + FONT_STACK;
  ctx.textAlign = "center";
  ctx.fillText("我的时间记录 · 数据仅保存在本机", W / 2, H - 68);
  ctx.textAlign = "left";
}

function openCardPreview() {
  var now = Date.now();
  var stats = computeDayStats(state, dayKeyOf(now), now);
  var panel =
    '<div class="modal-title preview-title">今日记录卡</div>' +
    '<div class="preview-scroll"><div id="card-preview" class="card-preview"></div></div>' +
    '<div class="card-hint" id="card-hint">点击下方按钮生成可保存的图片</div>' +
    '<div class="modal-error" id="modal-error"></div>' +
    '<div class="modal-actions preview-actions">' +
      '<button class="btn btn-outline" data-action="modal-cancel">关闭</button>' +
      '<button class="btn btn-primary" id="btn-save-image" data-action="save-image">保存图片</button>' +
    '</div>';
  openModalShell(panel, { kind: "preview", onConfirm: null });
  var holder = document.getElementById("card-preview");
  var canvas = document.createElement("canvas");
  canvas.id = "card-canvas";
  drawCardCanvas(canvas, stats, now);
  if (holder) holder.appendChild(canvas);
}

/** 预览与保存同一张位图：直接把 canvas.toDataURL 的 PNG 放进 img 元素，逐像素一致 */
function saveCardImage() {
  var canvas = document.getElementById("card-canvas");
  if (!canvas) return;
  var url = "";
  try { url = canvas.toDataURL("image/png"); }
  catch (e) { showModalError("图片生成失败，请重试"); return; }
  var holder = document.getElementById("card-preview");
  if (holder) {
    var img = document.createElement("img");
    img.src = url;
    img.alt = "我的今日记录卡";
    img.className = "card-image";
    holder.innerHTML = "";
    holder.appendChild(img);
  }
  var hint = document.getElementById("card-hint");
  if (hint) hint.textContent = "长按图片保存到相册";
  var btn = document.getElementById("btn-save-image");
  if (btn) { btn.textContent = "已生成图片"; btn.disabled = true; btn.classList.add("btn-disabled"); }
  try {
    var a = document.createElement("a");
    a.href = url;
    a.download = "我的时间记录-" + dayKeyOf(Date.now()) + ".png";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (e) { /* 桌面自动下载失败不影响移动端长按保存 */ }
}

/* -------------------- 八、初始化 -------------------- */

function init() {
  /* 刷新 / 重新打开一律回到最顶部（「我的项目」），不恢复上次的滚动位置 */
  try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
  try { window.scrollTo(0, 0); } catch (e) {}
  state = load();
  /* 兼容旧数据：仅在存在缺 sortIndex 的项目时按当前顺序重编号 */
  var needSave = ensureSortIndexes(state);
  /* 系统项目「杂事」：首次打开 / 读取旧数据时自动补齐并规整 */
  if (ensureChoreProject(state)) needSave = true;
  if (needSave) save();
  var now = Date.now();
  var k = dayKeyOf(now);
  if (state.currentDayKey !== k) {
    normalizeDayRollover(k);
    save();
  }
  render();
  /* 事件委托：只在 document 上绑定一次，render 重建 DOM 不重复绑定 */
  document.addEventListener("click", onDocumentClick);
  document.addEventListener("keydown", onDocumentKeydown);
  /* 约 30 秒轮询，仅检测是否跨天，不刷新任何数字 */
  window.setInterval(checkDayAndRefresh, 30000);
  /* 1s 只更新状态条上的「已计时」数字，绝不整页 render（避免打断菜单/弹层/输入焦点） */
  window.setInterval(tickRunningElapsed, 1000);
}

init();

/* QA 本地自测接口：不影响界面 */
window.TTR = {
  getState: function () { return state; },
  setStateForTest: function (s) { state = s; save(); render(); },
  render: render,
  computeDayStats: computeDayStats,
  dayKeyOf: dayKeyOf,
  minutesOfSegment: minutesOfSegment,
  formatMinutes: formatMinutes,
  splitSegmentByMidnight: splitSegmentByMidnight,
  PALETTE: PALETTE,
  STORAGE_KEY: STORAGE_KEY,
  openCardPreview: openCardPreview
};
</script>

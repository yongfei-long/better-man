/* -------------------- 每日上限（dailyLimit）-------------------- */
/** 只读计算某天每个项目的「今日累计 / 上限 / 超额分钟数」。
    完全独立于 computeDayStats，不参与目标完成率，不改动任何统计口径。
    已用时间 = 该项目今天所有时段累计（minutesOfSegment 对进行中段算到 now）。*/
function limitRowsForDay(dayKey, now) {
  var bucket = (state && state.days && state.days[dayKey]) || {};
  var projects = (state && Array.isArray(state.projects)) ? state.projects : [];
  var out = [];
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    if (!p) continue;
    var limit = (typeof p.dailyLimit === "number" && Number.isFinite(p.dailyLimit) && p.dailyLimit > 0)
      ? Math.floor(p.dailyLimit) : null;
    var segs = Array.isArray(bucket[p.id]) ? bucket[p.id] : [];
    var used = 0;
    for (var j = 0; j < segs.length; j++) if (segs[j]) used += minutesOfSegment(segs[j], now);
    out.push({ projectId: p.id, name: p.name, limit: limit, used: used,
      over: (limit && used > limit) ? (used - limit) : 0 });
  }
  return out;
}

function limitExceededProjects(dayKey, now) {
  var rows = limitRowsForDay(dayKey, now), out = [];
  for (var i = 0; i < rows.length; i++) if (rows[i].limit && rows[i].over > 0) out.push(rows[i]);
  return out;
}

/** 卡片上的上限小字：与「上次中断」占用同一位置，二者都有时上限优先 */
function limitNoteHTML(row, lastInt) {
  if (row && row.limit) {
    if (row.over > 0) return '<span class="limit-note over">已超 ' + row.over + ' 分钟 · 限制 ' + row.limit + ' 分</span>';
    return '<span class="limit-note">上限 ' + row.limit + ' 分 · 已用 ' + row.used + ' 分</span>';
  }
  return lastInt ? '<span class="interrupt-note">上次中断 ' + formatTime(lastInt.end) + '</span>' : "";
}

/** 「设置目标与上限」面板：上限小于目标时的小灰字提醒（输入时实时刷新） */
function updateTargetHint() {
  var root = document.getElementById("modal-root");
  if (!root) return false;
  var hint = root.querySelector("#modal-limit-hint");
  var limEl = root.querySelector("#modal-limit");
  var hEl = root.querySelector("#modal-input");
  var mEl = root.querySelector("#modal-minutes");
  if (!hint || !limEl || !hEl || !mEl) return false;
  var raw = String(limEl.value === undefined || limEl.value === null ? "" : limEl.value).trim();
  var lv = raw === "" ? null : parseNonNegInt(raw);
  var hv = parseNonNegInt(hEl.value), mv = parseNonNegInt(mEl.value);
  var target = (hv === null || mv === null) ? 0 : hv * 60 + mv;
  var show = (lv !== null && lv > 0 && target > 0 && lv < target);
  hint.style.display = show ? "" : "none";
  return show;
}

/* ---- 页面顶部橙色提示条：5 秒自动淡出，不弹窗、不阻断操作 ---- */
var limitNoticeTimer = null, limitNotified = {};
function showLimitNotice(text) {
  var el = document.getElementById("limit-notice");
  if (!el) return;
  el.textContent = text;
  el.classList.remove("show");
  void el.offsetWidth; /* 重启动画 */
  el.classList.add("show");
  if (limitNoticeTimer !== null) { clearTimeout(limitNoticeTimer); limitNoticeTimer = null; }
  limitNoticeTimer = setTimeout(function () {
    var cur = document.getElementById("limit-notice");
    if (cur) cur.classList.remove("show");
    limitNoticeTimer = null;
  }, 5000);
}

/** 超额只做提示，绝不自动结束计时、不禁止开始。
    force=true：结束/中断时按需求提示一次；
    force=false：计时途中越线，按 (dayKey|pid) 去重，只在越线那一刻提示一次。*/
function checkLimitNotice(pid, dayKey, now, force) {
  var p = getProject(pid);
  /* 上限只属于「适可而止」组，more 组互不串 */
  if (!p || groupOf(p) !== GROUP_LESS ||
      !(typeof p.dailyLimit === "number" && Number.isFinite(p.dailyLimit) && p.dailyLimit > 0)) return;
  var rows = limitRowsForDay(dayKey, now), row = null;
  for (var i = 0; i < rows.length; i++) if (rows[i].projectId === pid) { row = rows[i]; break; }
  if (!row || !row.limit || row.over <= 0) return;
  var key = dayKey + "|" + pid;
  if (!force && limitNotified[key]) return;
  limitNotified[key] = true;
  showLimitNotice("《" + row.name + "》今天已超 " + row.over + " 分钟");
}

/* ---- 概览最下方「N 个项目超出上限」可展开汇总（纯 UI 状态，不写入 state）---- */
var limitsExpanded = false;
/** 概览「适可而止：N 个项目，M 个超额」：只统计 less 组，点击展开超额项目名与分钟数 */
function renderLimitSummary(dayKey, now) {
  var host = document.getElementById("ov-limit-summary");
  if (!host) return;
  var ps = Array.isArray(state.projects) ? state.projects : [];
  var lessTotal = 0;
  for (var i = 0; i < ps.length; i++) if (groupOf(ps[i]) === GROUP_LESS) lessTotal++;
  if (lessTotal === 0) { host.innerHTML = ""; host.style.display = "none"; return; }
  var all = limitRowsForDay(dayKey, now), byPid = {};
  for (var a = 0; a < all.length; a++) byPid[all[a].projectId] = all[a];
  var overRows = [];
  for (var j = 0; j < ps.length; j++) {
    var p = ps[j];
    if (groupOf(p) !== GROUP_LESS) continue;
    var r = byPid[p.id];
    if (r && r.limit && r.over > 0) overRows.push(r);
  }
  host.style.display = "";
  var html = '<button class="ov-limit-head" data-action="toggle-limit-summary">' +
    '适可而止：' + lessTotal + ' 个项目，<span class="ov-less-over">' + overRows.length + ' 个超额</span>' +
    (limitsExpanded ? ' ▴' : ' ▾') + '</button>';
  if (limitsExpanded) {
    html += '<div class="ov-limit-list">';
    if (overRows.length === 0) html += '<div class="ov-limit-row"><span>暂无超额项目</span><span></span></div>';
    for (var k = 0; k < overRows.length; k++) {
      html += '<div class="ov-limit-row"><span>' + esc(overRows[k].name) + '</span>' +
        '<span>超 ' + overRows[k].over + ' 分钟</span></div>';
    }
    html += '</div>';
  }
  host.innerHTML = html;
}

/** 导出记录：只读现有 state 生成 CSV 下载，不改动任何数据与统计口径 */
function exportRecords() {
  var now = Date.now();
  var days = (state && state.days) || {};
  var dayKeys = Object.keys(days).sort();
  var rows = [];
  /* 按日汇总预计算：明细每行复用同一份结果，避免逐行重算；
     口径与文件末尾「按日汇总」区完全一致，不改动任何统计规则。 */
  var daySummary = {};
  for (var ds = 0; ds < dayKeys.length; ds++) {
    var sk = dayKeys[ds];
    var sst = computeDayStats(state, sk, now);
    daySummary[sk] = {
      total: String(sst.totalMinutes),
      target: String(sst.targetMinutes),
      percent: sst.percent + "%",
      count: String(sst.records.length),
      over: String(limitExceededProjects(sk, now).length)
    };
  }
  for (var d = 0; d < dayKeys.length; d++) {
    var dk = dayKeys[d];
    var bucket = days[dk] || {};
    var pids = Object.keys(bucket);
    var limitByPid = {};
    var lrows = limitRowsForDay(dk, now);
    for (var li = 0; li < lrows.length; li++) limitByPid[lrows[li].projectId] = lrows[li];
    for (var pi = 0; pi < pids.length; pi++) {
      var pid = pids[pi];
      var p = getProject(pid);
      var pname = p ? p.name : pid;
      var arr = Array.isArray(bucket[pid]) ? bucket[pid] : [];
      var lr = limitByPid[pid] || { limit: null, used: 0, over: 0 };
      for (var j = 0; j < arr.length; j++) {
        var seg = arr[j];
        if (!seg) continue;
        var running = (seg.endType === "running" || seg.end === null || seg.end === undefined);
        var status = running ? "计时中" : (seg.endType === "interrupted" ? "中断" : "完成");
        rows.push([
          dk, pname, groupLabelOf(p),
          formatTime(seg.start),
          running ? "进行中" : formatTime(seg.end),
          String(minutesOfSegment(seg, now)),
          status,
          (typeof seg.note === "string") ? seg.note : "",
          (typeof seg.sourceProject === "string") ? seg.sourceProject : "",
          (p && typeof p.targetMinutes === "number" && p.targetMinutes > 0) ? String(p.targetMinutes) : "",
          lr.limit ? String(lr.limit) : "",
          String(lr.used),
          lr.limit ? (lr.over > 0 ? "是" : "否") : "",
          lr.limit ? String(lr.over) : "",
          daySummary[dk].total, daySummary[dk].target, daySummary[dk].percent,
          daySummary[dk].count, daySummary[dk].over
        ]);
      }
    }
  }
  if (rows.length === 0) { showToast("暂无记录可导出"); return; }
  /* 「项目」后插入「分组」列，其余列相对位置与格式一律不变；
     末尾 5 个「按日汇总_*」列保持不变。 */
  var lines = [["日期", "项目", "分组", "开始", "结束", "时长(分钟)", "状态", "备注", "来源项目",
    "每日目标_分钟", "每日上限_分钟", "当日已用_分钟", "是否超额", "超额_分钟",
    "按日汇总_今日合计_分钟", "按日汇总_目标合计_分钟", "按日汇总_完成率", "按日汇总_记录段数", "按日汇总_超额项目数"]];
  for (var r = 0; r < rows.length; r++) lines.push(rows[r]);
  /* 按日汇总区：空一行后追加，含「超额项目数」列；仍是同一个文件、同一个导出入口 */
  lines.push([""]);
  lines.push(["按日汇总", "日期", "今日合计_分钟", "目标合计_分钟", "完成率", "记录段数", "超额项目数", "多多益善完成率"]);
  for (var dd = 0; dd < dayKeys.length; dd++) {
    var k = dayKeys[dd];
    var st = computeDayStats(state, k, now);
    lines.push(["", k, String(st.totalMinutes), String(st.targetMinutes),
      st.percent + "%", String(st.records.length), String(limitExceededProjects(k, now).length),
      st.morePercent + "%"]);
  }
  var csv = "";
  for (var i = 0; i < lines.length; i++) {
    var cells = [];
    for (var c = 0; c < lines[i].length; c++) {
      var v = lines[i][c];
      cells.push('"' + String(v === null || v === undefined ? "" : v).replace(/"/g, '""') + '"');
    }
    csv += (i > 0 ? "\r\n" : "") + cells.join(",");
  }
  try {
    var blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "我的时间记录-" + dayKeyOf(now) + ".csv";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 0);
    showToast("已导出 " + rows.length + " 条记录");
  } catch (e) {
    showToast("导出失败，请重试");
  }
}

function load() {
  var raw = null;
  try { raw = window.localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
  if (!raw) return defaultState(Date.now());
  var obj = null;
  try { obj = JSON.parse(raw); } catch (e) { return defaultState(Date.now()); }
  return sanitizeState(obj);
}

function save() {
  try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { /* file:// 下 localStorage 不可用：优雅降级为内存态，不白屏 */ }
  /* 同步层：所有写入都经过这里，因此一处挂钩即可覆盖全部变更路径 */
  markSyncDirty();
}

function ensureBucket(days, dayKey, pid) {
  if (!days) { state.days = {}; days = state.days; } /* 防御：注入/损坏数据也能安全写入 */
  if (!days[dayKey]) days[dayKey] = {};
  if (!Array.isArray(days[dayKey][pid])) days[dayKey][pid] = [];
  return days[dayKey][pid];
}

function getProject(pid) {
  var ps = Array.isArray(state.projects) ? state.projects : [];
  for (var i = 0; i < ps.length; i++) if (ps[i].id === pid) return ps[i];
  return null;
}

function removeSegmentRaw(st, dayKey, pid, seg) {
  var bucket = st.days[dayKey];
  if (!bucket || !Array.isArray(bucket[pid])) return;
  var arr = bucket[pid];
  var idx = arr.indexOf(seg);
  if (idx >= 0) arr.splice(idx, 1);
  if (arr.length === 0) delete bucket[pid];
  if (Object.keys(bucket).length === 0) delete st.days[dayKey];
}

function findAllRunningSegments(st) {
  var out = [];
  var days = (st && st.days) || {};
  var dks = Object.keys(days);
  for (var d = 0; d < dks.length; d++) {
    var bucket = days[dks[d]] || {};
    var pids = Object.keys(bucket);
    for (var p = 0; p < pids.length; p++) {
      var arr = Array.isArray(bucket[pids[p]]) ? bucket[pids[p]] : [];
      for (var s = 0; s < arr.length; s++) {
        var seg = arr[s];
        if (seg && seg.endType === "running" && seg.end === null) {
          out.push({ dayKey: dks[d], projectId: pids[p], seg: seg });
        }
      }
    }
  }
  out.sort(function (a, b) { return b.seg.start - a.seg.start; });
  return out;
}

function findRunningSegment(st) {
  var all = findAllRunningSegments(st);
  return all.length > 0 ? all[0] : null;
}

/** 「上次中断」由数据推导：今天所有已闭合段中 end 最大者若 interrupted 则显示 */
function lastInterruptionFor(st, dayKey, pid) {
  var bucket = (st.days && st.days[dayKey]) || {};
  var arr = Array.isArray(bucket[pid]) ? bucket[pid] : [];
  var best = null;
  var bestIndex = -1;
  for (var i = 0; i < arr.length; i++) {
    var seg = arr[i];
    if (seg.end === null || seg.end === undefined || seg.endType === "running") continue;
    /* 主规则取 end 最大的已闭合段；当 end 相同（同一毫秒连续操作或测试注入）
       时依次用 start、数组顺序裁决，选中「最后一次闭合」产生的段，
       保证点「结束」或系统代关后灰字一定自然消失 */
    if (best === null ||
        seg.end > best.end ||
        (seg.end === best.end && seg.start > best.start) ||
        (seg.end === best.end && seg.start === best.start && i > bestIndex)) {
      best = seg;
      bestIndex = i;
    }
  }
  return (best && best.endType === "interrupted") ? best : null;
}

/* -------------------- 三、跨天规范化 -------------------- */

/**
 * 设计取舍（重要）：
 *  - 同一天内刷新/关页再开，进行中段保持原 start、end=null，绝不补写结束时间，
 *    也绝不拆成两段或复制出新段。加载时只做「读取 → 跨天规范化 → 渲染」。
 *  - 只有真正跨过零点（currentDayKey 变化）才按零点切分：零点前的部分闭合进
 *    各自旧日期（finished，系统切分），并在新日期创建 start=新零点、end=null 的
 *    running 段（零点后的部分算今天，因此状态条显示 00:00 开始是正确的）。
 *  - 跨多天时由 splitSegmentByMidnight 的循环逐个边界处理。
 * 只修改 state，返回是否有变化；save/render 由调用方统一执行一次。
 */
function normalizeDayRollover(newDayKey) {
  if (!isValidDayKey(newDayKey)) return false;
  var todayMidnight = midnightOf(newDayKey);
  var runnings = findAllRunningSegments(state);
  var changed = false;
  for (var i = 0; i < runnings.length; i++) {
    var r = runnings[i];
    if (r.seg.start >= todayMidnight) continue; /* 仍在同一天：保持原样，不拆分 */
    var parts = splitSegmentByMidnight(r.seg.start, todayMidnight, "finished");
    removeSegmentRaw(state, r.dayKey, r.projectId, r.seg);
    for (var j = 0; j < parts.length; j++) {
      var part = parts[j];
      var b = ensureBucket(state.days, part.dayKey, r.projectId);
      b.push({ id: newId("s"), start: part.start, end: part.end, endType: part.endType,
        note: r.seg.note || "", sourceProject: r.seg.sourceProject || "" });
    }
    var b2 = ensureBucket(state.days, newDayKey, r.projectId);
    b2.push({ id: newId("s"), start: todayMidnight, end: null, endType: "running",
      note: r.seg.note || "", sourceProject: r.seg.sourceProject || "" });
    changed = true;
  }
  state.currentDayKey = newDayKey;
  return changed;
}

/** 业务操作开头调用：若已跨天，先做数据规范化（不弹窗、不打扰） */
function syncRolloverForNow(now) {
  var k = dayKeyOf(now);
  if (state.currentDayKey !== k) normalizeDayRollover(k);
  else state.currentDayKey = k;
}

/** 30 秒轮询：只检测跨天，绝不刷新任何数字 */
function checkDayAndRefresh() {
  var k = dayKeyOf(Date.now());
  if (state.currentDayKey === k) return;
  normalizeDayRollover(k);
  save();
  render();
}

/**
 * 闭合一个进行中段。
 * 同一天内：原地写 end/endType，不拆分、不换 id；
 * 跨零点：按零点切分，零点前段 finished，最后一段保留操作类型，各段新生成 id。
 */
function closeRunningAt(running, endTs, endType, extra) {
  var extraNote = (extra && typeof extra.note === "string") ? extra.note : null;
  var parts = splitSegmentByMidnight(running.seg.start, endTs, endType);
  if (parts.length === 1 && parts[0].dayKey === running.dayKey) {
    running.seg.end = parts[0].end;
    running.seg.endType = parts[0].endType;
    if (extraNote !== null) running.seg.note = extraNote;
    if (typeof running.seg.note !== "string") running.seg.note = "";
    if (typeof running.seg.sourceProject !== "string") running.seg.sourceProject = "";
    return;
  }
  removeSegmentRaw(state, running.dayKey, running.projectId, running.seg);
  for (var i = 0; i < parts.length; i++) {
    var b = ensureBucket(state.days, parts[i].dayKey, running.projectId);
    b.push({ id: newId("s"), start: parts[i].start, end: parts[i].end, endType: parts[i].endType,
      note: (extraNote !== null ? extraNote : (running.seg.note || "")),
      sourceProject: running.seg.sourceProject || "" });
  }
}

/* -------------------- 四、渲染（一次 now，全量重渲染） -------------------- */

function renderHeader() {
  document.getElementById("app-header").innerHTML =
    '<div class="avatar">' + SPROUT_SVG + '</div>' +
    '<div class="header-name"><div class="header-name-inner">' +
      '<span class="header-name-text">' + esc(state.nickname) + '</span>' +
      '<button class="icon-btn edit-btn" data-action="edit-nickname" aria-label="编辑昵称">' + PENCIL_SVG + '编辑</button>' +
    '</div><div class="header-date">' + headerDateText() + '</div></div>';
}

/* 把分钟差格式化为「X 小时 Y 分」，仅用于概览剩余文案，不改判断分支 */
function remainingText(mins) {
  var h = Math.floor(mins / 60), m = mins % 60;
  return h > 0 ? (h + " 小时" + (m > 0 ? " " + m + " 分" : "")) : (m + " 分");
}

/* 1s 定时器：只更新状态条上的已计时数字，绝不调用 render()（避免打断菜单/弹层/输入焦点） */
function tickRunningElapsed() {
  var el = document.getElementById("status-elapsed");
  if (!el) return;
  var running = findRunningSegment(state);
  if (!running) return;
  var t = Date.now();
  el.textContent = "已计时 " + formatMinutes(minutesOfSegment(running.seg, t));
  /* 只在越线那一刻提示一次（去重），绝不调用 render() */
  checkLimitNotice(running.projectId, dayKeyOf(t), t, false);
}

/** 状态条作为 #app 的直接子元素（包含块足够高，sticky 才能持续生效）；无计时完全不渲染 */
function renderStatusBar(running) {
  var old = document.getElementById("status-bar");
  if (old) old.remove();
  if (!running && !choreNoticeText) return;
  /* 方案 A：计时中升级为高亮活动卡；无计时仅剩提示时保持轻量文字条，不新增第二个状态条 */
  var html = '<div id="status-bar"' + (running ? ' class="status-active"' : '') + '>';
  if (running) {
    var p = getProject(running.projectId);
    if (p) {
      var id = esc(p.id);
      html += '<div class="status-line1">' +
          '<span class="status-dot" style="background:' + projectColor(p) + '"></span>' +
          '<span class="status-name">' + esc(p.name) + '</span>' +
          '<span class="status-tag">· 计时中</span>' +
          '<span class="status-elapsed" id="status-elapsed">已计时 ' + formatMinutes(minutesOfSegment(running.seg, Date.now())) + '</span>' +
        '</div>' +
        '<div class="status-line2">' +
          '<button class="btn btn-outline status-btn" data-action="interrupt" data-id="' + id + '">中断</button>' +
          '<button class="btn btn-primary status-btn" data-action="finish" data-id="' + id + '">结束</button>' +
        '</div>';
    }
  }
  if (choreNoticeText) html += '<span class="status-notice">' + esc(choreNoticeText) + '</span>';
  html += '</div>';
  document.getElementById("app-header").insertAdjacentHTML("afterend", html);
}

function renderOverview(stats) {
  /* 两边都为 0（今日合计 0 分钟、完成度 0%）时整块隐藏，下方按钮自然上移、不留空洞 */
  var ovCard = document.getElementById("overview-card");
  /* 今日总计不变；完成度口径改为只算「多多益善」组里设了目标的项目 */
  /* 第十六轮：全天无记录时也保留概览卡（内为全空白时间轴与补记入口），保证第一条记录也能补记 */
  if (ovCard) ovCard.style.display = "";
  document.getElementById("stat-total").textContent = formatMinutes(stats.totalMinutes);
  document.getElementById("stat-target").textContent = stats.moreHasTarget ? "目标 " + formatMinutes(stats.moreTargetMinutes) : "未设置目标";
  document.getElementById("stat-percent-text").textContent = "完成 " + stats.morePercent + "%";

  /* 沿用原有三个判断分支（无目标 / 已完成 / 已超出），仅把「N 分钟」改成「X 小时 Y 分」 */
  var remaining;
  if (!stats.moreHasTarget) {
    remaining = "设置目标后查看完成情况";
  } else {
    var diff = stats.moreTargetMinutes - stats.moreGoalMinutes;
    if (diff > 0) remaining = "还差 " + remainingText(diff);
    else if (diff === 0) remaining = "已完成目标";
    else remaining = "已超出 " + remainingText(-diff);
  }
  document.getElementById("stat-remaining").textContent = remaining;
  /* 其中事来则应 XX 分钟：没有事来则应记录时不显示 */
  var choreLine = document.getElementById("stat-chore-line");
  if (choreLine) {
    if (stats.choreMinutes > 0) {
      choreLine.textContent = "其中事来则应 " + stats.choreMinutes + " 分钟";
      choreLine.style.display = "";
    } else {
      choreLine.textContent = "";
      choreLine.style.display = "none";
    }
  }
  /* 8px 细进度条：宽度 = min(ratio,1)*100%；超额按满格显示，百分比数字照实（如 120%） */
  var fill = document.getElementById("stat-progress-fill");
  if (fill) fill.style.width = (Math.min(Math.max(0, stats.moreRatio), 1) * 100) + "%";
}

/* -------------------- 今日时间分布（纯增量：只读 stats，不改任何统计口径） -------------------- */
/** 当天分钟偏移 → HH:MM（1440 显示为 24:00） */
function timelineClock(min) {
  var m = Math.max(0, Math.min(1440, Math.round(min)));
  return pad2(Math.floor(m / 60)) + ":" + pad2(m % 60);
}
/** 相对某格的宽度百分比（保留 1 位小数，避免浮点长串） */
function tlPct(v) { return Math.round((v / 60) * 1000) / 10; }

/**
 * 把今天所有记录段裁剪到 [0,1440) 分钟偏移，并求「活动区间」内的空白。
 * 活动区间 = 今天第一条记录的起点 → 最后一条记录的终点（clamp 到当天）；
 * 空白 = 活动区间内未被任何记录覆盖的区间（重叠段先合并再求补集）。
 * 纯函数：不改 state、不写存储、不参与完成率/合计/CSV/记录卡的任何计算。
 */
function computeTimeline(stats, dayKey, now) {
  var midnight = midnightOf(dayKey);
  var recs = (stats && Array.isArray(stats.records)) ? stats.records : [];
  var segs = [];
  for (var i = 0; i < recs.length; i++) {
    var r = recs[i], s = r.segment;
    if (!s) continue;
    var endTs = (s.end === null || s.end === undefined) ? now : s.end;
    var a = Math.max(0, (s.start - midnight) / 60000);
    var b = Math.min(1440, (endTs - midnight) / 60000);
    if (!(b > a)) continue;
    segs.push({
      start: a, end: b,
      color: r.colorHex || colorOf(r.project && r.project.colorIndex),
      name: r.projectName || (r.project && r.project.name) || "",
      isRunning: (s.endType === "running" || s.end === null || s.end === undefined)
    });
  }
  segs.sort(function (x, y) { return x.start - y.start; });
  var activeStart = 1440, activeEnd = 0;
  for (var k = 0; k < segs.length; k++) {
    if (segs[k].start < activeStart) activeStart = segs[k].start;
    if (segs[k].end > activeEnd) activeEnd = segs[k].end;
  }
  var hasActive = segs.length > 0 && activeEnd > activeStart;
  /* 合并重叠的覆盖区间 */
  var covered = [];
  for (var m = 0; m < segs.length; m++) {
    var cur = { start: segs[m].start, end: segs[m].end };
    var last = covered.length ? covered[covered.length - 1] : null;
    if (last && cur.start <= last.end) {
      if (cur.end > last.end) last.end = cur.end;
    } else covered.push(cur);
  }
  /* 只在活动区间内求补集：区间外（凌晨/深夜）不算「需要关注的空白」 */
  var blanks = [], cursor = activeStart;
  for (var n = 0; n < covered.length; n++) {
    if (covered[n].start > cursor) blanks.push({ start: cursor, end: covered[n].start });
    if (covered[n].end > cursor) cursor = covered[n].end;
  }
  if (hasActive && cursor < activeEnd) blanks.push({ start: cursor, end: activeEnd });
  var blankTotal = 0, longest = null;
  for (var q = 0; q < blanks.length; q++) {
    var len = blanks[q].end - blanks[q].start;
    blankTotal += len;
    if (!longest || len > (longest.end - longest.start)) longest = blanks[q];
  }
  return {
    segs: segs, blanks: blanks, activeStart: activeStart, activeEnd: activeEnd,
    hasActive: hasActive, longestBlank: longest,
    blankTotal: blanks.length ? Math.max(1, Math.round(blankTotal)) : 0
  };
}

/** 渲染 24 格时间轴 + 图例 + 活动区间空白小字 + 点击展开的小时明细 */
function renderTimeline(stats, dayKey, now) {
  var track = document.getElementById("timeline-track");
  if (!track) return;
  var t = computeTimeline(stats, dayKey, now);
  var html = "";
  for (var h = 0; h < 24; h++) {
    var lo = h * 60, hi = lo + 60, blocks = "";
    /* 先铺活动区间内的空白斜纹，再铺记录色块（色块自然盖在斜纹之上） */
    for (var b = 0; b < t.blanks.length; b++) {
      var g0 = Math.max(t.blanks[b].start, lo), g1 = Math.min(t.blanks[b].end, hi);
      if (g1 > g0) blocks += '<span class="tl-gap" style="left:' + tlPct(g0 - lo) +
        '%;width:' + tlPct(g1 - g0) + '%"></span>';
    }
    var inHour = 0;
    for (var i = 0; i < t.segs.length; i++) {
      var sg = t.segs[i];
      var s0 = Math.max(sg.start, lo), e0 = Math.min(sg.end, hi);
      if (e0 > s0) {
        inHour++;
        blocks += '<span class="tl-blk" style="left:' + tlPct(s0 - lo) +
          '%;width:' + tlPct(e0 - s0) + '%;background:' + esc(sg.color) + '"></span>';
      }
    }
    var open = (timelineHour === h);
    html += '<button type="button" class="tl-cell' + (open ? ' is-open' : '') + '"' +
      ' data-action="toggle-hour" data-hour="' + h + '"' +
      ' aria-expanded="' + (open ? 'true' : 'false') + '"' +
      ' aria-label="' + timelineClock(lo) + '–' + timelineClock(hi) + '，' + inHour + ' 段记录，点击查看">' +
      blocks + '</button>';
  }
  track.innerHTML = html;

  /* 图例：今天出现过记录的项目（按名称+颜色去重）+ 空白 */
  var legend = document.getElementById("timeline-legend");
  if (legend) {
    var seen = {}, items = "";
    for (var g = 0; g < t.segs.length; g++) {
      var key = t.segs[g].name + "|" + t.segs[g].color;
      if (seen[key]) continue;
      seen[key] = true;
      items += '<span><i style="background:' + esc(t.segs[g].color) + '"></i>' + esc(t.segs[g].name) + '</span>';
    }
    if (t.blanks.length) items += '<span><i class="tl-gap-mark"></i>空白</span>';
    legend.innerHTML = items;
  }

  /* 空白小字：活动区间口径，区间外时段不计入 */
  var blankEl = document.getElementById("timeline-blank");
  if (blankEl) {
    if (!t.hasActive) {
      blankEl.textContent = "";
      blankEl.style.display = "none";
    } else {
      var txt = "活动区间 " + timelineClock(t.activeStart) + "–" + timelineClock(t.activeEnd);
      if (t.blankTotal > 0) {
        txt += " · 空白 " + remainingText(t.blankTotal);
        if (t.longestBlank) txt += " · 最长 " + timelineClock(t.longestBlank.start) +
          "–" + timelineClock(t.longestBlank.end);
      } else txt += " · 没有空白";
      blankEl.textContent = txt;
      blankEl.style.display = "";
    }
  }

  /* 点击展开的小时明细：该小时内的记录段 + 活动区间内的空白 */
  var detail = document.getElementById("timeline-detail");
  if (detail) {
    if (timelineHour === null) {
      detail.innerHTML = "";
      detail.style.display = "none";
    } else {
      var h2 = timelineHour, lo2 = h2 * 60, hi2 = lo2 + 60, rows = "", count = 0;
      for (var r2 = 0; r2 < t.segs.length; r2++) {
        var sg2 = t.segs[r2];
        var s2 = Math.max(sg2.start, lo2), e2 = Math.min(sg2.end, hi2);
        if (!(e2 > s2)) continue;
        count++;
        rows += '<div class="tl-detail-row">' +
          '<span class="dot" style="background:' + esc(sg2.color) + '"></span>' +
          '<span class="tl-detail-name">' + esc(sg2.name) + '</span>' +
          '<span class="tl-detail-time">' + timelineClock(s2) + '–' +
            (sg2.isRunning ? "现在" : timelineClock(e2)) + '</span>' +
          '<span class="tl-detail-min">' + Math.max(1, Math.round(e2 - s2)) + ' 分</span>' +
          '</div>';
      }
      for (var b2 = 0; b2 < t.blanks.length; b2++) {
        var s3 = Math.max(t.blanks[b2].start, lo2), e3 = Math.min(t.blanks[b2].end, hi2);
        if (e3 > s3) rows += '<div class="tl-detail-row tl-detail-gap">' +
          '<span class="dot tl-gap-dot"></span>' +
          '<span class="tl-detail-name">空白</span>' +
          '<span class="tl-detail-time">' + timelineClock(s3) + '–' + timelineClock(e3) + '</span>' +
          '<span class="tl-detail-min">' + Math.max(1, Math.round(e3 - s3)) + ' 分</span>' +
          '</div>';
      }
      detail.innerHTML = '<div class="tl-detail-title">' + timelineClock(lo2) + '–' +
        timelineClock(hi2) + ' · ' + count + ' 段记录</div>' +
        (rows || '<div class="tl-empty">这一小时没有记录</div>') +
        '<div class="tl-detail-foot">' +
          '<button class="tl-detail-close" data-action="toggle-hour" data-hour="' + h2 + '">收起</button>' +
          '<button class="tl-add-btn" data-action="add-hour-record" data-hour="' + h2 + '">＋ 补记一段时间</button>' +
        '</div>';
      detail.style.display = "";
    }
  }
  var hint = document.getElementById("timeline-hint");
  if (hint) hint.textContent = (timelineHour === null) ? "点格子看这一小时" : "再点一次收起";
}

/* 项目行内只放「开始」小胶囊；计时中的「中断 / 结束」上浮到状态条活动卡（方案 A）。
 * 按钮文案统一为「开始」：不再按当天是否已有记录切换，动作始终为 data-action="start"（新开一段）。 */
function actionsHTML(pid, isRunning, hasSegments) {
  if (isRunning) return "";
  return '<button class="btn btn-primary" data-action="start" data-id="' + esc(pid) + '">开始</button>';
}

/** 组标题右侧汇总小字：more「已投入 X / 目标 Y」，less「已用 X 分 / 上限 Y 分」，
 *  flow「已记 X · N 项」（系统「事来则应」不并入组的汇总统计） */
function groupSummaryText(group, minutesByPid, list) {
  var used = 0, target = 0, limit = 0;
  for (var i = 0; i < list.length; i++) {
    var p = list[i];
    used += minutesByPid[p.id] || 0;
    if (group === GROUP_MORE) {
      if (typeof p.targetMinutes === "number" && Number.isFinite(p.targetMinutes) && p.targetMinutes > 0) target += p.targetMinutes;
    } else if (group === GROUP_LESS && typeof p.dailyLimit === "number" && Number.isFinite(p.dailyLimit) && p.dailyLimit > 0) {
      limit += p.dailyLimit;
    }
  }
  if (group === GROUP_FLOW) {
    return "已记 " + remainingText(used) + " · " + list.length + " 项";
  }
  if (group === GROUP_MORE) {
    return "已投入 " + remainingText(used) + " / 目标 " + (target > 0 ? remainingText(target) : "未设置");
  }
  return "已用 " + used + " 分 / 上限 " + (limit > 0 ? limit + " 分" : "未设置");
}

/** 圆形图标：more / less 两组统一环形进度；more 按「已投入/目标」填充（达标保持满环、不变红），
 *  less 按「已用/上限」填充（超额红环填满）；未设目标/上限显示虚线加号；
 *  事来则应与「如实知见」组不显示任何圆形图标 */
function goalOrbHTML(p, limitByPid, minutesByPid) {
  var g = groupOf(p);
  if (g === null || g === GROUP_FLOW) return ""; /* 系统「事来则应」样式与规则全部不变；如实知见组不显示圆形图标 */
  var pid = esc(p.id), color = projectColor(p);
  if (g === GROUP_LESS) {
    var lr = limitByPid[p.id] || { limit: null, used: 0, over: 0 };
    if (!lr.limit) {
      return '<button class="goal-orb orb-empty" data-action="target" data-id="' + pid +
        '" aria-label="设置每日上限">＋</button>';
    }
    var over = lr.over > 0;
    /* 环形进度：按 已用/上限 填充；超额时填满整环并变红 */
    var deg = over ? 360 : Math.min(360, Math.round((lr.used / lr.limit) * 360));
    return '<button class="goal-orb orb-ring' + (over ? " orb-over" : "") + '" data-action="target" data-id="' + pid +
      '" style="--orb:' + color + ';--ring-deg:' + deg + 'deg" aria-label="设置每日上限">' +
      '<span class="ring-core">' +
        '<span class="ring-num">' + lr.used + '</span>' +
        '<span class="ring-sub">/' + lr.limit + '</span>' +
      '</span></button>';
  }
  var tm = (typeof p.targetMinutes === "number" && Number.isFinite(p.targetMinutes) && p.targetMinutes > 0) ? p.targetMinutes : 0;
  if (tm <= 0) {
    return '<button class="goal-orb orb-empty" data-action="target" data-id="' + pid +
      '" aria-label="设置每日目标">＋</button>';
  }
  /* 环形进度：按 今日已投入/目标 填充；多多益善达标后保持满环，不变红 */
  var used = Math.max(0, Math.floor(Number((minutesByPid && minutesByPid[p.id]) || 0)));
  var deg = Math.min(360, Math.round((used / tm) * 360));
  return '<button class="goal-orb orb-ring" data-action="target" data-id="' + pid +
    '" style="--orb:' + color + ';--ring-deg:' + deg + 'deg" aria-label="设置每日目标 · 目标 ' + esc(formatOrbTarget(tm)) + '">' +
    '<span class="ring-core">' +
      '<span class="ring-num">' + used + '</span>' +
      '<span class="ring-sub">/' + tm + '</span>' +
    '</span></button>';
}

/** 单张项目卡片：沿用原有单行结构，只按组决定圆形图标与右侧小字；无记录时右侧首行留空 */
function projectCardHTML(p, bucket, minutesByPid, limitByPid, running, dayKey, useCounts) {
  var segs = Array.isArray(bucket[p.id]) ? bucket[p.id] : [];
  var hasSegments = segs.length > 0;
  var isRunning = !!running && running.projectId === p.id;
  var lastInt = lastInterruptionFor(state, dayKey, p.id);
  var pid = esc(p.id);
  /* v0.3G：次数徽标放进右侧「今日合计」列，不参与 .proj-top 的 flex 伸缩，
     否则 320px 窄屏下唯一可收缩的 .proj-name 会被挤没。系统项目不显示。 */
  var usesHTML = "";
  if (!isChoreProject(p) && useCounts) {
    var usesN = useCounts[p.id] || 0;
    usesHTML = '<span class="proj-uses" title="累计调用 ' + usesN + ' 次">累计 ' + usesN + ' 次</span>';
  }
  /* more 组 / 事来则应不显示任何上限相关信息；「上次中断」位置规则不变 */
  var limitRow = (groupOf(p) === GROUP_LESS) ? limitByPid[p.id] : null;
  return '<div class="project-card" data-project-id="' + pid + '" style="--accent:' + projectColor(p) + '">' +
    '<div class="proj-stripe"></div>' +
    '<div class="proj-body">' +
      '<div class="proj-top">' +
        '<span class="proj-name ellipsis">' + esc(p.name) + '</span>' +
        '<span class="proj-actions">' + actionsHTML(p.id, isRunning, hasSegments) + '</span>' +
        '<span class="proj-spacer"></span>' +
        goalOrbHTML(p, limitByPid, minutesByPid) +
        '<span class="proj-today">' +
          usesHTML +
          '<span class="proj-today-main">' + (hasSegments ? "今日合计 " + formatMinutes(minutesByPid[p.id] || 0) : "") + '</span>' +
          '<span class="today-sub">' + limitNoteHTML(limitRow, lastInt) + '</span>' +
        '</span>' +
        '<button class="icon-btn menu-btn" data-action="menu" data-id="' + pid + '" aria-label="项目菜单">⋯</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

/* ---------- 项目折叠（v0.3E） ----------
 * 每组常驻显示前 GROUP_VISIBLE_COUNT 项，进行中的项目即使在折叠区也强制可见。
 * expandedGroups 是纯 UI 状态：只在内存里，刷新回到收起，不写 state / localStorage / 同步。 */
var GROUP_VISIBLE_COUNT = 3;
var expandedGroups = {};

function toggleGroupExpanded(group) {
  expandedGroups[group] = !expandedGroups[group];
  /* 只重绘项目列表，其他模块位置完全不动（与「今日记录」折叠同一套路） */
  var now = Date.now(), dk = dayKeyOf(now);
  renderProjectList(computeDayStats(state, dk, now), findRunningSegment(state), dk);
}

/* ---------- 项目搜索（v0.3F） ----------
 * searchQuery 是纯 UI 状态：只在内存里，刷新清空，不写 state / localStorage / 同步。
 * 搜索框是 #project-list 之外的静态 DOM，这里只局部重绘项目列表（与折叠按钮同一套路），
 * 因此边打字边过滤不会丢输入焦点，也不触发 save() / 同步钩子。 */
var SEARCH_MAX_RESULTS = 20;
var searchQuery = "";

function searchMatch(p, words) {
  var name = String(p.name || "").toLowerCase();
  for (var i = 0; i < words.length; i++) {
    if (name.indexOf(words[i]) < 0) return false;
  }
  return true;
}

function refreshProjectList() {
  var now = Date.now(), dk = dayKeyOf(now);
  renderProjectList(computeDayStats(state, dk, now), findRunningSegment(state), dk);
}

function setSearchQuery(raw) {
  searchQuery = String(raw || "").trim();
  var box = document.getElementById("proj-search");
  if (box) box.classList.toggle("has-value", searchQuery.length > 0);
  refreshProjectList();
}

function clearSearch() {
  var input = document.getElementById("proj-search-input");
  if (input) input.value = "";
  setSearchQuery("");
  if (input) { try { input.focus(); } catch (e) {} }
}

function renderProjectList(stats, running, dayKey) {
  var host = document.getElementById("project-list");
  var projects = orderedProjectsForDisplay();
  var useCounts = useCountMap();   /* v0.3G：一次遍历供所有卡片复用，纯读 */
  var bucket = (state.days && state.days[dayKey]) || {};
  var minutesByPid = {};
  for (var m = 0; m < stats.perProject.length; m++) minutesByPid[stats.perProject[m].projectId] = stats.perProject[m].minutes;
  var limitByPid = {};
  var lrows = limitRowsForDay(dayKey, stats.now);
  for (var li = 0; li < lrows.length; li++) limitByPid[lrows[li].projectId] = lrows[li];

  /* 搜索模式（v0.3F）：忽略分组标题与每组 3 项折叠，跨三组平铺所有名称匹配项。
     清空关键词立刻回到原有分组 + 折叠视图，expandedGroups 的展开状态原样保留。 */
  if (searchQuery) {
    var words = searchQuery.toLowerCase().split(/\s+/).filter(function (w) { return !!w; });
    var hits = [];
    for (var qi = 0; qi < projects.length; qi++) {
      if (searchMatch(projects[qi], words)) hits.push(projects[qi]);
    }
    var sr;
    if (hits.length === 0) {
      sr = '<div class="proj-search-empty">没有找到「' + esc(searchQuery) + '」' +
        '<span class="empty-hint">换个词试试，或清空搜索后新建项目</span></div>';
    } else {
      sr = '<div class="proj-search-result">找到 ' + hits.length + ' 项' +
        (hits.length > SEARCH_MAX_RESULTS
          ? ' · 仅显示前 ' + SEARCH_MAX_RESULTS + ' 项，补充关键词可缩小范围' : '') +
        '</div><div class="group-cards">';
      for (var hk = 0; hk < Math.min(hits.length, SEARCH_MAX_RESULTS); hk++) {
        sr += projectCardHTML(hits[hk], bucket, minutesByPid, limitByPid, running, dayKey, useCounts);
      }
      sr += '</div>';
    }
    host.innerHTML = sr;
    return;
  }

  /* 按现有显示顺序过滤分组：组内相对顺序与升级前完全一致，不重新排序 */
  var more = [], less = [], flow = [], chore = [];
  for (var i = 0; i < projects.length; i++) {
    var g = groupOf(projects[i]);
    if (g === null) chore.push(projects[i]);
    else if (g === GROUP_LESS) less.push(projects[i]);
    else if (g === GROUP_FLOW) flow.push(projects[i]);
    else more.push(projects[i]);
  }

  function block(group, list, appendCards) {
    appendCards = appendCards || [];
    var html = '<div class="group-block">' +
      '<div class="group-head">' +
        '<span class="group-name">' + GROUP_LABEL[group] + '</span>' +
        '<span class="group-summary">' + esc(groupSummaryText(group, minutesByPid, list)) + '</span>' +
        '<button class="group-add" data-action="add-project-group" data-group="' + group +
          '" aria-label="在' + GROUP_LABEL[group] + '新建项目">＋</button>' +
      '</div>';
    if (list.length === 0 && appendCards.length === 0) {
      html += '<div class="group-empty">还没有项目</div>';
    } else {
      if (list.length > 0) {
        /* 折叠：按现有顺序取前 N 项；进行中的项目即使在折叠区也强制可见（否则点不到停止）。
           组内相对顺序、组汇总（用完整 list 计算）都不变，只改画出来的卡片数量。 */
        var isOpen = expandedGroups[group] === true;
        var shown = [], hiddenCount = 0, si;
        if (isOpen) {
          shown = list;
        } else {
          for (si = 0; si < list.length; si++) {
            var runningHere = !!running && running.projectId === list[si].id;
            /* v0.3G：新建 / 移动后的高亮项目也强制可见。热度排序下 0 次项目会沉进折叠区，
               若卡片不生成，applyReveal() 的浅蓝高亮与自动滚动都会失效。 */
            var revealingHere = !!revealPid && list[si].id === revealPid;
            if (si < GROUP_VISIBLE_COUNT || runningHere || revealingHere) shown.push(list[si]);
            else hiddenCount++;
          }
        }
        html += '<div class="group-cards">';
        for (var k = 0; k < shown.length; k++) {
          html += projectCardHTML(shown[k], bucket, minutesByPid, limitByPid, running, dayKey, useCounts);
        }
        /* 超过 N 项才有按钮；展开态显示「收起」。系统项目在下方 chore-cards，不参与折叠 */
        if (list.length > GROUP_VISIBLE_COUNT) {
          html += '<button type="button" class="group-more' + (isOpen ? ' open' : '') +
            '" data-action="toggle-group-more" data-group="' + group + '">' +
            (isOpen
              ? '<span>⋯</span><span>收起</span><span class="gm-arrow">⌃</span>'
              : '<span>⋯</span><span>还有 <span class="gm-count">' + hiddenCount +
                '</span> 项</span><span class="gm-arrow">›</span>') +
            '</button>';
        }
        html += '</div>';
      }
      /* 系统「事来则应」视觉上归入「如实知见」组、作为该组最后一张卡片；
         身份不变（groupOf=null、系统项、样式与规则全部不变） */
      if (appendCards.length > 0) {
        html += '<div class="chore-cards">';
        for (var c = 0; c < appendCards.length; c++) {
          html += projectCardHTML(appendCards[c], bucket, minutesByPid, limitByPid, running, dayKey, useCounts);
        }
        html += '</div>';
      }
    }
    return html + '</div>';
  }

  var html = block(GROUP_MORE, more) + block(GROUP_LESS, less) + block(GROUP_FLOW, flow, chore);
  /* 完全没有项目时保留原有空状态入口，不删功能 */
  if (projects.length === 0) {
    html = '<div class="empty-block">还没有项目' +
      '<span class="empty-hint">先建一个项目，就能开始记录时间了</span>' +
      '<button class="empty-action" data-action="add-project">＋ 新建项目</button></div>';
  }
  host.innerHTML = html;
}

function renderRecordList(stats) {
  var host = document.getElementById("record-list");
  var head = document.getElementById("records-head-action");
  if (head) head.innerHTML = "";
  if (stats.records.length === 0) {
    host.innerHTML = '<div class="empty-block">今天还没有记录' +
      '<span class="empty-hint">去上方「我的项目」点「开始」就能记下第一段时间</span></div>';
    return;
  }
  var total = stats.records.length;
  /* 默认只显示最近 5 条（computeDayStats 已按 start 从新到旧排序）；展开/收起不改任何数据 */
  var visible = (recordsExpanded || total <= RECORDS_PAGE_SIZE) ? total : RECORDS_PAGE_SIZE;
  var html = "";
  for (var i = 0; i < visible; i++) {
    var rec = stats.records[i];
    var seg = rec.segment;
    var isRunning = (seg.endType === "running" || seg.end === null || seg.end === undefined);
    var timeText = formatTime(seg.start) + "–" + (isRunning ? "现在" : formatTime(seg.end));
    var tag = isRunning ? '<span class="tag tag-running">计时中</span>'
      : (seg.endType === "interrupted" ? '<span class="tag">中断</span>' : "");
    /* 备注小灰字标签 + 承接来源标记 + 超 8 字折叠 */
    var note = (typeof seg.note === "string") ? seg.note : "";
    var src = (typeof seg.sourceProject === "string") ? seg.sourceProject : "";
    var longNote = noteChars(note).length > 8;
    var expanded = !!expandedNoteIds[seg.id];
    var noteLabel = (longNote && !expanded) ? noteShort(note) : note;
    var noteHTML = note
      ? '<span class="rec-note">' + esc(noteLabel) +
        (longNote ? '<span class="rec-note-hint">' + (expanded ? " 收起" : " 展开") + '</span>' : "") +
        '</span>'
      : "";
    var fromHTML = src ? '<span class="rec-from">← ' + esc(src) + '</span>' : "";
    var rowAttrs = longNote
      ? ' class="record-row rec-expandable" data-action="toggle-note" data-id="' + esc(seg.id) + '"'
      : ' class="record-row"';
    html += '<div' + rowAttrs + '>' +
      '<span class="dot" style="background:' + (rec.colorHex || colorOf(rec.project.colorIndex)) + '"></span>' +
      '<div class="rec-main">' +
        '<div class="rec-line1">' +
          '<span class="rec-name ellipsis">' + esc(rec.project.name) + '</span>' +
          '<span class="rec-time">' + timeText + '</span>' +
        '</div>' +
        '<div class="rec-line2">' + rec.minutes + ' 分钟' + tag + fromHTML + noteHTML + '</div>' +
      '</div>' +
      '<div class="rec-btns">' +
        (isRunning ? "" : '<button class="icon-btn rec-edit" data-action="edit-record" data-id="' + esc(seg.id) + '" aria-label="编辑本段">✎</button>') +
        '<button class="icon-btn rec-del" data-action="delete-record" data-id="' + esc(seg.id) + '" aria-label="删除本段">×</button>' +
      '</div>' +
    '</div>';
  }
  if (total > RECORDS_PAGE_SIZE) {
    if (head) head.innerHTML = '<button class="head-action" data-action="toggle-records">' +
      (recordsExpanded ? "收起" : "查看全部") + '</button>';
    html += '<button class="records-toggle" data-action="toggle-records">' +
      (recordsExpanded ? "收起" : "展开全部（共 " + total + " 条）") + '</button>';
  }
  host.innerHTML = html;
}

/* -------------------- 历史记录（只读查看 + 按北京时间的日期选择） -------------------- */

/** 当前查看的日期：纯 UI 状态，不写入 state / localStorage */
var historyDayKey = null;

function normalizeHistoryDate(v) {
  var t = String(v === null || v === undefined ? "" : v).trim();
  if (!isValidDayKey(t)) return null;
  var today = bjTodayKey();
  return t > today ? today : t;
}

/** 前后翻一天：next 不超过北京时间今天；只重绘历史卡片，不动其他模块 */
function shiftHistoryDay(n) {
  var base = historyDayKey || bjTodayKey();
  var next = shiftDayKey(base, n);
  var today = bjTodayKey();
  if (next > today) next = today;
  historyDayKey = next;
  renderHistory();
}

/** 历史记录「＋ 记一段」：日期预填为当前查看的那一天 */
function openHistoryAddModal() {
  openAddHourRecordModal(null, historyDayKey || bjTodayKey());
}

/**
 * 渲染历史记录卡片：按所选日期读取 state.days[dayKey]，展示每段的
 * 项目 / 起止时间 / 时长 / 备注与来源；无记录的日期显示「暂无记录」。
 * 只读，不改任何数据；与今日记录列表、统计、CSV 完全独立。
 */
function renderHistory() {
  var pick = document.getElementById("history-date");
  var label = document.getElementById("history-label");
  var sum = document.getElementById("history-summary");
  var list = document.getElementById("history-list");
  if (!list) return;
  var today = bjTodayKey();
  if (!historyDayKey || !isValidDayKey(historyDayKey)) historyDayKey = today;
  if (historyDayKey > today) historyDayKey = today;
  if (pick) { pick.value = historyDayKey; pick.max = today; }
  var prevBtn = document.getElementById("history-prev");
  var nextBtn = document.getElementById("history-next");
  if (nextBtn) nextBtn.disabled = (historyDayKey >= today);
  if (prevBtn) prevBtn.disabled = false;
  if (label) label.textContent = bjDayLabel(historyDayKey);
  var now = Date.now();
  var stats = computeDayStats(state, historyDayKey, now);
  if (sum) {
    sum.textContent = stats.records.length
      ? ("共 " + stats.records.length + " 段 · 合计 " + remainingText(stats.totalMinutes))
      : "";
  }
  if (stats.records.length === 0) {
    list.innerHTML = '<div class="hist-empty">暂无记录' +
      '<span class="hist-empty-hint">可点右上「＋ 记一段」补填这一天，或换一个日期</span></div>';
    return;
  }
  /* 按时间从早到晚展示（computeDayStats 的 records 是 start 降序） */
  var recs = stats.records.slice().reverse();
  var html = "";
  for (var i = 0; i < recs.length; i++) {
    var rec = recs[i], seg = rec.segment;
    var isRunning = (seg.endType === "running" || seg.end === null || seg.end === undefined);
    var timeText = formatTime(seg.start) + "–" + (isRunning ? "现在" : formatTime(seg.end));
    var tag = isRunning ? '<span class="tag tag-running">计时中</span>'
      : (seg.endType === "interrupted" ? '<span class="tag">中断</span>' : "");
    var note = (typeof seg.note === "string") ? seg.note : "";
    var src = (typeof seg.sourceProject === "string") ? seg.sourceProject : "";
    var noteHTML = note ? '<span class="rec-note">' + esc(note) + '</span>' : "";
    var fromHTML = src ? '<span class="rec-from">← ' + esc(src) + '</span>' : "";
    html += '<div class="record-row">' +
      '<span class="dot" style="background:' + (rec.colorHex || colorOf(rec.project.colorIndex)) + '"></span>' +
      '<div class="rec-main">' +
        '<div class="rec-line1">' +
          '<span class="rec-name ellipsis">' + esc(rec.project.name) + '</span>' +
          '<span class="rec-time">' + timeText + '</span>' +
        '</div>' +
        '<div class="rec-line2">' + rec.minutes + ' 分钟' + tag + fromHTML + noteHTML + '</div>' +
      '</div>' +
    '</div>';
  }
  list.innerHTML = html;
}

/** change 事件委托：只处理日期选择器（click / keydown 委托保持不变） */
function onDocumentChange(e) {
  var t = e.target;
  if (!t || !t.id) return;
  if (t.id === "history-date") {
    var dk = normalizeHistoryDate(t.value);
    if (!dk) { t.value = historyDayKey || bjTodayKey(); return; }
    historyDayKey = dk;
    renderHistory();
  }
}

/** input 事件委托：项目搜索框边打字边过滤（v0.3F）；其它输入框不受影响 */
function onDocumentInput(e) {
  var t = e.target;
  if (!t || t.id !== "proj-search-input") return;
  setSearchQuery(t.value);
}

/** 一次 render 只取一次 now，向下传递，保证所有合计同源 */
function render() {
  var now = Date.now();
  var dayKey = dayKeyOf(now);
  var stats = computeDayStats(state, dayKey, now);
  var running = findRunningSegment(state);
  renderHeader();
  renderStatusBar(running);
  renderOverview(stats);
  renderTimeline(stats, dayKey, now);
  renderProjectList(stats, running, dayKey);
  renderRecordList(stats);
  renderLimitSummary(dayKey, now);
  renderHistory();
  applyReveal();
}

/* -------------------- 五、事件与业务流程 -------------------- */

function startTimer(pid) {
  if (!getProject(pid)) return;
  var now = Date.now();
  syncRolloverForNow(now);
  var dayKey = dayKeyOf(now);
  var toastText = null;
  /* 全局最多一个进行中段：若别的项目正在计时，系统代关（finished），不弹窗、不二次确认 */
  var guard = 0;
  while (guard++ < 20) {
    var running = findRunningSegment(state);
    if (!running || running.projectId === pid) break;
    var closedProject = getProject(running.projectId);
    var mins = minutesOfSegment(running.seg, now);
    if (isChoreProject(closedProject)) {
      /* 事来则应被代关：不弹窗，顶部状态条浮现一行「事来则应已记录 XX 分钟」 */
      showChoreNotice("事来则应已记录 " + mins + " 分钟");
    } else if (!toastText && closedProject) {
      toastText = "《" + closedProject.name + "》已记录 " + mins + " 分钟";
    }
    closeRunningAt(running, now, "finished");
  }
  var still = findRunningSegment(state);
  if (still && still.projectId === pid) { save(); render(); return; } /* 防御：不重复开段 */
  var b = ensureBucket(state.days, dayKey, pid);
  b.push({ id: newId("s"), start: now, end: null, endType: "running", note: "", sourceProject: "" });
  state.currentDayKey = dayKey;
  save();
  render();
  if (toastText) showToast(toastText);
}

function stopTimer(pid, endType) {
  var now = Date.now();
  syncRolloverForNow(now);
  var running = findRunningSegment(state);
  if (running && running.projectId === pid) closeRunningAt(running, now, endType);
  state.currentDayKey = dayKeyOf(now);
  save();
  render();
  /* 结束那一刻：若今天累计超过上限，顶部橙条提示一次（只提示，不阻断） */
  checkLimitNotice(pid, dayKeyOf(now), now, true);
}

function deleteRecordById(segId) {
  var now = Date.now();
  syncRolloverForNow(now);
  var dayKey = dayKeyOf(now);
  var bucket = (state.days && state.days[dayKey]) || {};
  var pids = Object.keys(bucket);
  for (var i = 0; i < pids.length; i++) {
    var arr = bucket[pids[i]];
    if (!Array.isArray(arr)) continue;
    var idx = -1;
    for (var j = 0; j < arr.length; j++) if (arr[j].id === segId) { idx = j; break; }
    if (idx >= 0) {
      arr.splice(idx, 1);
      if (arr.length === 0) delete bucket[pids[i]];
      break;
    }
  }
  if (Object.keys(bucket).length === 0 && state.days) delete state.days[dayKey];
  state.currentDayKey = dayKey;
  save();
  render();
}

function deleteProjectById(pid) {
  if (isSystemChore(getProject(pid))) return; /* 系统项目「事来则应」不可删除 */
  var now = Date.now();
  syncRolloverForNow(now);
  state.projects = (Array.isArray(state.projects) ? state.projects : []).filter(function (p) { return p.id !== pid; });
  var days = state.days || {};
  var dks = Object.keys(days);
  for (var i = 0; i < dks.length; i++) {
    if (days[dks[i]] && days[dks[i]][pid]) delete days[dks[i]][pid];
    if (days[dks[i]] && Object.keys(days[dks[i]]).length === 0) delete days[dks[i]];
  }
  state.currentDayKey = dayKeyOf(now);
  save();
  render();
}

function onDocumentClick(e) {
  var target = (e.target && typeof e.target.closest === "function") ? e.target : null;
  if (!target) return;
  var menuEl = target.closest(".proj-menu");
  var isMenuBtn = !!target.closest('[data-action="menu"]');
  if (!menuEl && !isMenuBtn) closeProjMenu();

  var el = target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  var id = el.getAttribute("data-id");
  switch (action) {
    case "edit-nickname": openNicknameModal(); break;
    case "add-project": openGroupChoiceModal(); break;
    case "add-project-group": openProjectModal(el.getAttribute("data-group")); break;
    case "toggle-group-more": toggleGroupExpanded(el.getAttribute("data-group")); break;
    case "toggle-sort-mode": toggleSortMode(); break;
    case "search-clear": clearSearch(); break;
    case "choose-group":
      closeModal();
      openProjectModal(el.getAttribute("data-group"));
      break;
    case "move-group":
      closeModal();
      moveProjectToGroup(el.getAttribute("data-pid"), el.getAttribute("data-group"));
      break;
    case "start": startTimer(id); break;
    case "interrupt": openInterruptSheet(id); break;
    case "finish": stopTimer(id, "finished"); break;
    case "menu": toggleProjMenu(id, el); break;
    case "menu-target": closeProjMenu(); openTargetModal(id); break;
    case "menu-move": closeProjMenu(); openMoveGroupModal(id); break;
    case "menu-delete": closeProjMenu(); openDeleteProjectModal(id); break;
    case "menu-clear-chore":
      closeProjMenu();
      openConfirmModal({
        title: "清空今日记录",
        message: "确定清空「事来则应」今天的所有记录吗？其他项目不受影响，且无法恢复。",
        confirmText: "清空", danger: true,
        onConfirm: function () { clearChoreToday(); }
      });
      break;
    case "target": openTargetModal(id); break;
    case "delete-record": openDeleteRecordModal(id); break;
    case "edit-record": openEditRecordModal(id); break;
    case "toggle-note": toggleNote(id); break;
    case "toggle-records": toggleRecordsExpanded(); break;
    case "toggle-hour": toggleTimelineHour(el.getAttribute("data-hour")); break;
    case "add-hour-record": openAddHourRecordModal(el.getAttribute("data-hour")); break;
    case "add-inline-new": toggleAddInlineNew(); break;
    case "add-inline-group": setAddInlineGroup(el.getAttribute("data-group")); break;
    case "history-add": openHistoryAddModal(); break;
    case "sync-open": openSyncModal(); break;
    case "sync-now": doSyncNow(); break;
    case "sync-save": saveSyncFromModal(); break;
    case "sync-off": disableSync(); break;
    case "sync-gen": fillRandomCode(); break;
    case "pair-open": openPairModal(); break;
    case "pair-copy": copyPairLink(); break;
    case "history-prev": shiftHistoryDay(-1); break;
    case "history-next": shiftHistoryDay(1); break;
    case "toggle-limit-summary":
      limitsExpanded = !limitsExpanded;
      renderLimitSummary(dayKeyOf(Date.now()), Date.now());
      break;
    case "generate-card": openCardPreview(); break;
    case "export-records": exportRecords(); break;
    case "set-unit": setTargetUnit(el.getAttribute("data-unit")); break;
    case "quick-value": applyTargetQuick(el.getAttribute("data-value"), el.getAttribute("data-unit")); break;
    case "skip-target": skipTargetSetting(id); break;
    case "modal-cancel": closeModal(); break;
    case "modal-confirm": handleModalConfirm(); break;
    case "modal-backdrop": closeModal(); break;
    case "save-image": saveCardImage(); break;
    default: break;
  }
}

function onDocumentKeydown(e) {
  if (e.key === "Escape") {
    closeProjMenu();
    if (sheetState) { var sp = sheetState.pid; closeSheet(); doInterrupt(sp, "only", ""); }
    else if (modalState) closeModal();
    else if (searchQuery) clearSearch();
  }
  if (e.key === "Enter" && modalState && modalState.kind !== "preview" && modalState.kind !== "pair") {
    var t = e.target;
    if (t && t.tagName === "INPUT") { e.preventDefault(); handleModalConfirm(); }
  }
}

/* -------------------- 六、弹层与 toast -------------------- */

var modalState = null;
var toastTimer = null;

function closeModal() {
  /* v0.3G：新建项目后紧接的「设置目标」面板会盖住浅蓝高亮（1.3s 就过期），
     关掉面板时重新高亮一次，避免热度排序下新项目沉进折叠区后看不见。 */
  var wasTargetPid = (modalState && modalState.kind === "target") ? targetModalPid : null;
  modalState = null;
  document.getElementById("modal-root").innerHTML = "";
  if (wasTargetPid) {
    markReveal(wasTargetPid);
    refreshProjectList();
    applyReveal();
  }
}

function openModalShell(panelHTML, config) {
  modalState = config;

function openMoveGroupModal(pid) {
  var p = getProject(pid);

  function subFor(g) {
    if (g === GROUP_LESS && hasTm) return "目标转上限 · " + formatOrbTarget(p.targetMinutes);
    if (g === GROUP_MORE && hasDl) return "上限转目标 · " + formatOrbTarget(p.dailyLimit);

function moveProjectToGroup(pid, g) {
  var p = getProject(pid);
  if (!p || isSystemChore(p)) return false;
  var ng = (g === GROUP_LESS || g === GROUP_FLOW) ? g : GROUP_MORE;
  if (ng === groupOf(p)) return false;
  var hasTm = (typeof p.targetMinutes === "number" && Number.isFinite(p.targetMinutes) && p.targetMinutes > 0);
  var hasDl = (typeof p.dailyLimit === "number" && Number.isFinite(p.dailyLimit) && p.dailyLimit > 0);
  /* 数值按原数搬：目标 <-> 上限互转；如实知见两个字段都清空（与加载时的规整规则一致） */
  if (ng === GROUP_LESS) {
    if (hasTm) p.dailyLimit = p.targetMinutes;
    p.targetMinutes = null;
  } else if (ng === GROUP_MORE) {
    if (hasDl) p.targetMinutes = p.dailyLimit;
    p.dailyLimit = null;
  } else {
    p.targetMinutes = null;
    p.dailyLimit = null;
  }
  p.group = ng;
  p.sortIndex = nextSortIndex();   /* 移入新组排在最前 */
  markReveal(pid);
  save(); render();
  showToast("《" + p.name + "》已移到「" + MOVE_GROUP_LABELS[ng] + "」");
  return true;
}

/* -------------------- 编辑记录时间（方案 A，增量新增） --------------------
   只读/原地改写现有段：不改 id / endType / sourceProject / 所属项目 / 不换桶；
   所有合计、完成率、超额、时间轴、CSV、记录卡均由 render() 从 state 实时现算，无需改动。*/

/** "HH:MM" → {h,m}；空 / 格式错 / 越界返回 null */
function parseClockHM(str) {
  var t = String(str === null || str === undefined ? "" : str).trim();
  var m = /^(\d{1,2}):(\d{2})$/.exec(t);
  if (!m) return null;
  var h = Number(m[1]), mm = Number(m[2]);
  if (h < 0 || h > 23 || mm < 0 || mm > 59) return null;
  return { h: h, m: mm };
}

/** 在「当天」桶里按段 id 定位（今日记录列表只渲染当天段）；只读，不改数据 */
function findSegmentById(segId, dayKey) {
  if (!segId || !dayKey) return null;
  var bucket = (state.days && state.days[dayKey]) || {};
  var pids = Object.keys(bucket);
  for (var i = 0; i < pids.length; i++) {
    var arr = bucket[pids[i]];
    if (!Array.isArray(arr)) continue;
    for (var j = 0; j < arr.length; j++) {
      if (arr[j] && arr[j].id === segId) {
        return { dayKey: dayKey, pid: pids[i], arr: arr, seg: arr[j], idx: j };
      }
    }
  }
  return null;
}

/** 编辑弹窗内实时预览：沿用 minutesOfSegment 的「不足 1 分钟按 1 分钟」口径 */
function refreshEditPreview() {
  var root = document.getElementById("modal-root");
  if (!root) return;
  var st = root.querySelector("#edit-start"), en = root.querySelector("#edit-end");
  var box = root.querySelector("#edit-preview");
  if (!st || !en || !box) return;
  var a = parseClockHM(st.value), b = parseClockHM(en.value);
  if (!a || !b) {
    box.textContent = "请填写开始和结束时间";
    box.className = "edit-preview invalid";
    return;
  }
  var diff = (b.h * 60 + b.m) - (a.h * 60 + a.m);
  if (diff <= 0) {
    box.textContent = "结束时间需晚于开始时间";
    box.className = "edit-preview invalid";
    return;
  }
  box.textContent = "修改后时长 " + Math.max(1, diff) + " 分钟";
  box.className = "edit-preview";
}

/** 打开「编辑这段时间」弹窗：同一个 openModalShell，两个 time 输入 + 备注 + 实时时长预览 */

/** 保存编辑：校验 → 原地写 start/end/note → 派生数字自动重算。
    校验：结束 > 开始、都在今天、结束不晚于现在；备注截断 50 字（与 sanitizeSegment 一致）。*/
function saveRecordEdit(segId, startStr, endStr, noteStr) {
  var now = Date.now();
  syncRolloverForNow(now);
  var dayKey = dayKeyOf(now);
  var found = findSegmentById(segId, dayKey);
  if (!found) { showModalError("这段记录已不可编辑，请刷新后重试"); return false; }
  var seg = found.seg;
  if (seg.endType === "running" || seg.end === null || seg.end === undefined) {
    showModalError("进行中的记录不能编辑，请先结束"); return false;
  }
  var a = parseClockHM(startStr), b = parseClockHM(endStr);
  if (!a || !b) { showModalError("请填写有效的开始和结束时间"); return false; }
  var midnight = midnightOf(dayKey);
  var startTs = midnight + (a.h * 60 + a.m) * 60000;
  var endTs = midnight + (b.h * 60 + b.m) * 60000;
  if (endTs <= startTs) { showModalError("结束时间必须晚于开始时间"); return false; }
  if (endTs > now) { showModalError("结束时间不能晚于现在"); return false; }
  var note = Array.from(String(noteStr === null || noteStr === undefined ? "" : noteStr)).slice(0, 50).join("");
  var pid = found.pid;
  /* 编辑前该项目超额量：用于「从没超额变超额」的橙条提示判断 */
  var before = limitRowsForDay(dayKey, now), oldOver = 0;
  for (var i = 0; i < before.length; i++) if (before[i].projectId === pid) { oldOver = before[i].over; break; }
  /* 原地改写，保持 id / endType / sourceProject / 所属项目 / 桶不变 */
  seg.start = startTs;
  seg.end = endTs;
  seg.note = note;
  state.currentDayKey = dayKey;
  save();
  render();
  /* 编辑后若「适可而止」项目从没超额变超额，弹一次橙色提示条（只提示，不阻断） */
  var p = getProject(pid);
  if (p && groupOf(p) === GROUP_LESS) {
    var after = limitRowsForDay(dayKey, now), newOver = 0;
    for (var j = 0; j < after.length; j++) if (after[j].projectId === pid) { newOver = after[j].over; break; }
    if (oldOver <= 0 && newOver > 0) showLimitNotice("《" + p.name + "》今天已超 " + newOver + " 分钟");
  }
  return true;
}

/* -------------------- 第十六轮：从空白小时「补记一段时间」（纯增量） -------------------- */

/** 补记默认时间段：该小时内最长的空白区间；结束 clamp 到「现在」；
    无空白 / 点了未来格子时回退为「现在前 30 分 → 现在」。纯计算，不改 state。 */
function defaultAddRange(hour, dayKey) {
  var now = Date.now();
  var dk = isValidDayKey(dayKey) ? dayKey : bjTodayKey();
  var lo = hour * 60, hi = lo + 60;
  /* 过去日期整天都可补记，不再 clamp 到「现在」；今天口径与原来完全一致 */
  var nowMin = (dk === bjTodayKey())
    ? Math.max(0, Math.min(1440, Math.floor((now - midnightOf(dk)) / 60000)))
    : 1440;
  var t = computeTimeline(computeDayStats(state, dk, now), dk, now);
  var best = null;
  for (var i = 0; i < t.blanks.length; i++) {
    var s0 = Math.max(t.blanks[i].start, lo), e0 = Math.min(t.blanks[i].end, hi);
    if (e0 > s0 && (!best || (e0 - s0) > (best.e - best.s))) best = { s: s0, e: e0 };
  }
  var a = best ? Math.round(best.s) : lo;
  var b = best ? Math.round(best.e) : hi;
  b = Math.min(b, nowMin);
  if (b <= a) {
    b = nowMin;
    a = Math.max(0, b - 30);
    if (b <= a) a = Math.max(0, b - 1);
  }
  return { start: timelineClock(a), end: timelineClock(b) };
}

/** 历史「＋ 记一段」的默认时段：所选日期活动区间内最长空白；全天空白回退 09:00–10:00。
    结束分钟 clamp 到 23:59，保证 <input type="time"> 拿到合法值。纯计算，不改 state。 */
function defaultAddRangeForDay(dayKey) {
  var now = Date.now();
  var dk = isValidDayKey(dayKey) ? dayKey : bjTodayKey();
  var t = computeTimeline(computeDayStats(state, dk, now), dk, now);
  var lb = t.longestBlank;
  if (lb) {
    var s = Math.max(0, Math.round(lb.start));
    var e = Math.min(1439, Math.round(lb.end));
    if (e > s) return { start: timelineClock(s), end: timelineClock(e) };
  }
  return { start: "09:00", end: "10:00" };
}

/* -------------------- 第二十一轮：补记弹窗内「直接新建项目」（纯增量） -------------------- */

/** 是否处于内联新建模式：由内联区 open class 判定，零额外状态，弹窗重建自动复位 */
function isAddInlineNew() {
  var box = document.getElementById("add-inline-box");
  return !!box && box.classList.contains("open");
}
/** 展开 / 收起内联新建区；展开时禁用项目下拉，避免「既选项目又填新名」的歧义 */
function toggleAddInlineNew() {
  var root = document.getElementById("modal-root");
  if (!root) return;
  var box = root.querySelector("#add-inline-box"),
      sel = root.querySelector("#add-project"),
      btn = root.querySelector("#add-inline-toggle"),
      input = root.querySelector("#add-new-name");
  if (!box) return;
  var open = !box.classList.contains("open");
  if (open) box.classList.add("open"); else box.classList.remove("open");
  if (sel) sel.disabled = open;
  if (btn) btn.textContent = open ? "收起新建项目" : "＋ 直接新建项目";
  if (open && input && typeof input.focus === "function") { try { input.focus(); } catch (e) {} }
}
/** 当前选中的新建分组：只读 DOM，默认「多多益善」 */
function currentAddInlineGroup() {
  var el = document.querySelector("#add-group-row .add-group-chip.active");
  var g = el ? el.getAttribute("data-group") : GROUP_MORE;
  return (g === GROUP_LESS || g === GROUP_FLOW) ? g : GROUP_MORE;
}
function setAddInlineGroup(g) {
  var ng = (g === GROUP_LESS || g === GROUP_FLOW) ? g : GROUP_MORE;
  var root = document.getElementById("modal-root");
  if (!root) return;
  var chips = root.querySelectorAll("#add-group-row .add-group-chip");
  for (var i = 0; i < chips.length; i++) {
    if (chips[i].getAttribute("data-group") === ng) chips[i].classList.add("active");
    else chips[i].classList.remove("active");
  }
}
/** 按现有 openProjectModal 同一套字段与校验创建一个项目，返回新 pid；
    失败显示弹窗红字并返回 null。不 save / 不 render，由 saveHourRecord 统一一次落盘。 */
function createProjectInline() {
  var root = document.getElementById("modal-root");
  if (!root) return null;
  var input = root.querySelector("#add-new-name");
  var name = String(input && input.value !== null && input.value !== undefined ? input.value : "").trim();
  if (name.length === 0) { showModalError("项目名称不能为空"); return null; }
  if (Array.from(name).length > 10) { showModalError("项目名称最多 10 个字"); return null; }
  if (isChoreName(name)) { showModalError("「" + CHORE_NAME + "」为系统项目，请换一个名字"); return null; }
  var ps = Array.isArray(state.projects) ? state.projects : [];
  var dup = ps.some(function (p) { return String(p.name).trim().toLowerCase() === name.toLowerCase(); });
  if (dup) { showModalError("已存在同名项目"); return null; }
  var idx = state.nextColorIndex % PALETTE.length;
  state.nextColorIndex = idx + 1;
  var pid = newId("p");
  state.projects.push({
    id: pid, name: name, colorIndex: idx,
    targetMinutes: null, dailyLimit: null, createdAt: Date.now(),
    sortIndex: nextSortIndex(), group: currentAddInlineGroup()
  });
  return pid;
}

/** 补记弹窗的项目下拉：按三组 optgroup 分组 + 事来则应；组内沿用 sortIndex 降序；只读 state。 */
function projectOptionsHTML() {
  var ps = Array.isArray(state.projects) ? state.projects : [];
  var defs = [
    { key: GROUP_MORE, label: "多多益善" },
    { key: GROUP_LESS, label: "适可而止" },
    { key: GROUP_FLOW, label: "如实知见" },
    { key: "chore", label: CHORE_NAME }
  ];
  var buckets = {};
  for (var d = 0; d < defs.length; d++) buckets[defs[d].key] = [];
  for (var i = 0; i < ps.length; i++) {
    var p = ps[i];
    var k = (isSystemChore(p) || isChoreProject(p)) ? "chore" : groupOf(p);
    if (!buckets[k]) k = GROUP_MORE;
    buckets[k].push(p);
  }
  var html = "";
  for (var j = 0; j < defs.length; j++) {
    var items = buckets[defs[j].key];
    if (!items.length) continue;
    items.sort(function (x, y) { return sortIndexOf(y) - sortIndexOf(x); });
    html += '<optgroup label="' + esc(defs[j].label) + '">';
    for (var m = 0; m < items.length; m++) {
      html += '<option value="' + esc(items[m].id) + '">' + esc(items[m].name) + '</option>';
    }
    html += '</optgroup>';
  }
  return html;
}

/** 补记弹窗内实时预览：沿用「不足 1 分钟按 1 分钟」口径，与编辑弹窗同款样式 */
function refreshAddPreview() {
  var root = document.getElementById("modal-root");
  if (!root) return;
  var st = root.querySelector("#add-start"), en = root.querySelector("#add-end");
  var box = root.querySelector("#add-preview");
  if (!st || !en || !box) return;
  var a = parseClockHM(st.value), b = parseClockHM(en.value);
  if (!a || !b) {
    box.textContent = "请填写开始和结束时间";
    box.className = "edit-preview invalid";
    return;
  }
  var diff = (b.h * 60 + b.m) - (a.h * 60 + a.m);
  if (diff <= 0) {
    box.textContent = "结束时间需晚于开始时间";
    box.className = "edit-preview invalid";
    return;
  }
  box.textContent = "将新增 " + Math.max(1, diff) + " 分钟";
  box.className = "edit-preview";
}

/** 打开「补记一段时间」弹窗：复用编辑弹窗同一套布局，多一个项目下拉与「日期」字段。
    hour 为 0–23：从时间轴某个空白小时进入（默认时段取该小时最长空白）；
    hour 传 null：从「历史记录」进入（默认时段取所选日期当天最长空白）。
    dayKey 默认北京时间今天，可改到过去：补到哪天就算在哪天，不计入今天。
    第二十一轮：项目下拉下方增加「＋ 直接新建项目」内联区，可在弹窗内建项目并一次保存。 */
function openAddHourRecordModal(hour, dayKey) {
  var h = (hour === null || hour === undefined || hour === "") ? null : Number(hour);
  if (h !== null && (!Number.isInteger(h) || h < 0 || h > 23)) return;
  var opts = projectOptionsHTML();
  var autoInline = !opts; /* 一个可选项目都没有时，直接展开内联新建区，不再把人赶走 */
  var today = bjTodayKey();
  var dk = isValidDayKey(dayKey) ? dayKey : today;
  if (dk > today) dk = today;
  var range = (h === null) ? defaultAddRangeForDay(dk) : defaultAddRange(h, dk);
  var desc = (h === null)
    ? "日期默认今天，可改到过去 · 补到哪天算哪天"
    : (timelineClock(h * 60) + "–" + timelineClock((h + 1) * 60) + " · 可改日期，补到哪天算哪天");
  var inlineHTML =
    '<button type="button" class="add-inline-toggle" id="add-inline-toggle" data-action="add-inline-new">' +
      (autoInline ? "收起新建项目" : "＋ 直接新建项目") + '</button>' +
    '<div class="add-inline-box' + (autoInline ? " open" : "") + '" id="add-inline-box">' +
      '<label class="edit-note-label" for="add-new-name">新项目名称（最多 10 个字，不可重名）</label>' +
      '<input id="add-new-name" class="modal-input" type="text" placeholder="例如：写周报" autocomplete="off">' +
      '<label class="edit-note-label">归到哪一组</label>' +
      '<div class="add-group-row" id="add-group-row">' +
        '<button type="button" class="add-group-chip active" data-action="add-inline-group" data-group="more">多多益善</button>' +
        '<button type="button" class="add-group-chip" data-action="add-inline-group" data-group="less">适可而止</button>' +
        '<button type="button" class="add-group-chip" data-action="add-inline-group" data-group="flow">如实知见</button>' +
      '</div>' +
      '<div class="add-inline-hint">将同时创建这个项目，并把这一段记到它名下。目标 / 上限留空，保存后可在项目卡片上再设置。</div>' +
    '</div>';
  var panel =
    '<div class="modal-title">补记一段时间</div>' +
    '<div class="modal-desc">' + desc + ' · 日期按北京时间</div>' +
    '<label class="edit-note-label" for="add-date">日期（默认今天，可改到过去）</label>' +
    '<input id="add-date" class="modal-input add-date-input" type="date" value="' + esc(dk) + '" max="' + esc(today) + '">' +
    '<label class="edit-note-label" for="add-project">事项（项目）</label>' +
    '<select id="add-project" class="modal-input modal-select"' + (autoInline ? ' disabled' : '') + '>' +
      (opts || '<option value="">（暂无可选项目，请在下方新建）</option>') + '</select>' +
    inlineHTML +
    '<div class="edit-time-row">' +
      '<div class="edit-time-field"><label for="add-start">开始时间</label>' +
        '<input id="add-start" class="modal-input" type="time" value="' + range.start + '"></div>' +
      '<div class="edit-time-field"><label for="add-end">结束时间</label>' +
        '<input id="add-end" class="modal-input" type="time" value="' + range.end + '"></div>' +
    '</div>' +
    '<label class="edit-note-label" for="add-note">备注（最多 50 字，可留空）</label>' +
    '<input id="add-note" class="modal-input" type="text" maxlength="50" ' +
      'placeholder="可留空" autocomplete="off">' +
    '<div class="edit-preview" id="add-preview"></div>' +
    '<div class="modal-error" id="modal-error"></div>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-outline" data-action="modal-cancel">取消</button>' +
      '<button class="btn btn-primary" data-action="modal-confirm">保存</button>' +
    '</div>';
  openModalShell(panel, {
    kind: "add-hour-record",
    onConfirm: function () {
      var root = document.getElementById("modal-root");
      if (!root) return false;
      var dt = root.querySelector("#add-date"),
          sel = root.querySelector("#add-project"),
          st = root.querySelector("#add-start"),
          en = root.querySelector("#add-end"),
          nt = root.querySelector("#add-note");
      var inline = isAddInlineNew();
      var newName = "";
      if (inline) {
        var nm = root.querySelector("#add-new-name");
        newName = nm ? String(nm.value === null || nm.value === undefined ? "" : nm.value).trim() : "";
      }
      var ok = saveHourRecord(inline ? "" : (sel ? sel.value : ""),
        st ? st.value : "", en ? en.value : "", nt ? nt.value : "",
        dt ? dt.value : "", inline);
      if (ok && inline) {
        var dk2 = dt ? dt.value : "", t2 = bjTodayKey();
        showToast("已创建《" + newName + "》并补记" + (dk2 && dk2 !== t2 ? "到 " + dk2 : ""));
      }
      return ok;
    }
  });
  var stEl = document.getElementById("add-start"), enEl = document.getElementById("add-end");
  if (stEl) stEl.oninput = refreshAddPreview;
  if (enEl) enEl.oninput = refreshAddPreview;
  refreshAddPreview();
}

/** 保存补记：校验 → 往「所选日期」该项目桶追加一段 finished 段 → save()/render()。
    dayKey 默认北京时间今天；补到过去日期时只写那一天，绝不计入今天，
    且 currentDayKey 保持今天口径不变（避免误触发跨天规范化）。
    校验：结束>开始、日期合法且不晚于北京时间今天、结束不晚于现在、备注截断 50 字。 */
function saveHourRecord(pid, startStr, endStr, noteStr, dayKey, inlineNew) {
  var now = Date.now();
  syncRolloverForNow(now);
  var today = bjTodayKey();
  var dk = isValidDayKey(dayKey) ? dayKey : today;
  if (dk > today) { showModalError("不能补记未来的日期"); return false; }
  /* 普通路径保持原报错顺序：先查项目；内联新建路径此时项目还没创建，跳过此步 */
  if (!inlineNew) {
    var pre = getProject(pid);
    if (!pre) { showModalError("请选择要补记的项目"); return false; }
  }
  var a = parseClockHM(startStr), b = parseClockHM(endStr);
  if (!a || !b) { showModalError("请填写有效的开始和结束时间"); return false; }
  var midnight = midnightOf(dk);
  var startTs = midnight + (a.h * 60 + a.m) * 60000;
  var endTs = midnight + (b.h * 60 + b.m) * 60000;
  if (endTs <= startTs) { showModalError("结束时间必须晚于开始时间"); return false; }
  if (endTs > now) { showModalError("结束时间不能晚于现在"); return false; }
  /* 内联新建：所有校验通过后才建项目，保证「补记失败不会残留空项目」；
     创建后与普通路径共用同一次 save()/render()，一次落盘原子完成 */
  var p;
  if (inlineNew) {
    var newPid = createProjectInline();
    if (!newPid) return false;
    pid = newPid;
    p = getProject(pid);
  } else {
    p = getProject(pid);
  }
  var note = Array.from(String(noteStr === null || noteStr === undefined ? "" : noteStr)).slice(0, 50).join("");
  /* 超额提示只属于「今天」：补到过去日期时不弹，避免与今日统计混淆 */
  var oldOver = 0;
  if (dk === today) {
    var before = limitRowsForDay(dk, now);
    for (var i = 0; i < before.length; i++) if (before[i].projectId === pid) { oldOver = before[i].over; break; }
  }
  ensureBucket(state.days, dk, pid).push({
    id: newId("s"), start: startTs, end: endTs,
    endType: "finished", note: note, sourceProject: ""
  });
  if (dk !== today) {
    historyDayKey = dk; /* 补记后历史卡片自动切到这一天，方便立刻核对 */
    showToast("已补记到 " + dk);
  }
  save();
  render();
  /* 补到今天且「适可而止」项目从没超额变超额，弹一次橙色提示条（口径不变） */
  if (dk === today && groupOf(p) === GROUP_LESS) {
    var after = limitRowsForDay(dk, now), newOver = 0;
    for (var j = 0; j < after.length; j++) if (after[j].projectId === pid) { newOver = after[j].over; break; }
    if (oldOver <= 0 && newOver > 0) showLimitNotice("《" + p.name + "》今天已超 " + newOver + " 分钟");
  }
  return true;
}


function toggleProjMenu(pid, anchorEl) {

          '<button class="menu-item danger" data-action="menu-delete" data-id="' + esc(pid) + '">删除项目</button>'

function showToast(text) {
  var el = document.getElementById("toast");

}

/* -------------------- 七、今日记录卡 canvas -------------------- */

function roundRect(ctx, x, y, w, h, r) {
  var rr = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

/** canvas 文本按最大宽度截断加省略号，避免长项目名溢出卡片 */
function fitText(ctx, text, maxWidth) {
  var t = String(text === null || text === undefined ? "" : text);
  if (ctx.measureText(t).width <= maxWidth) return t;
  var arr = Array.from(t);
  while (arr.length > 1 && ctx.measureText(arr.join("") + "…").width > maxWidth) arr.pop();
  return arr.join("") + "…";
}

/** 用系统字体栈纯绘制（不引入任何跨域图片，保证 toDataURL 不被污染） */
function drawCardCanvas(canvas, stats, now) {
  var W = 750;
  var n = stats.perProject.length;
  /* 两段分组标签各占 52px（有记录时才画），项目行仍为 96px */
  var H = Math.max(1000, 700 + n * 96 + (n > 0 ? 104 : 0));
  canvas.width = W * 2;
  canvas.height = H * 2;
  canvas.style.width = "100%";
  canvas.style.height = "auto";
  canvas.style.display = "block";
  var ctx = canvas.getContext("2d");
  if (!ctx) return;
  ctx.scale(2, 2); /* 2 倍位图，逻辑坐标仍按 750×H 绘制 */

  var left = 76, right = 674;
  var limitByPid = {};
  var lrows = limitRowsForDay(dayKeyOf(now), now);
  for (var li = 0; li < lrows.length; li++) limitByPid[lrows[li].projectId] = lrows[li];

  ctx.fillStyle = "#EDF3FC";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = "rgba(35, 75, 140, 0.14)";
  ctx.shadowBlur = 28;
  ctx.shadowOffsetY = 10;
  ctx.fillStyle = "#FFFFFF";
  roundRect(ctx, 36, 36, W - 72, H - 72, 30);
  ctx.fill();
  ctx.restore();

  /* 头像 + 「时」 */
  ctx.fillStyle = "#2F7DF6";
  ctx.beginPath(); ctx.arc(left + 42, 132, 42, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "bold 36px " + FONT_STACK;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("时", left + 42, 134);

  ctx.fillStyle = "#8A94A6"; ctx.font = "24px " + FONT_STACK;

  ctx.fillStyle = "#2F7DF6"; ctx.font = "bold 68px " + FONT_STACK;
  ctx.fillText(formatMinutes(stats.totalMinutes), left, 344);
  ctx.fillText(stats.percent + "%", 410, 344);

  var barY = 382, barW = right - left, barH = 14;
  ctx.fillStyle = "#E8EDF5";
  roundRect(ctx, left, barY, barW, barH, 7); ctx.fill();
  var ratio = stats.hasTarget ? Math.min(Math.max(stats.ratio, 0), 1) : 0;
  if (ratio > 0) {
    var bw = Math.max(2, barW * ratio);
    ctx.fillStyle = "#2F7DF6";
    roundRect(ctx, left, barY, bw, barH, Math.min(7, bw / 2)); ctx.fill();
  }

    var moreItems = [], lessItems = [], flowItems = [], choreItems = [];

/** 预览与保存同一张位图：直接把 canvas.toDataURL 的 PNG 放进 img 元素，逐像素一致 */
function saveCardImage() {
  var canvas = document.getElementById("card-canvas");
  if (!canvas) return;
  var url = "";
  try { url = canvas.toDataURL("image/png"); }
  catch (e) { showModalError("图片生成失败，请重试"); return; }
  var holder = document.getElementById("card-preview");
  if (holder) {
    var img = document.createElement("img");
    img.src = url;
    img.alt = "我的今日记录卡";
    img.className = "card-image";
    holder.innerHTML = "";
    holder.appendChild(img);
  }
  var hint = document.getElementById("card-hint");
  if (hint) hint.textContent = "长按图片保存到相册";
  var btn = document.getElementById("btn-save-image");
  if (btn) { btn.textContent = "已生成图片"; btn.disabled = true; btn.classList.add("btn-disabled"); }
  try {
    var a = document.createElement("a");
    a.href = url;
    a.download = "我的时间记录-" + dayKeyOf(Date.now()) + ".png";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (e) { /* 桌面自动下载失败不影响移动端长按保存 */ }
}
